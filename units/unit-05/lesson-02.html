<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-sanjiaoxing-bian-angle-v1-storybook-v2", "title": "三角形的三边关系与内角和", "scenes": [{"id": "S01", "title": "情境：小棒能围成三角形吗", "start": 0, "end": 27.87, "narration": "小林和小禾想用小棒，给模型小桥搭几个三角形支架。桌上有长长短短的小棒。拿出三根，就一定能围成三角形吗？不是随便三根都能围成的。不信你试试：两根短的和一根长的，如果两根短的加起来还没有长的那根长，就围不起来了。到底什么样的三根小棒才能围成三角形呢？", "fields": [{"id": "s01-predict", "type": "choice", "prompt": "下面哪组小棒能围成三角形？", "options": [{"id": "a", "label": "3cm、4cm、8cm"}, {"id": "b", "label": "5cm、6cm、7cm"}, {"id": "c", "label": "2cm、3cm、6cm"}], "answer": "b"}]}, {"id": "S02", "title": "实验：三边关系", "start": 27.87, "end": 44.12, "narration": "到实验台动手试一试。这里有几组不同长度的小棒，把它们拖到一起拼一拼，看看哪些组合能围成三角形，哪些围不成。围成之后，算一算任意两边之和是不是都大于第三边。", "fields": [{"id": "lab-triangle-edges-finding", "type": "observe", "prompt": "实验台：拼一拼，记录哪些组合能围成三角形。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>实验台 · 三角形三边关系\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft Yahei\",sans-serif}\n  .container{max-width:1280px;margin:0 auto;padding:20px}\n  canvas{display:block;margin:0 auto;border-radius:16px;background:#FFF;touch-action:none;cursor:pointer}\n  .title-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}\n  .badge{background:#1A3A3A;color:#FFF;padding:6px 16px;border-radius:15px;font-size:14px;letter-spacing:2px}\n  h1{font-size:28px;color:#22333C;margin:0}\n  .underline{height:5px;background:#E8B94A;border-radius:3px;margin-top:4px}\n  p.subtitle{font-size:16px;color:#53675E;margin:4px 0 16px}\n  .label{font-size:18px;font-weight:bold;color:#1A3A3A;margin-bottom:8px}\n  .status-bar{display:flex;gap:20px;margin-top:16px;align-items:center;flex-wrap:wrap}\n  .status{padding:10px 20px;border-radius:20px;font-size:16px;font-weight:bold}\n  .status.pending{background:#F3EBDD;color:#53675E}\n  .status.success{background:#A4D4C5;color:#1A3A3A}\n  .status.fail{background:#FFD5CF;color:#FF6B5A}\n  .btn{padding:10px 24px;border-radius:20px;border:none;font-size:15px;font-weight:bold;cursor:pointer}\n  .btn-reset{background:#FF6B5A;color:#FFF}\n  .btn-record{background:#E8B94A;color:#FFF}\n  .log-box{margin-top:16px;padding:14px;background:#FFF;border-radius:12px;border:1.5px solid #E3D5C0;font-size:14px;color:#22333C;min-height:60px}\n  .groups{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}\n  .group-btn{padding:12px 24px;border-radius:16px;border:3px solid #E3D5C0;background:#FFF;font-size:16px;font-weight:bold;color:#22333C;cursor:pointer;transition:all 0.2s}\n  .group-btn:hover{border-color:#E8B94A}\n  .group-btn.selected{border-color:#1A3A3A;background:#F3EBDD}\n  .group-btn.tested-ok{border-color:#A4D4C5;background:#E8F8F0}\n  .group-btn.tested-fail{border-color:#FF6B5A;background:#FFF0EE}\n  .rule-box{margin-top:16px;padding:16px;background:#E8F8F0;border-radius:12px;font-size:16px;color:#1A3A3A;font-weight:bold;display:none}\n\u003c/style>\n\u003cstyle>canvas,svg{max-width:100%;height:auto}svg{touch-action:none}.status-bar{flex-wrap:wrap}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n  \u003cdiv class=\"title-bar\">\n    \u003cspan class=\"badge\">实验台 · 三边关系\u003c/span>\n  \u003c/div>\n  \u003ch1>拼一拼：哪些小棒能围成三角形？\u003c/h1>\n  \u003cdiv class=\"underline\" style=\"width:360px\">\u003c/div>\n  \u003cp class=\"subtitle\">选一组小棒，点\"试一试\"看看能不能围成三角形。围成后算一算任意两边之和是否大于第三边。\u003c/p>\n\n  \u003cdiv class=\"label\">选择小棒组：\u003c/div>\n  \u003cdiv class=\"groups\" id=\"groupBtns\">\n    \u003cbutton class=\"group-btn\" data-idx=\"0\">3cm, 4cm, 8cm\u003c/button>\n    \u003cbutton class=\"group-btn\" data-idx=\"1\">5cm, 6cm, 7cm\u003c/button>\n    \u003cbutton class=\"group-btn\" data-idx=\"2\">2cm, 3cm, 6cm\u003c/button>\n    \u003cbutton class=\"group-btn\" data-idx=\"3\">4cm, 5cm, 6cm\u003c/button>\n    \u003cbutton class=\"group-btn\" data-idx=\"4\">1cm, 2cm, 5cm\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"label\">实验区：\u003c/div>\n  \u003ccanvas id=\"labCanvas\" width=\"800\" height=\"400\">\u003c/canvas>\n\n  \u003cdiv class=\"status-bar\">\n    \u003cdiv id=\"statusBadge\" class=\"status pending\">选一组小棒试一试\u003c/div>\n    \u003cbutton class=\"btn btn-reset\" onclick=\"resetLab()\">重新选\u003c/button>\n    \u003cbutton class=\"btn btn-record\" onclick=\"recordFinding()\">写下我的发现\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"rule-box\" id=\"ruleBox\">\n    结论：三角形任意两边之和大于第三边。\n  \u003c/div>\n\n  \u003cdiv class=\"log-box\" id=\"logBox\">实验记录：等待你的操作……\u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\nconst canvas = document.getElementById('labCanvas');\nconst ctx = canvas.getContext('2d');\n\nconst GROUPS = [\n  { sticks: [3, 4, 8], label: '3cm, 4cm, 8cm' },\n  { sticks: [5, 6, 7], label: '5cm, 6cm, 7cm' },\n  { sticks: [2, 3, 6], label: '2cm, 3cm, 6cm' },\n  { sticks: [4, 5, 6], label: '4cm, 5cm, 6cm' },\n  { sticks: [1, 2, 5], label: '1cm, 2cm, 5cm' },\n];\n\nconst SCALE = 30;\nconst COLORS = ['#FF6B5A', '#E8B94A', '#A4D4C5'];\n\nlet selectedGroup = -1;\nlet testedGroups = {};\nlet animPhase = 0;\nlet animTimer = null;\nlet tryResult = null;\n\nconst btns = document.querySelectorAll('.group-btn');\nbtns.forEach(btn => {\n  btn.addEventListener('click', () => {\n    btns.forEach(b => b.classList.remove('selected'));\n    btn.classList.add('selected');\n    selectedGroup = parseInt(btn.dataset.idx);\n    tryResult = null;\n    animPhase = 0;\n    if (animTimer) clearInterval(animTimer);\n    draw();\n    log(`选了 ${GROUPS[selectedGroup].label}`);\n    updateStatus('pending', '点\"试一试\"看看能不能围成');\n  });\n});\n\nfunction canFormTriangle(a, b, c) {\n  return a + b > c && a + c > b && b + c > a;\n}\n\nfunction tryBuild() {\n  if (selectedGroup \u003c 0) return;\n  const g = GROUPS[selectedGroup];\n  const [a, b, c] = g.sticks;\n  const ok = canFormTriangle(a, b, c);\n  tryResult = ok;\n  testedGroups[selectedGroup] = ok;\n\n  const btn = btns[selectedGroup];\n  btn.classList.remove('selected');\n  btn.classList.add(ok ? 'tested-ok' : 'tested-fail');\n\n  animPhase = 1;\n  animateTry(ok);\n\n  if (ok) {\n    updateStatus('success', `${g.label} 能围成三角形 ✓`);\n    const checks = [\n      `${a}+${b}=${a+b} > ${c} ✓`,\n      `${a}+${c}=${a+c} > ${b} ✓`,\n      `${b}+${c}=${b+c} > ${a} ✓`,\n    ];\n    log(`${g.label}：能围成！验证：${checks.join('，')}`);\n  } else {\n    updateStatus('fail', `${g.label} 围不成 ✗`);\n    const s = [...g.sticks].sort((x, y) => x - y);\n    log(`${g.label}：围不成！${s[0]}+${s[1]}=${s[0]+s[1]} \u003c ${s[2]}，两根短的加起来不够长`);\n  }\n\n  const allTested = Object.keys(testedGroups).length >= GROUPS.length;\n  if (allTested) {\n    document.getElementById('ruleBox').style.display = 'block';\n  }\n}\n\nfunction animateTry(ok) {\n  let frame = 0;\n  if (animTimer) clearInterval(animTimer);\n  animTimer = setInterval(() => {\n    frame++;\n    animPhase = Math.min(frame / 20, 1);\n    draw();\n    if (frame >= 20) {\n      clearInterval(animTimer);\n      animTimer = null;\n    }\n  }, 40);\n}\n\nfunction draw() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n  if (selectedGroup \u003c 0) {\n    ctx.fillStyle = '#53675E';\n    ctx.font = '20px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText('← 先选一组小棒', canvas.width / 2, canvas.height / 2);\n    return;\n  }\n\n  const g = GROUPS[selectedGroup];\n  const [a, b, c] = g.sticks;\n  const ok = tryResult !== null ? tryResult : canFormTriangle(a, b, c);\n\n  if (tryResult === null) {\n    // Show sticks laid out\n    const baseY = 200;\n    let x = 100;\n    g.sticks.forEach((s, i) => {\n      const w = s * SCALE;\n      ctx.fillStyle = COLORS[i];\n      ctx.beginPath();\n      ctx.roundRect(x, baseY, w, 20, 10);\n      ctx.fill();\n      ctx.fillStyle = '#22333C';\n      ctx.font = 'bold 16px sans-serif';\n      ctx.textAlign = 'center';\n      ctx.fillText(`${s}cm`, x + w / 2, baseY - 10);\n      x += w + 30;\n    });\n\n    ctx.fillStyle = '#53675E';\n    ctx.font = '18px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText('点击下方按钮试一试', canvas.width / 2, 320);\n\n    // Add try button area\n    ctx.fillStyle = '#E8B94A';\n    ctx.beginPath();\n    ctx.roundRect(320, 340, 160, 44, 22);\n    ctx.fill();\n    ctx.fillStyle = '#FFF';\n    ctx.font = 'bold 18px sans-serif';\n    ctx.fillText('试一试', 400, 367);\n    return;\n  }\n\n  // Show result\n  const cx = canvas.width / 2;\n  const cy = 180;\n\n  if (ok) {\n    // Draw triangle\n    const maxS = Math.max(a, b, c);\n    const triScale = 120 / maxS;\n    const sa = a * triScale, sb = b * triScale, sc = c * triScale;\n    // Triangle vertices using law of cosines\n    const Ax = cx, Ay = cy - 60;\n    const Bx = cx - sc / 2, By = cy + 60;\n    const Cx2 = cx + sc / 2, Cy2 = cy + 60;\n\n    const progress = animPhase;\n    ctx.globalAlpha = progress;\n\n    // Fill\n    ctx.beginPath();\n    ctx.moveTo(Ax, Ay);\n    ctx.lineTo(Bx, By);\n    ctx.lineTo(Cx2, Cy2);\n    ctx.closePath();\n    ctx.fillStyle = 'rgba(164,212,197,0.3)';\n    ctx.fill();\n\n    // Edges\n    const edges = [[Ax,Ay,Bx,By,a],[Bx,By,Cx2,Cy2,c],[Ax,Ay,Cx2,Cy2,b]];\n    edges.forEach(([x1,y1,x2,y2,len], i) => {\n      ctx.beginPath();\n      ctx.moveTo(x1,y1);\n      ctx.lineTo(x2,y2);\n      ctx.strokeStyle = COLORS[i];\n      ctx.lineWidth = 5;\n      ctx.lineCap = 'round';\n      ctx.stroke();\n      const mx = (x1+x2)/2, my = (y1+y2)/2;\n      ctx.fillStyle = '#22333C';\n      ctx.font = 'bold 16px sans-serif';\n      ctx.textAlign = 'center';\n      ctx.fillText(`${len}cm`, mx + (i===0?-20:i===2?20:0), my + (i===1?20:-10));\n    });\n\n    ctx.globalAlpha = 1;\n\n    // Check marks\n    ctx.fillStyle = '#1A3A3A';\n    ctx.font = 'bold 22px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText('能围成 ✓', cx, 320);\n\n    // Show verification\n    ctx.font = '16px sans-serif';\n    ctx.fillStyle = '#53675E';\n    const checks = [\n      `${a}+${b}=${a+b} ${a+b>c?'>':'≤'} ${c} ${a+b>c?'✓':'✗'}`,\n      `${a}+${c}=${a+c} ${a+c>b?'>':'≤'} ${b} ${a+c>b?'✓':'✗'}`,\n      `${b}+${c}=${b+c} ${b+c>a?'>':'≤'} ${a} ${b+c>a?'✓':'✗'}`,\n    ];\n    checks.forEach((t, i) => {\n      ctx.fillText(t, cx, 350 + i * 24);\n    });\n  } else {\n    // Show failed attempt\n    const progress = animPhase;\n    ctx.globalAlpha = progress;\n\n    const baseY = 200;\n    const longest = Math.max(a, b, c);\n    const longIdx = g.sticks.indexOf(longest);\n\n    // Draw longest stick\n    const lw = longest * SCALE;\n    const lx = cx - lw / 2;\n    ctx.fillStyle = COLORS[longIdx];\n    ctx.beginPath();\n    ctx.roundRect(lx, baseY, lw, 20, 10);\n    ctx.fill();\n    ctx.fillStyle = '#22333C';\n    ctx.font = 'bold 16px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText(`${longest}cm`, cx, baseY - 10);\n\n    // Draw two short sticks trying to reach but failing\n    const shorts = g.sticks.filter((_, i) => i !== longIdx).sort((x, y) => y - x);\n    const shortSum = shorts[0] + shorts[1];\n\n    // Short stick 1 from left\n    const s1w = shorts[0] * SCALE;\n    ctx.fillStyle = COLORS[g.sticks.indexOf(shorts[0])];\n    ctx.beginPath();\n    ctx.roundRect(lx, baseY + 50, s1w, 16, 8);\n    ctx.fill();\n    ctx.fillStyle = '#22333C';\n    ctx.font = 'bold 14px sans-serif';\n    ctx.fillText(`${shorts[0]}cm`, lx + s1w / 2, baseY + 45);\n\n    // Short stick 2 from right\n    const s2w = shorts[1] * SCALE;\n    ctx.fillStyle = COLORS[g.sticks.indexOf(shorts[1])];\n    ctx.beginPath();\n    ctx.roundRect(lx + lw - s2w, baseY + 50, s2w, 16, 8);\n    ctx.fill();\n    ctx.fillStyle = '#22333C';\n    ctx.fillText(`${shorts[1]}cm`, lx + lw - s2w / 2, baseY + 45);\n\n    // Gap indicator\n    const gap = lw - s1w - s2w;\n    if (gap > 0) {\n      ctx.setLineDash([4, 4]);\n      ctx.strokeStyle = '#FF6B5A';\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(lx + s1w, baseY + 58);\n      ctx.lineTo(lx + lw - s2w, baseY + 58);\n      ctx.stroke();\n      ctx.setLineDash([]);\n      ctx.fillStyle = '#FF6B5A';\n      ctx.font = 'bold 14px sans-serif';\n      ctx.fillText(`差 ${longest - shortSum}cm`, cx, baseY + 90);\n    }\n\n    ctx.globalAlpha = 1;\n\n    ctx.fillStyle = '#FF6B5A';\n    ctx.font = 'bold 22px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText('围不成 ✗', cx, 320);\n\n    ctx.font = '16px sans-serif';\n    ctx.fillStyle = '#53675E';\n    ctx.fillText(`${shorts[0]}+${shorts[1]}=${shortSum} \u003c ${longest}`, cx, 350);\n    ctx.fillText('两根短的加起来还不够长的那根长', cx, 376);\n  }\n}\n\ncanvas.addEventListener('click', (e) => {\n  if (selectedGroup \u003c 0) return;\n  if (tryResult !== null) return;\n  const rect = canvas.getBoundingClientRect();\n  const scaleX = canvas.width / rect.width;\n  const scaleY = canvas.height / rect.height;\n  const x = (e.clientX - rect.left) * scaleX;\n  const y = (e.clientY - rect.top) * scaleY;\n  if (x >= 320 && x \u003c= 480 && y >= 340 && y \u003c= 384) {\n    tryBuild();\n  }\n});\n\nfunction updateStatus(type, msg) {\n  const badge = document.getElementById('statusBadge');\n  badge.className = 'status ' + type;\n  badge.textContent = msg;\n}\n\nfunction resetLab() {\n  selectedGroup = -1;\n  tryResult = null;\n  if (animTimer) clearInterval(animTimer);\n  animPhase = 0;\n  btns.forEach(b => {\n    b.classList.remove('selected', 'tested-ok', 'tested-fail');\n  });\n  testedGroups = {};\n  document.getElementById('ruleBox').style.display = 'none';\n  updateStatus('pending', '选一组小棒试一试');\n  draw();\n  log('已重置，重新选吧');\n}\n\nfunction log(msg) {\n  document.getElementById('logBox').textContent = '实验记录：' + msg;\n}\n\nfunction recordFinding(){if(window.parent!==window)window.parent.postMessage({type:'lab-focus',id:'lab-triangle-edges-finding'},'*');}\n\ndraw();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "instruction": "动手实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S03", "title": "推导：两点之间线段最短", "start": 44.12, "end": 68.5, "narration": "为什么会有这样的规律？看这里：从 A 点到 B 点，可以走直线，也可以走经过 C 点的弯路。两点之间线段最短，所以走直线的距离一定比走弯路短。也就是说，AC 加 CB 一定大于 AB。对三角形的每一条边都这样，就得到了：三角形任意两边之和大于第三边。", "fields": [{"id": "s03-fill", "type": "fill", "prompt": "三角形任意两边之和____第三边。", "answers": ["大于"]}]}, {"id": "S04", "title": "实验：三角形的内角和", "start": 68.5, "end": 90.03, "narration": "三角形还有一个重要的性质。用量角器分别量出三角形三个内角的度数，再算一算它们的和。你会发现，不管是什么形状的三角形，三个内角的和都接近 180 度。到实验台撕一撕、拼一拼，看看三个角拼在一起会变成什么。", "fields": [{"id": "lab-triangle-angles-finding", "type": "observe", "prompt": "实验台：撕下三个角拼一拼，记录你的发现。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>实验台 · 三角形的内角和\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft Yahei\",sans-serif}\n  .container{max-width:1280px;margin:0 auto;padding:20px}\n  canvas{display:block;margin:0 auto;border-radius:16px;background:#FFF;touch-action:none;cursor:pointer}\n  .title-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}\n  .badge{background:#1A3A3A;color:#FFF;padding:6px 16px;border-radius:15px;font-size:14px;letter-spacing:2px}\n  h1{font-size:28px;color:#22333C;margin:0}\n  .underline{height:5px;background:#E8B94A;border-radius:3px;margin-top:4px}\n  p.subtitle{font-size:16px;color:#53675E;margin:4px 0 16px}\n  .label{font-size:18px;font-weight:bold;color:#1A3A3A;margin-bottom:8px}\n  .step-bar{display:flex;gap:12px;margin-bottom:16px;align-items:center}\n  .step{padding:8px 18px;border-radius:16px;font-size:14px;font-weight:bold;background:#F3EBDD;color:#53675E}\n  .step.active{background:#E8B94A;color:#FFF}\n  .step.done{background:#A4D4C5;color:#1A3A3A}\n  .status-bar{display:flex;gap:20px;margin-top:16px;align-items:center;flex-wrap:wrap}\n  .status{padding:10px 20px;border-radius:20px;font-size:16px;font-weight:bold}\n  .status.pending{background:#F3EBDD;color:#53675E}\n  .status.success{background:#A4D4C5;color:#1A3A3A}\n  .btn{padding:10px 24px;border-radius:20px;border:none;font-size:15px;font-weight:bold;cursor:pointer}\n  .btn-reset{background:#FF6B5A;color:#FFF}\n  .btn-record{background:#E8B94A;color:#FFF}\n  .log-box{margin-top:16px;padding:14px;background:#FFF;border-radius:12px;border:1.5px solid #E3D5C0;font-size:14px;color:#22333C;min-height:60px}\n  .tri-select{display:flex;gap:16px;margin-bottom:16px}\n  .tri-btn{padding:12px 24px;border-radius:16px;border:3px solid #E3D5C0;background:#FFF;font-size:15px;font-weight:bold;color:#22333C;cursor:pointer}\n  .tri-btn.selected{border-color:#1A3A3A;background:#F3EBDD}\n\u003c/style>\n\u003cstyle>canvas,svg{max-width:100%;height:auto}svg{touch-action:none}.status-bar{flex-wrap:wrap}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n  \u003cdiv class=\"title-bar\">\n    \u003cspan class=\"badge\">实验台 · 内角和\u003c/span>\n  \u003c/div>\n  \u003ch1>撕一撕、拼一拼：三个角拼在一起是什么？\u003c/h1>\n  \u003cdiv class=\"underline\" style=\"width:400px\">\u003c/div>\n  \u003cp class=\"subtitle\">选一个三角形，依次点击三个角把它们\"撕\"下来，再拖到下面的直线上拼一拼。\u003c/p>\n\n  \u003cdiv class=\"label\">选择三角形：\u003c/div>\n  \u003cdiv class=\"tri-select\">\n    \u003cbutton class=\"tri-btn selected\" data-tri=\"0\">锐角三角形\u003c/button>\n    \u003cbutton class=\"tri-btn\" data-tri=\"1\">直角三角形\u003c/button>\n    \u003cbutton class=\"tri-btn\" data-tri=\"2\">钝角三角形\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"step-bar\">\n    \u003cdiv class=\"step active\" id=\"step1\">① 点击撕下∠1\u003c/div>\n    \u003cdiv class=\"step\" id=\"step2\">② 点击撕下∠2\u003c/div>\n    \u003cdiv class=\"step\" id=\"step3\">③ 点击撕下∠3\u003c/div>\n    \u003cdiv class=\"step\" id=\"step4\">④ 拖到直线上拼\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"label\">实验区：\u003c/div>\n  \u003ccanvas id=\"labCanvas\" width=\"800\" height=\"500\">\u003c/canvas>\n\n  \u003cdiv class=\"status-bar\">\n    \u003cdiv id=\"statusBadge\" class=\"status pending\">点击三角形的角开始实验\u003c/div>\n    \u003cbutton class=\"btn btn-reset\" onclick=\"resetLab()\">重新来\u003c/button>\n    \u003cbutton class=\"btn btn-record\" onclick=\"recordFinding()\">写下我的发现\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"log-box\" id=\"logBox\">实验记录：等待你的操作……\u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\nconst canvas = document.getElementById('labCanvas');\nconst ctx = canvas.getContext('2d');\n\nfunction triFromAngles(left,right,bx,by,w){const h=w/(1/Math.tan(left*Math.PI/180)+1/Math.tan(right*Math.PI/180));return [{x:bx+h/Math.tan(left*Math.PI/180),y:by-h},{x:bx,y:by},{x:bx+w,y:by}];}\nconst TRIANGLES = [\n  { name:'锐角三角形', verts:triFromAngles(60,70,280,300,240), angles:[50,60,70] },\n  { name:'直角三角形', verts:[{x:300,y:60},{x:300,y:300},{x:438.5640646,y:300}], angles:[30,90,60] },\n  { name:'钝角三角形', verts:triFromAngles(25,35,220,300,360), angles:[120,25,35] },\n];\n\nconst COLORS = ['#FF6B5A', '#E8B94A', '#A4D4C5'];\nconst ANGLabels = ['∠1', '∠2', '∠3'];\n\nlet selectedTri = 0;\nlet tornAngles = [false, false, false];\nlet dragAngle = -1;\nlet dragPos = null;\nlet placedAngles = [];\nlet experimentDone = false;\n\nconst triBtns = document.querySelectorAll('.tri-btn');\ntriBtns.forEach(btn => {\n  btn.addEventListener('click', () => {\n    triBtns.forEach(b => b.classList.remove('selected'));\n    btn.classList.add('selected');\n    selectedTri = parseInt(btn.dataset.tri);\n    resetState();\n    draw();\n    log(`选了${TRIANGLES[selectedTri].name}`);\n  });\n});\n\nfunction resetState() {\n  tornAngles = [false, false, false];\n  dragAngle = -1;\n  dragPos = null;\n  placedAngles = [];\n  experimentDone = false;\n  updateSteps(0);\n  updateStatus('pending', '点击三角形的角开始实验');\n}\n\nfunction getAnglePos(tri, idx) {\n  const v = tri.verts[idx];\n  const prev = tri.verts[(idx + 2) % 3];\n  const next = tri.verts[(idx + 1) % 3];\n  const midX = (prev.x + next.x) / 2;\n  const midY = (prev.y + next.y) / 2;\n  const dx = midX - v.x;\n  const dy = midY - v.y;\n  const d = Math.hypot(dx, dy);\n  return { x: v.x + dx / d * 40, y: v.y + dy / d * 40 };\n}\n\nfunction getPos(e) {\n  const rect = canvas.getBoundingClientRect();\n  const scaleX = canvas.width / rect.width;\n  const scaleY = canvas.height / rect.height;\n  const clientX = e.touches ? e.touches[0].clientX : e.clientX;\n  const clientY = e.touches ? e.touches[0].clientY : e.clientY;\n  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };\n}\n\nfunction draw() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  const tri = TRIANGLES[selectedTri];\n\n  // Draw triangle\n  ctx.beginPath();\n  ctx.moveTo(tri.verts[0].x, tri.verts[0].y);\n  ctx.lineTo(tri.verts[1].x, tri.verts[1].y);\n  ctx.lineTo(tri.verts[2].x, tri.verts[2].y);\n  ctx.closePath();\n  ctx.strokeStyle = '#22333C';\n  ctx.lineWidth = 3;\n  ctx.stroke();\n\n  // Draw angle arcs and labels\n  for (let i = 0; i \u003c 3; i++) {\n    if (tornAngles[i]) continue;\n    const v = tri.verts[i];\n    const pos = getAnglePos(tri, i);\n\n    // Arc\n    const a1 = Math.atan2(tri.verts[(i+1)%3].y - v.y, tri.verts[(i+1)%3].x - v.x);\n    const a2 = Math.atan2(tri.verts[(i+2)%3].y - v.y, tri.verts[(i+2)%3].x - v.x);\n    ctx.beginPath();\n    ctx.moveTo(v.x,v.y);let d=(a2-a1+Math.PI*3)%(Math.PI*2)-Math.PI;ctx.arc(v.x,v.y,30,a1,a1+d,d\u003c0);ctx.closePath();\n    ctx.fillStyle = COLORS[i] + '66';\n    ctx.fill();\n    ctx.strokeStyle = COLORS[i];\n    ctx.lineWidth = 3;\n    ctx.stroke();\n\n    // Label\n    ctx.fillStyle = COLORS[i];\n    ctx.font = 'bold 18px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.textBaseline = 'middle';\n    ctx.fillText(`${ANGLabels[i]}=${tri.angles[i]}°`, pos.x, pos.y);\n  }\n\n  // Draw torn indicators\n  for (let i = 0; i \u003c 3; i++) {\n    if (!tornAngles[i]) continue;\n    if (placedAngles.includes(i)) continue;\n    if (dragAngle === i) continue;\n    const v = tri.verts[i];\n    ctx.fillStyle = COLORS[i] + '88';\n    ctx.beginPath();\n    ctx.arc(v.x, v.y, 20, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.fillStyle = '#FFF';\n    ctx.font = 'bold 14px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.textBaseline = 'middle';\n    ctx.fillText(ANGLabels[i], v.x, v.y);\n  }\n\n  // Draw placement line\n  const lineY = 440;\n  ctx.setLineDash([6, 4]);\n  ctx.strokeStyle = '#E3D5C0';\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(150, lineY);\n  ctx.lineTo(650, lineY);\n  ctx.stroke();\n  ctx.setLineDash([]);\n\n  ctx.fillStyle = '#53675E';\n  ctx.font = '14px sans-serif';\n  ctx.textAlign = 'center';\n  if(!experimentDone)ctx.fillText('把撕下的角拖到这里拼在一起', 400, lineY + 25);\n\n  // Draw placed angles\n  let placeX = 250;\n  placedAngles.forEach(idx => {\n    drawPlacedAngle(idx, 400, lineY);\n    placeX += 100;\n  });\n\n  // Draw dragging angle\n  if (dragAngle >= 0 && dragPos) {\n    ctx.globalAlpha = 0.7;\n    ctx.fillStyle = COLORS[dragAngle];\n    ctx.beginPath();\n    ctx.arc(dragPos.x, dragPos.y, 25, 0, Math.PI * 2);\n    ctx.fill();\n    ctx.fillStyle = '#FFF';\n    ctx.font = 'bold 16px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.textBaseline = 'middle';\n    ctx.fillText(`${ANGLabels[dragAngle]}=${tri.angles[dragAngle]}°`, dragPos.x, dragPos.y);\n    ctx.globalAlpha = 1;\n  }\n\n  // Result\n  if (experimentDone) {\n    const sum = TRIANGLES[selectedTri].angles.reduce((a, b) => a + b, 0);\n    ctx.fillStyle = '#1A3A3A';\n    ctx.font = 'bold 24px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText(`${TRIANGLES[selectedTri].angles.join(' + ')} = ${sum}°`, 400, 490);\n    if (sum === 180) {\n      ctx.fillStyle = '#A4D4C5';\n      ctx.font = 'bold 20px sans-serif';\n      ctx.fillText('三个角拼成一个平角 = 180°！', 400, 465);\n    }\n  }\n}\n\nfunction drawPlacedAngle(idx, x, y) {\n  const tri = TRIANGLES[selectedTri];\n  const angle = tri.angles[idx];\n  const radius = 62;\n  const prior=placedAngles.slice(0,placedAngles.in root.addEventListener('keydown',e=>{e.stopPropagation();if(e.target.matches('input,textarea,select'))return;if(e.key===' '&&e.target===v){e.preventDefault();play.click();}});v.addEventListener('click',()=>play.click());Object.entries(state.answers).forEach(([id,value])=>sync(id,value));update();
})();
</script></body></html>
