<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-sanjiaoxing-tezheng-v1-storybook-v2", "title": "三角形的基本特征与分类", "scenes": [{"id": "S01", "title": "情境：生活中的三角形", "start": 0, "end": 24.72, "narration": "小林和小禾来到校园，寻找藏在身边的三角形。小桥的支架、屋顶的横梁，还有自行车的车架，都有它们的身影。把这些发现画在观察板上，一起研究吧。为什么这么多地方都用到了三角形？三角形到底有什么特别的地方？今天我们就一起来研究。", "fields": [{"id": "s01-observe", "type": "observe", "prompt": "观察上面的画面，想一想：生活中还有哪些地方用到了三角形？"}]}, {"id": "S02", "title": "基本特征与稳定性", "start": 24.72, "end": 46.75, "narration": "三条线段首尾相接围成的图形，叫作三角形。三角形有 3 条边、3 个顶点和 3 个角。拉一拉三角形框架，它不会变形，这就是三角形的稳定性。现在，到实验台动手试一试：用三根小棒围一个三角形，再拉一拉，看看它稳不稳。", "fields": [{"id": "lab-triangle-form-finding", "type": "observe", "prompt": "实验台：拖动小棒围一个三角形，再拉一拉，记录你的发现。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>三角形实验台 · 围成与稳定性\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft Yahei\",sans-serif}\n  .container{max-width:1280px;margin:0 auto;padding:20px}\n  canvas{display:block;margin:0 auto;border-radius:16px;background:#FFF;touch-action:none;cursor:crosshair}\n  .title-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}\n  .badge{background:#1A3A3A;color:#FFF;padding:6px 16px;border-radius:15px;font-size:14px;letter-spacing:2px}\n  h1{font-size:28px;color:#22333C;margin:0}\n  .subtitle{font-size:16px;color:#53675E;margin:4px 0 16px}\n  .underline{height:5px;background:#E8B94A;border-radius:3px;margin-top:4px}\n  .experiment-area{position:relative}\n  .label{font-size:18px;font-weight:bold;color:#1A3A3A;margin-bottom:8px}\n  .status-bar{display:flex;gap:20px;margin-top:16px;align-items:center}\n  .status{padding:10px 20px;border-radius:20px;font-size:16px;font-weight:bold}\n  .status.pending{background:#F3EBDD;color:#53675E}\n  .status.success{background:#A4D4C5;color:#1A3A3A}\n  .btn{padding:10px 24px;border-radius:20px;border:none;font-size:15px;font-weight:bold;cursor:pointer}\n  .btn-reset{background:#FF6B5A;color:#FFF}\n  .btn-record{background:#E8B94A;color:#FFF}\n  .log-box{margin-top:16px;padding:14px;background:#FFF;border-radius:12px;border:1.5px solid #E3D5C0;font-size:14px;color:#22333C;min-height:60px}\n  .stab-area{display:flex;gap:40px;margin-top:24px;justify-content:center}\n  .stab-card{padding:20px 40px;border-radius:16px;text-align:center;font-size:18px;font-weight:bold;cursor:grab;user-select:none}\n  .stab-quad{background:#FFF;border:3px solid #E8B94A;color:#E8B94A}\n  .stab-tri{background:#FFF;border:3px solid #A4D4C5;color:#1A3A3A}\n  .stab-hint{font-size:13px;color:#53675E;margin-top:8px}\n\u003c/style>\n\u003cstyle>canvas,svg{max-width:100%;height:auto}svg{touch-action:none}.status-bar{flex-wrap:wrap}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n  \u003cdiv class=\"title-bar\">\n    \u003cspan class=\"badge\">实验台 · 三角形特征\u003c/span>\n  \u003c/div>\n  \u003ch1>画一画、拉一拉：三角形有什么特别？\u003c/h1>\n  \u003cdiv class=\"underline\" style=\"width:320px\">\u003c/div>\n  \u003cp class=\"subtitle\">用手指（或鼠标）连接三个顶点，围成一个三角形。再拉一拉右边的图形，看看谁更稳定。\u003c/p>\n\n  \u003cdiv class=\"experiment-area\">\n    \u003cdiv class=\"label\">实验一：连一连，围成三角形\u003c/div>\n    \u003ccanvas id=\"drawCanvas\" width=\"800\" height=\"450\">\u003c/canvas>\n    \u003cdiv class=\"status-bar\">\n      \u003cdiv id=\"statusBadge\" class=\"status pending\">还没连完，再试试\u003c/div>\n      \u003cbutton class=\"btn btn-reset\" onclick=\"resetCanvas()\">重新画\u003c/button>\n      \u003cbutton class=\"btn btn-record\" onclick=\"recordFinding()\">写下我的发现\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"stab-area\">\n    \u003cdiv class=\"stab-card stab-quad\" id=\"quadCard\">\n      四边形\n      \u003cdiv class=\"stab-hint\">← 拉一拉 →\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"stab-card stab-tri\" id=\"triCard\">\n      三角形\n      \u003cdiv class=\"stab-hint\">← 拉一拉 →\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"log-box\" id=\"logBox\">实验记录：等待你的操作……\u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\nconst canvas = document.getElementById('drawCanvas');\nconst ctx = canvas.getContext('2d');\n\nconst VERTS = [\n  { x: 400, y: 80, label: 'A' },\n  { x: 180, y: 340, label: 'B' },\n  { x: 620, y: 340, label: 'C' }\n];\n\nlet drawnLines = [];\nlet isDrawing = false;\nlet currentLine = null;\nlet formSeen = false;\nlet quadSeen = false;\n\nfunction getPos(e) {\n  const rect = canvas.getBoundingClientRect();\n  const scaleX = canvas.width / rect.width;\n  const scaleY = canvas.height / rect.height;\n  const clientX = e.touches ? e.touches[0].clientX : e.clientX;\n  const clientY = e.touches ? e.touches[0].clientY : e.clientY;\n  return {\n    x: (clientX - rect.left) * scaleX,\n    y: (clientY - rect.top) * scaleY\n  };\n}\n\nfunction dist(a, b) {\n  return Math.hypot(a.x - b.x, a.y - b.y);\n}\n\nfunction nearestVert(p, threshold) {\n  for (let i = 0; i \u003c VERTS.length; i++) {\n    if (dist(p, VERTS[i]) \u003c threshold) return i;\n  }\n  return -1;\n}\n\nfunction draw() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n  // 画顶点\n  VERTS.forEach((v, i) => {\n    ctx.beginPath();\n    ctx.arc(v.x, v.y, 18, 0, Math.PI * 2);\n    ctx.fillStyle = '#FFF';\n    ctx.fill();\n    ctx.strokeStyle = '#E8B94A';\n    ctx.lineWidth = 3;\n    ctx.stroke();\n\n    ctx.fillStyle = '#E8B94A';\n    ctx.font = 'bold 16px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.textBaseline = 'middle';\n    ctx.fillText(v.label, v.x, v.y);\n  });\n\n  // 画已完成的连线\n  const colors = ['#A4D4C5', '#FFC9A3', '#B8A4ED'];\n  drawnLines.forEach((line, i) => {\n    ctx.beginPath();\n    ctx.moveTo(VERTS[line.from].x, VERTS[line.from].y);\n    ctx.lineTo(VERTS[line.to].x, VERTS[line.to].y);\n    ctx.strokeStyle = colors[i % 3];\n    ctx.lineWidth = 6;\n    ctx.lineCap = 'round';\n    ctx.stroke();\n  });\n\n  // 画正在画的线\n  if (currentLine) {\n    ctx.beginPath();\n    ctx.moveTo(VERTS[currentLine.from].x, VERTS[currentLine.from].y);\n    ctx.lineTo(currentLine.curX, currentLine.curY);\n    ctx.strokeStyle = colors[drawnLines.length % 3];\n    ctx.lineWidth = 6;\n    ctx.lineCap = 'round';\n    ctx.stroke();\n  }\n\n  // 如果三条边都连好了，画三角形轮廓\n  if (drawnLines.length === 3) {\n    ctx.beginPath();\n    ctx.moveTo(VERTS[0].x, VERTS[0].y);\n    ctx.lineTo(VERTS[1].x, VERTS[1].y);\n    ctx.lineTo(VERTS[2].x, VERTS[2].y);\n    ctx.closePath();\n    ctx.strokeStyle = '#FF6B5A';\n    ctx.lineWidth = 4;\n    ctx.stroke();\n  }\n}\n\nfunction startDraw(e) {\n  e.preventDefault();\n  const p = getPos(e);\n  const vi = nearestVert(p, 35);\n  if (vi \u003c 0) return;\n\n  // 检查这条边是否已经连过\n  const hasEdge = drawnLines.some(l =>\n    (l.from === vi) || (l.to === vi)\n  );\n\n  // 找到下一个未连的顶点\n  let target = -1;\n  for (let i = 0; i \u003c 3; i++) {\n    if (i === vi) continue;\n    const exists = drawnLines.some(l =>\n      (l.from === vi && l.to === i) || (l.from === i && l.to === vi)\n    );\n    if (!exists) { target = i; break; }\n  }\n\n  if (target \u003c 0) return;\n\n  isDrawing = true;\n  currentLine = { from: vi, to: target, curX: p.x, curY: p.y };\n  draw();\n}\n\nfunction moveDraw(e) {\n  if (!isDrawing || !currentLine) return;\n  e.preventDefault();\n  const p = getPos(e);\n  currentLine.curX = p.x;\n  currentLine.curY = p.y;\n  draw();\n}\n\nfunction endDraw(e) {\n  if (!isDrawing || !currentLine) return;\n  e.preventDefault();\n  const p = getPos(e);\n  const targetVert = VERTS[currentLine.to];\n\n  if (dist(p, targetVert) \u003c 40) {\n    drawnLines.push({ from: currentLine.from, to: currentLine.to });\n    log(`连好了第 ${drawnLines.length} 条边`);\n\n    if (drawnLines.length === 3) {\n      formSeen = true;\n      updateStatus(true);\n      log('围成了！三角形有3条边、3个顶点、3个角');\n    }\n  }\n  isDrawing = false;\n  currentLine = null;\n  draw();\n}\n\nfunction updateStatus(success) {\n  const badge = document.getElementById('statusBadge');\n  if (success) {\n    badge.className = 'status success';\n    badge.textContent = '围成了！三角形有3条边、3个顶点';\n  } else {\n    badge.className = 'status pending';\n    badge.textContent = `已连 ${drawnLines.length}/3 条边，继续`;\n  }\n}\n\nfunction resetCanvas() {\n  drawnLines = [];\n  currentLine = null;\n  isDrawing = false;\n  formSeen = false;\n  updateStatus(false);\n  document.getElementById('statusBadge').textContent = '还没连完，再试试';\n  draw();\n  log('已清空，重新画吧');\n}\n\nfunction log(msg) {\n  document.getElementById('logBox').textContent = '实验记录：' + msg;\n}\n\n// 稳定性实验\nlet stabDrag = null;\nconst quadCard = document.getElementById('quadCard');\nconst triCard = document.getElementById('triCard');\n\nfunction startStabDrag(e, type) {\n  e.preventDefault();\n  stabDrag = { type, startX: e.clientX || e.touches[0].clientX };\n}\n\nfunction moveStabDrag(e) {\n  if (!stabDrag) return;\n  const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;\n  const dx = (x - stabDrag.startX) * 0.4;\n  if (stabDrag.type === 'quad') {\n    quadCard.style.transform = `skewX(${dx * 0.3}deg)`;\n  } else {\n    const clamp = Math.max(-3, Math.min(3, dx * 0.1));\n    triCard.style.transform = `translateX(${clamp}px)`;\n    setTimeout(() => { triCard.style.transform = ''; }, 100);\n  }\n}\n\nfunction endStabDrag(e) {\n  if (!stabDrag) return;\n  if (stabDrag.type === 'quad') {\n    quadCard.style.transform = '';\n    quadSeen = true;\n    log('四边形拉得动，会变形；三角形拉不动——三角形更稳定！');\n  }\n  stabDrag = null;\n}\n\nquadCard.addEventListener('mousedown', e => startStabDrag(e, 'quad'));\nquadCard.addEventListener('touchstart', e => startStabDrag(e, 'quad'));\ntriCard.addEventListener('mousedown', e => startStabDrag(e, 'tri'));\ntriCard.addEventListener('touchstart', e => startStabDrag(e, 'tri'));\nwindow.addEventListener('mousemove', moveStabDrag);\nwindow.addEventListener('touchmove', moveStabDrag);\nwindow.addEventListener('mouseup', endStabDrag);\nwindow.addEventListener('touchend', endStabDrag);\n\nfunction recordFinding(){if(window.parent!==window)window.parent.postMessage({type:'lab-focus',id:'lab-triangle-form-finding'},'*');}\n\ncanvas.addEventListener('mousedown', startDraw);\ncanvas.addEventListener('mousemove', moveDraw);\ncanvas.addEventListener('mouseup', endDraw);\ncanvas.addEventListener('touchstart', startDraw);\ncanvas.addEventListener('touchmove', moveDraw);\ncanvas.addEventListener('touchend', endDraw);\n\ndraw();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "instruction": "动手实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S03", "title": "底和高", "start": 46.75, "end": 62.69, "narration": "从三角形的一个顶点向它的对边作一条垂线，顶点和垂足之间的线段，叫作三角形的高，这条对边叫作三角形的底。三角形有三条边，所以每条边上都可以画出对应的高。", "fields": [{"id": "s03-height", "type": "fill", "prompt": "从三角形的一个顶点向它的对边作一条垂线，顶点和垂足之间的线段叫作三角形的____。", "answers": ["高"]}]}, {"id": "S04", "title": "按角分类", "start": 62.69, "end": 81.22, "narration": "三角形还可以按角来分类。三个角都是锐角的，是锐角三角形；有一个角是直角的，是直角三角形；有一个角是钝角的，是钝角三角形。来，到分类实验台把下面的三角形分一分，看看你分得对不对。", "fields": [{"id": "lab-triangle-angle-classify-finding", "type": "observe", "prompt": "实验台：把三角形按角分类拖到对应的筐里，记录你的发现。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>三角形实验台 · 按角分类\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n  svg{display:block;width:100%;max-width:1280px;margin:0 auto;user-select:none;touch-action:none}\n  .card{cursor:grab}.card:active{cursor:grabbing}\n\u003c/style>\n\u003cstyle>canvas,svg{max-width:100%;height:auto}svg{touch-action:none}.status-bar{flex-wrap:wrap}\u003c/style>\u003c/head>\n\u003cbody>\n\u003csvg id=\"lab\" viewBox=\"0 0 1280 720\" xmlns=\"http://www.w3.org/2000/svg\">\u003c/svg>\n\u003cscript>\n'use strict';\nconst C = { canvas:'#FFFAF0', ink:'#22333C', inkSoft:'#53675E', coral:'#FF6B5A',\n            ochre:'#E8B94A', mint:'#A4D4C5', teal:'#1A3A3A', peach:'#FFC9A3', lav:'#B8A4ED' };\nconst NS = 'http://www.w3.org/2000/svg';\nconst svg = document.getElementById('lab');\nfunction el(name, attrs, parent) {\n  const e = document.createElementNS(NS, name);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  (parent || svg).appendChild(e);\n  return e;\n}\n\nconst defs = el('defs', {});\nconst soft = el('filter', { id:'soft', x:'-30%', y:'-30%', width:'160%', height:'160%' }, defs);\nel('feDropShadow', { dx:0, dy:5, stdDeviation:6, 'flood-color':'#1A3A3A', 'flood-opacity':0.18 }, soft);\nconst radial = el('radialGradient', { id:'glowbg', cx:'50%', cy:'40%', r:'78%' }, defs);\nel('stop', { offset:'0%', 'stop-color':'#FFFDF6' }, radial);\nel('stop', { offset:'100%', 'stop-color':'#FDF3DF' }, radial);\n\n/* 背景与标题 */\nel('rect', { x:0, y:0, width:1280, height:720, fill:'url(#glowbg)' });\nel('rect', { x:60, y:28, width:236, height:30, rx:15, fill:C.teal });\nel('text', { x:178, y:49, 'font-size':16, 'text-anchor':'middle', fill:'#FFF', 'letter-spacing':2 })\n  .textContent = '实验台 · 三角形按角分类';\nel('text', { x:60, y:98, 'font-size':32, 'font-weight':'bold', fill:C.ink })\n  .textContent = '分一分：这些三角形属于哪一类？';\nel('path', { d:'M 62 114 q 42 7 84 0 t 84 0 t 84 0 t 60 0', fill:'none', stroke:C.ochre, 'stroke-width':5, 'stroke-linecap':'round' });\nel('text', { x:60, y:146, 'font-size':17, fill:C.inkSoft })\n  .textContent = '3个角都是锐角的是锐角三角形；有1个直角的是直角三角形；有1个钝角的是钝角三角形。把三角形拖到对应的框里。';\n\n/* 三个分类框 */\nconst BINS = [\n  { id:'acute', label:'锐角三角形', sub:'3个锐角', x:100, y:200, color:C.mint },\n  { id:'right', label:'直角三角形', sub:'1个直角', x:480, y:200, color:C.peach },\n  { id:'obtuse', label:'钝角三角形', sub:'1个钝角', x:860, y:200, color:C.lav }\n];\n\nBINS.forEach(bin => {\n  el('rect', { x:bin.x, y:bin.y, width:300, height:280, rx:16, fill:'#FFF', 'fill-opacity':0.6, stroke:bin.color, 'stroke-width':3 });\n  el('text', { x:bin.x+150, y:bin.y+35, 'font-size':20, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal })\n    .textContent = bin.label;\n  el('text', { x:bin.x+150, y:bin.y+60, 'font-size':14, 'text-anchor':'middle', fill:C.inkSoft })\n    .textContent = bin.sub;\n});\n\n/* 待分类的三角形卡片 */\nconst TRI_CARDS = [\n  { id:0, pts:[[0,-40],[50,30],[-50,30]], correct:'acute', color:C.mint },      // 锐角\n  { id:1, pts:[[-40,-40],[60,30],[-40,30]], correct:'right', color:C.peach },     // 直角（近似）\n  { id:2, pts:[[-15,10],[65,30],[-55,30]], correct:'obtuse', color:C.lav },      // 钝角\n  { id:3, pts:[[0,-35],[45,25],[-45,25]], correct:'acute', color:C.mint },      // 锐角\n  { id:4, pts:[[-45,-35],[50,-35],[-45,30]], correct:'right', color:C.peach },     // 直角\n  { id:5, pts:[[10,10],[65,30],[-55,30]], correct:'obtuse', color:C.lav }       // 钝角\n];\n\nconst CARD_W = 120, CARD_H = 90;\nconst cards = [];\nlet correctCount = 0;\n\nfunction poolPos(i) {\n  return { x: 500 + (i%3)*280, y: 560 + Math.floor(i/3)*100 };\n}\n\nfunction makeCards() {\n  TRI_CARDS.forEach((tc, i) => {\n    const g = el('g', { class:'card', filter:'url(#soft)' });\n    el('rect', { x:-CARD_W/2, y:-CARD_H/2, width:CARD_W, height:CARD_H, rx:12,\n      fill:tc.color, stroke:'#FFF', 'stroke-width':2 }, g);\n    /* 小三角形 */\n    const scale = 0.8;\n    const pts = tc.pts.map(p => [p[0]*scale, p[1]*scale-10]).map(p=>p.join(',')).join(' ');\n    el('polygon', { points:pts, fill:'none', stroke:C.ink, 'stroke-width':2.5, 'stroke-linejoin':'round' }, g);\n    const c = { id:tc.id, correct:tc.correct, g, slot:'pool'+i, drag:null };\n    cards.push(c);\n    bindDrag(c);\n  });\n  layout(true);\n}\n\nfunction slotCenter(slot) {\n  if (slot.startsWith('pool')) return poolPos(Number(slot.slice(4)));\n  const binIdx = slot === 'acute' ? 0 : slot === 'right' ? 1 : 2;\n  const bin = BINS[binIdx];\n  const inBin = cards.filter(c => c.slot === slot);\n  const idx = 0;\n  return { x: bin.x + 80 + (idx%2)*140, y: bin.y + 120 + Math.floor(idx/2)*100 };\n}\n\nfunction binCenter(binId) {\n  const bin = BINS[binId === 'acute' ? 0 : binId === 'right' ? 1 : 2];\n  return { x: bin.x + 150, y: bin.y + 160 };\n}\n\n/* 布局 */\nfunction layout(instant) {\n  cards.forEach(c => {\n    if (c.drag) return;\n    const p = c.slot.startsWith('pool')?poolPos(Number(c.slot.slice(4))):(()=>{const b=BINS.find(b=>b.id===c.slot),i=cards.filter(a=>a.slot===c.slot).indexOf(c);return{x:b.x+80+(i%2)*140,y:b.y+125+Math.floor(i/2)*100};})();\n    c.g.setAttribute('transform', `translate(${p.x} ${p.y})`);\n    c.g.style.transition = instant ? 'none' : 'transform .4s cubic-bezier(.34,1.56,.64,1)';\n  });\n}\n\n/* 拖拽 */\nfunction svgPoint(evt) {\n  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction bindDrag(c) {\n  c.g.addEventListener('pointerdown', e => {\n    e.preventDefault();\n    const p = svgPoint(e);\n    const m = /translate\\(([-\\d.]+) ([-\\d.]+)\\)/.exec(c.g.getAttribute('transform') || 'translate(0 0)');\n    c.g.__x = m ? +m[1] : 0; c.g.__y = m ? +m[2] : 0;\n    c.drag = { dx: p.x - c.g.__x, dy: p.y - c.g.__y };\n    c.g.style.transition = 'none';\n    svg.appendChild(c.g);\n    c.g.setPointerCapture(e.pointerId);\n  });\n  c.g.addEventListener('pointermove', e => {\n    if (!c.drag) return;\n    const p = svgPoint(e);\n    c.g.__x = p.x - c.drag.dx; c.g.__y = p.y - c.drag.dy;\n    c.g.setAttribute('transform', `translate(${c.g.__x} ${c.g.__y})`);\n  });\n  c.g.addEventListener('pointerup', () => {\n    if (!c.drag) return;\n    c.drag = null;\n    /* 检查落入哪个框 */\n    let targetBin = null;\n    BINS.forEach(bin => {\n      if (c.g.__x > bin.x && c.g.__x \u003c bin.x+300 && c.g.__y > bin.y && c.g.__y \u003c bin.y+280) {\n        targetBin = bin.id;\n      }\n    });\n    if (targetBin) {\n      c.slot = targetBin;\n      if (targetBin === c.correct) {\n        correctCount=cards.filter(a=>a.slot===a.correct).length;\n        log(`第${c.id+1}个三角形分对了！它是${targetBin==='acute'?'锐角':targetBin==='right'?'直角':'钝角'}三角形。`);\n      } else {\n        log(`第${c.id+1}个三角形分错了，再想想。`);\n      }\n    } else {\n      /* 回到池子 */\n      const poolIdx = TRI_CARDS.findIndex(tc => tc.id === c.id);\n      c.slot = 'pool'+poolIdx;\n    }\n    layout(false);\n  });\n}\n\n/* 计算显示 */\nconst badge = el('g', {});\nconst bRect = el('rect', { x:440, y:560, width:400, height:40, rx:20, fill:C.mint, filter:'url(#soft)' }, badge);\nconst bText = el('text', { x:640, y:587, 'font-size':19, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal }, badge);\nbadge.setAttribute('opacity', '0');\n\n/* 记录 */\nconst logG = el('g', {});\nel('rect', { x:60, y:560, width:340, height:140, rx:14, fill:'#FFF', stroke:'#E3D5C0', 'stroke-width':1.5, filter:'url(#soft)' }, logG);\nel('text', { x:76, y:586, 'font-size':15, 'font-weight':'bold', fill:C.inkSoft }, logG).textContent = '实验记录';\nconst logText = el('text', { x:76, y:610, 'font-size':13, fill:C.ink }, logG);\nconst logLines = [];\nfunction log(s) {\n  logLines.push(s); if (logLines.length > 4) logLines.shift();\n  logText.innerHTML = '';\n  logLines.forEach((l, i) => {\n    const t = el('tspan', { x:76, dy:i ? 20 : 0 }, logText); t.textContent = l;\n  });\n}\n\nconst recG = el('g', {});\nel('rect', { x:76, y:660, width:160, height:30, rx:15, fill:C.coral }, recG);\nel('text', { x:156, y:681, 'font-size':14, 'text-anchor':'middle', fill:'#FFF', 'font-weight':'bold' }, recG).textContent = '写下我的发现';\nrecG.style.cursor = 'pointer';\nrecG.addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({type:'lab-focus',id:'lab-triangle-angle-classify-finding'},'*');});\n\n\n\nmakeCards();\nlayout(true);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "instruction": "动手实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S05", "title": "按边分类与圆规作图", "start": 81.22, "end": 109.0, "narration": "三角形也能按边来分。两条边相等的，是等腰三角形；三条边都相等的，是等边三角形，也叫正三角形。等边三角形一定是等腰三角形，但等腰三角形不一定是等边三角形。用圆规也能画出等边三角形：分别以线段两端点为圆心、以这条线段为半径画弧，两弧的交点就是第三个顶点。", "fields": [{"id": "s05-choice", "type": "choice", "prompt": "按边分类，三条边都相等的三角形专门叫作：", "options": [{"id": "a", "label": "不等边三角形"}, {"id": "b", "label": "只有两条边相等的三角形"}, {"id": "c", "label": "等边三角形（正三角形）"}], "answer": "c"}]}], "captions": [{"start": 0.44999999999999996, "end": 5.1499999999999995, "text": "小林和小禾来到校园，寻找藏在身边的三角形。"}, {"start": 5.1, "end": 10.9421053, "text": "小桥的支架、屋顶的横梁，还有自行车的车架，都有它们的身影。"}, {"start": 10.9421053, "end": 14.7184211, "text": "把这些发现画在观察板上，一起研究吧。"}, {"start": 16.016, "end": 19.253, "text": "为什么这么多地方都用到了三角形？"}, {"start": 19.253, "end": 22.068, "text": "三角形到底有什么特别的地方？"}, {"start": 22.068, "end": 24.661, "text": "今天我们就一起来研究。"}, {"start": 24.82, "end": 29.336, "text": "三条线段首尾相接围成的图形，叫作三角形。"}, {"start": 29.286, "end": 33.431, "text": "三角形有 3 条边、3 个顶点和 3 个角。"}, {"start": 33.431, "end": 38.865, "text": "拉一拉三角形框架，它不会变形，这就是三角形的稳定性。"}, {"start": 38.865, "end": 46.681, "text": "现在，到实验台动手试一试：用三根小棒围一个三角形，再拉一拉，看看它稳不稳。"}, {"start": 46.852, "end": 57.736, "text": "从三角形的一个顶点向它的对边作一条垂线，顶点和垂足之间的线段，叫作三角形的高，这条对边叫作三角形的底。"}, {"start": 57.686, "end": 62.634, "text": "三角形有三条边，所以每条边上都可以画出对应的高。"}, {"start": 62.788, "end": 65.435, "text": "三角形还可以按角来分类。"}, {"start": 65.385, "end": 75.517, "text": "三个角都是锐角的，是锐角三角形；有一个角是直角的，是直角三角形；有一个角是钝角的，是钝角三角形。"}, {"start": 75.517, "end": 81.162, "text": "来，到分类实验台把下面的三角形分一分，看看你分得对不对。"}, {"start": 81.316, "end": 83.95, "text": "三角形也能按边来分。"}, {"start": 83.9, "end": 91.874, "text": "两条边相等的，是等腰三角形；三条边都相等的，是等边三角形，也叫正三角形。"}, {"start": 91.874, "end": 98.519, "text": "等边三角形一定是等腰三角形，但等腰三角形不一定是等边三角形。"}, {"start": 98.519, "end": 108.939, "text": "用圆规也能画出等边三角形：分别以线段两端点为圆心、以这条线段为半径画弧，两弧的交点就是第三个顶点。"}]}</script><script id="itv-runtime">(()=>{'use strict';

try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&typeof old.answers==='object'&&typeof old.visited==='object'){state.answers=Object.fromEntries(Object.entries(old.answers).filter(([id])=>byid.has(id)));state.visited=Object.fromEntries(Object.entries(old.visited).filter(([id])=>scenes.some(s=>s.id===id)));state.position=Number.isFinite(old.position)?old.position:0;}}catch(e){storage=false;}
function save(){if(v.readyState)state.position=v.currentTime;try{localStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;}}
function correct(f,value){return f.type==='observe'?null:f.type==='choice'?value===f.answer:f.answers.some(a=>norm(a)===norm(value));}
function update(){status.textContent=(storage?'':'本次作答暂时无法保存。')+'已回顾 '+Object.keys(state.visited).filter(k=>state.visited[k]).length+' / '+scenes.length+' 段，记录 '+all.filter(f=>state.answers[f.id]).length+' / '+all.length+' 项。';film.querySelectorAll('[data-scene]').forEach((b,i)=>{b.classList.toggle('nv-done',!!state.visited[scenes[i].id]);b.setAttribute('aria-current',String(active===i));});}
function sync(id,value){const f=byid.get(id);if(!f)return;value=String(value).slice(0,f.type==='observe'?1000:160);state.answers[id]=value;document.querySelectorAll('[data-itv-field]').forEach(el=>{if(el.dataset.itvField!==id)return;if(el.type==='radio')el.checked=el.value===value;else if(el!==document.activeElement)el.value=value;el.dataset.state=!value?'empty':correct(f,value)===false?'wrong':correct(f,value)===true?'correct':'recorded';});save();update();}
function control(f,value=''){const id=escape(f.id),label=escape(f.prompt);if(f.type==='choice')return '<fieldset class="nv-field"><legend>'+label+'</legend>'+f.options.map(o=>'<label><input type="radio" name="itv-'+id+'" data-itv-field="'+id+'" value="'+escape(o.id)+'" '+(value===o.id?'checked':'')+'>'+escape(o.label)+'</label>').join('')+'</fieldset>';return '<label class="nv-field">'+label+(f.type==='observe'?'<textarea rows="3" maxlength="1000"':'<input maxlength="160"')+' data-itv-field="'+id+'" '+(f.type==='observe'?'>'+escape(value)+'</textarea>':'value="'+escape(value)+'" placeholder="填写关键词">')+'</label>';}
function unmountLab(){if(lab){lab.remove();lab=null;}box.hidden=false;}
function mountLab(i){const f=scenes[i].fields.find(x=>typeof x.lab_srcdoc==='string'&&x.lab_srcdoc.trim());if(!f)return;const frame=document.createElement('iframe');frame.className='nv-lab';frame.title=f.prompt;frame.srcdoc=f.lab_srcdoc;frame.setAttribute('sandbox','allow-scripts');box.hidden=false;box.before(frame);lab=frame;}
function question(i){v.pause();active=i;waiting=i;revisit=false;panel.hidden=false;panel.querySelector('h3').textContent=scenes[i].activity_title||'知识整理';unmountLab();box.innerHTML=scenes[i].fields.map(f=>control(f,state.answers[f.id]||'')).join('');mountLab(i);requestAnimationFrame(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}));fb.textContent=scenes[i].instruction||'根据刚才的讲解，完成记录。';form.querySelector('[type=submit]').hidden=false;panel.querySelector('.nv-continue').hidden=true;panel.querySelector('.nv-skip').textContent='先跳过';update();box.querySelector('input,textarea')?.focus({preventScroll:true});}
function finish(){v.pause();waiting=null;unmountLab();panel.hidden=false;box.innerHTML='';panel.querySelector('h3').textContent='本节学习完成';fb.textContent='检查并完善知识清单。';form.querySelector('[type=submit]').hidden=true;panel.querySelector('.nv-continue').hidden=true;panel.querySelector('.nv-skip').textContent='收起';save();update();}
async function resume(){if(waiting!==null)return;unmountLab();panel.hidden=true;try{await v.play();}catch(e){status.textContent='请点击播放；若无法启动，可使用 Chrome 或 Edge 打开。';}}
function seek(t,guard=true){v.pause();t=Math.max(0,Math.min(t,v.duration||scenes.at(-1).end));if(guard&&t>v.currentTime){const i=scenes.findIndex(s=>!state.visited[s.id]&&s.end>=v.currentTime-.15&&s.end<=t);if(i>=0){internal=true;v.currentTime=Math.min(scenes[i].end,v.duration||scenes[i].end);setTimeout(()=>internal=false,150);question(i);return;}}internal=true;waiting=null;unmountLab();v.currentTime=t;active=scenes.findIndex(s=>t<s.end);if(active<0)active=scenes.length-1;panel.hidden=true;setTimeout(()=>internal=false,150);save();update();}
function next(){if(waiting===null){panel.hidden=true;return;}const i=waiting;state.visited[scenes[i].id]=true;waiting=null;if(i===scenes.length-1){save();update();finish();return;}active=i+1;revisit=false;save();update();resume();}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.itvField&&(el.type!=='radio'||el.checked))sync(el.dataset.itvField,el.value);});
window.addEventListener('message',e=>{const d=e.data;if(!lab||e.source!==lab.contentWindow||!d||!byid.has(d.id))return;if(d.type==='lab-focus'){box.querySelector('textarea')?.focus({preventScroll:false});return;}if(d.type==='lab-field')sync(d.id,d.value??'');});
form.onsubmit=e=>{e.preventDefault();if(waiting===null)return;fb.textContent=scenes[waiting].fields.map(f=>{const value=state.answers[f.id]||'';if(f.type==='observe')return f.prompt+'：'+(value?'已记录。':'尚未记录。');const answer=f.type==='choice'?f.options.find(o=>o.id===f.answer).label:f.answers[0];return f.prompt+'：'+(correct(f,value)?'正确。':'参考：'+answer+'。');}).join(' ');panel.querySelector('.nv-continue').hidden=false;};
panel.querySelector('.nv-continue').onclick=next;panel.querySelector('.nv-skip').onclick=next;panel.querySelector('.nv-replay').onclick=()=>{const i=waiting??active;seek(scenes[i].start,false);revisit=true;resume();};play.onclick=()=>{if(waiting===null)v.paused?resume():v.pause();};
v.addEventListener('play',()=>{if(waiting!==null)v.pause();else play.textContent='暂停';});v.addEventListener('pause',()=>{play.textContent='播放';save();});
v.addEventListener('timeupdate',()=>{root.querySelector('.nv-time').textContent=fmt(v.currentTime)+' / '+fmt(v.duration||0);seekbar.value=v.currentTime;if(!internal&&waiting===null&&!v.paused){const s=scenes[active];if(v.currentTime>=s.end-.1&&(!state.visited[s.id]||revisit))question(active);else{const a=scenes.findIndex(s=>v.currentTime<s.end);if(a>=0)active=a;}}if(Date.now()-lastSave>2500){lastSave=Date.now();save();}});
v.addEventListener('ended',()=>{if(waiting!==null)return;const i=scenes.findIndex(s=>!state.visited[s.id]);i>=0?question(i):finish();});function initMedia(){seekbar.max=v.duration;seek(Math.min(state.position,Math.max(0,v.duration-.2)),false);}v.addEventListener('loadedmetadata',initMedia);if(v.readyState>=1)initMedia();v.addEventListener('error',()=>status.textContent='视频未能加载，请重新打开或使用其他浏览器。');seekbar.onchange=()=>seek(Number(seekbar.value));
root.querySelector('.nv-mute').onclick=e=>{v.muted=!v.muted;e.target.textContent=v.muted?'开启声音':'静音';};root.querySelector('.nv-fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await root.requestFullscreen();}catch(e){status.textContent='当前浏览器无法进入全屏。';}};
let show=true;const captions=cfg.captions||[];function paint(){const cue=captions.find(c=>v.currentTime>=c.start&&v.currentTime<c.end),b=root.querySelector('.nv-caption');b.replaceChildren();if(show&&cue){const span=document.createElement('span');span.textContent=cue.text;b.append(span);}}v.addEventListener('timeupdate',paint);v.addEventListener('seeked',paint);root.querySelector('.nv-subtitles').onclick=e=>{show=!show;e.target.textContent=show?'隐藏字幕':'显示字幕';e.target.setAttribute('aria-pressed',String(show));paint();};
film.querySelector('.nv-chapters').innerHTML=scenes.map((s,i)=>'<button type="button" data-scene="'+i+'">'+escape(s.title)+'</button>').join('');film.querySelector('.nv-chapters').onclick=e=>{const b=e.target.closest('[data-scene]');if(b){seek(scenes[Number(b.dataset.scene)].start,false);revisit=true;resume();}};
film.querySelector('.nv-reset').onclick=()=>{v.pause();state={answers:{},visited:{},position:0};document.querySelectorAll('[data-itv-field]').forEach(el=>{if(el.type==='radio')el.checked=false;else el.value='';delete el.dataset.state;});revisit=false;seek(0,false);save();update();};film.querySelector('.nv-to-list').onclick=()=>{v.pause();film.querySelector('.itv-list').scrollIntoView({behavior:'smooth'});};film.querySelector('.nv-transcript').textContent=scenes.map(s=>s.title+'\n'+(s.narration||'')).join('\n\n');film.querySelector('.itv-list-fields').innerHTML=all.map(f=>control(f,state.answers[f.id]||'')).join('');
root.addEventListener('keydown',e=>{e.stopPropagation();if(e.target.matches('input,textarea,select'))return;if(e.key===' '&&e.target===v){e.preventDefault();play.click();}});v.addEventListener('click',()=>play.click());Object.entries(state.answers).forEach(([id,value])=>sync(id,value));update();
})();
</script></body></html>
