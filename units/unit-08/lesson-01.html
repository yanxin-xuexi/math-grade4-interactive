pe="button" class="nv-continue nv-primary" hidden>继续学习</button><button type="button" class="nv-replay">重看本段</button><button type="button" class="nv-skip">先跳过</button></div></form></section></div><div class="nv-chapters" aria-label="讲解章节"></div><p class="nv-status" aria-live="polite"></p><div class="nv-actions"><button type="button" class="nv-to-list">查看知识清单</button><button type="button" class="nv-reset">重置本节</button></div><details><summary>阅读讲解内容</summary><div class="nv-transcript"></div></details><section class="itv-list"><h3>知识清单</h3><div class="itv-list-fields"></div></section></section>
<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-axis-symmetry-v1-storybook-v1", "title": "认识轴对称图形和对称轴", "scenes": [{"id": "S01", "title": "情境引入：银行徽标", "start": 0, "end": 15.233333, "fields": [{"id": "obs-bank-logos", "type": "observe", "prompt": "观察四个银行徽标，它们有什么共同特点？"}], "narration": "同学们，我们来看四个银行的徽标。分别是中国银行、中国工商银行、中国人民银行和中国农业银行的标志。仔细观察这四个图形，想一想，它们有什么共同特点呢？"}, {"id": "S02", "title": "认识轴对称图形与对称轴", "start": 15.233333, "end": 41.681333, "fields": [{"id": "obs-fold-concept", "type": "observe", "prompt": "观察对折过程：折痕所在的直线叫作什么？"}], "narration": "你会发现，这四个图形都是轴对称图形。有的上下对称，有的左右对称。我们拿中国银行的徽标来试一试。沿着竖直方向对折，左右两边完全重合。再换一种折法，沿水平方向对折，上下两边也完全重合。像这样对折后，折痕所在的直线，就叫作轴对称图形的对称轴。"}, {"id": "S03", "title": "已学图形的对称轴", "start": 41.681333, "end": 73.409333, "fields": [{"id": "fill-rect-axes", "type": "fill", "prompt": "长方形有几条对称轴？", "answers": ["2", "两条", "2条", "二条"]}, {"id": "fill-sq-axes", "type": "fill", "prompt": "正方形有几条对称轴？", "answers": ["4", "四条", "4条", "四条"]}], "narration": "我们学过哪些轴对称图形呢？长方形是轴对称图形。通过对折可以发现，长方形有两条对称轴，分别是沿水平方向和竖直方向的对折线。正方形也是轴对称图形，它有四条对称轴：水平一条、竖直一条，还有两条沿对角线方向。等腰三角形有一条对称轴，从顶角到底边中点。等腰梯形也有一条对称轴，沿上下底中点的连线。"}, {"id": "S04", "title": "画对称图形的另一半", "start": 73.409333, "end": 98.201333, "fields": [{"id": "lab-axis-symmetry", "type": "observe", "prompt": "在方格纸上画出对称图形的另一半：找到关键点的对称点，再连线。", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>轴对称实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#1a1a2e;font-family:'PingFang SC',sans-serif;overflow:auto;touch-action:none}\ncanvas{display:block;margin:0 auto;width:100%;height:auto}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cscript>\nconst C=document.getElementById('c');\nconst ctx=C.getContext('2d');\nconst W=1280,H=720;\nC.width=W;C.height=H;\n\nconst COL={bg:'#1a1a2e',grid:'#2a2a4e',axis:'#e94560',shape:'#0f969c',sym:'#6bcb77',\n  teal:'#0f969c',accent:'#e94560',gold:'#f5a623',white:'#eee',purple:'#a855f7',card:'#16213e'};\n\nconst GRID_X=200,GRID_Y=60,GRID_W=880,GRID_H=520;\nconst COLS=16,ROWS=10;\nconst CW=GRID_W/COLS,CH=GRID_H/ROWS;\nconst AXIS_COL=8;\n\n// Half shape points (left side)\nconst HALF_SHAPE=[[3,2],[5,2],[5,4],[7,4],[7,7],[3,7]];\n// Expected symmetric points\nconst SYM_SHAPE=HALF_SHAPE.map(p=>[2*AXIS_COL-p[0],p[1]]);\n\nlet feedback=\"\";let placedPoints=[];\nlet showDemo=false;\nlet mode='place'; // 'place' or 'done'\n\nfunction gridToPixel(col,row){\n  return [GRID_X+col*CW,GRID_Y+row*CH];\n}\n\nfunction pixelToGrid(x,y){\n  return [Math.round((x-GRID_X)/CW),Math.round((y-GRID_Y)/CH)];\n}\n\nfunction drawGrid(){\n  ctx.strokeStyle=COL.grid;ctx.lineWidth=1;\n  for(let i=0;i\u003c=COLS;i++){\n    const x=GRID_X+i*CW;\n    ctx.beginPath();ctx.moveTo(x,GRID_Y);ctx.lineTo(x,GRID_Y+GRID_H);ctx.stroke();\n  }\n  for(let j=0;j\u003c=ROWS;j++){\n    const y=GRID_Y+j*CH;\n    ctx.beginPath();ctx.moveTo(GRID_X,y);ctx.lineTo(GRID_X+GRID_W,y);ctx.stroke();\n  }\n}\n\nfunction drawAxis(){\n  const x=GRID_X+AXIS_COL*CW;\n  ctx.strokeStyle=COL.axis;ctx.lineWidth=3;ctx.setLineDash([8,4]);\n  ctx.beginPath();ctx.moveTo(x,GRID_Y);ctx.lineTo(x,GRID_Y+GRID_H);ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.fillStyle=COL.axis;ctx.font='bold 16px PingFang SC';ctx.textAlign='center';\n  ctx.fillText('对称轴',x,GRID_Y-8);\n}\n\nfunction drawShape(pts,fillC,strokeC,alpha){\n  if(pts.length\u003c2)return;\n  ctx.globalAlpha=alpha||1;\n  ctx.beginPath();\n  const[x0,y0]=gridToPixel(pts[0][0],pts[0][1]);\n  ctx.moveTo(x0,y0);\n  for(let i=1;i\u003cpts.length;i++){\n    const[x,y]=gridToPixel(pts[i][0],pts[i][1]);\n    ctx.lineTo(x,y);\n  }\n  ctx.closePath();\n  ctx.fillStyle=fillC;ctx.fill();\n  ctx.strokeStyle=strokeC;ctx.lineWidth=3;ctx.stroke();\n  ctx.globalAlpha=1;\n}\n\nfunction drawKeyPoints(pts,color,labels){\n  pts.forEach((p,i)=>{\n    const[x,y]=gridToPixel(p[0],p[1]);\n    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);\n    ctx.fillStyle=color;ctx.fill();\n    ctx.strokeStyle=COL.white;ctx.lineWidth=2;ctx.stroke();\n    if(labels){\n      ctx.fillStyle=color;ctx.font='bold 14px PingFang SC';ctx.textAlign='center';\n      ctx.fillText(labels[i]||'',x,y-14);\n    }\n  });\n}\n\nfunction drawDistanceLines(origPts,symPts){\n  const axisX=GRID_X+AXIS_COL*CW;\n  ctx.strokeStyle=COL.gold;ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.globalAlpha=.5;\n  origPts.forEach((op,i)=>{\n    if(i>=symPts.length)return;\n    const sp=symPts[i];\n    const[ox,oy]=gridToPixel(op[0],op[1]);\n    const[sx,sy]=gridToPixel(sp[0],sp[1]);\n    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(sx,sy);ctx.stroke();\n  });\n  ctx.setLineDash([]);ctx.globalAlpha=1;\n}\n\nfunction render(){drawButton.btns=[];\n  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);\n\n  // Title\n  ctx.fillStyle=COL.white;ctx.font='bold 24px PingFang SC';ctx.textAlign='center';\n  ctx.fillText('轴对称实验台：画出另一半',W/2,35);\n\n  drawGrid();\n  drawAxis();\n\n  // Draw half shape\n  drawShape(HALF_SHAPE,'rgba(15,150,156,0.25)',COL.shape,1);\n  drawKeyPoints(HALF_SHAPE,COL.shape,['A','B','C','D','E','F']);\n\n  if(placedPoints.length===6&&!showDemo){drawShape(placedPoints,\"#6bcb7733\",COL.sym,1);drawDistanceLines(HALF_SHAPE,placedPoints);}\n  // Draw placed symmetric points\n  if(showDemo){\n    const allSym=SYM_SHAPE;\n    drawDistanceLines(HALF_SHAPE,allSym);\n    drawShape(allSym,'rgba(107,203,119,0.2)',COL.sym,1);\n    drawKeyPoints(allSym,COL.sym,[\"A'\",\"B'\",\"C'\",\"D'\",\"E'\",\"F'\"]);\n  }else{\n    drawKeyPoints(placedPoints,COL.sym,placedPoints.map((_,i)=>String.fromCharCode(65+i)+\"'\"));\n  }\n\n  // Instructions\n  ctx.fillStyle=COL.card;\n  ctx.fillRect(0,H-100,W,100);\n  ctx.strokeStyle=COL.gold;ctx.lineWidth=2;\n  ctx.strokeRect(0,H-100,W,100);\n\n  ctx.fillStyle=COL.gold;ctx.font='bold 18px PingFang SC';ctx.textAlign='center';\n  if(!showDemo&&placedPoints.length\u003c6){\n    ctx.fillText(feedback||'点击网格右侧，依次放置对称点 A\\'、B\\'、C\\'、D\\'、E\\'、F\\'',W/2,H-70);\n    ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n    ctx.fillText('每个点到对称轴的距离要和对应的原点相同  |  已放置：'+placedPoints.length+'/6  |  点击\"演示\"查看完整过程',W/2,H-40);\n  }else if(!showDemo&&placedPoints.length>=6){\n    ctx.fillText('已放置全部6个对称点！',W/2,H-70);\n    ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n    ctx.fillText('点击\"演示\"查看连线效果  |  点击\"重置\"重新开始',W/2,H-40);\n  }\n\n  // Buttons\n  drawButton(1050,H-85,100,36,'演示',COL.teal,()=>{showDemo=true});\n  drawButton(1160,H-85,100,36,'重置',COL.accent,()=>{showDemo=false;placedPoints=[];feedback=\"\"});\n}\n\nfunction drawButton(x,y,w,h,text,color,onclick){\n  ctx.fillStyle=color;\n  ctx.beginPath();\n  ctx.roundRect(x,y,w,h,8);\n  ctx.fill();\n  ctx.fillStyle=COL.white;ctx.font='bold 16px PingFang SC';ctx.textAlign='center';\n  ctx.fillText(text,x+w/2,y+h/2+6);\n  if(!drawButton.btns)drawButton.btns=[];\n  drawButton.btns.push({x,y,w,h,onclick});\n}\n\nC.addEventListener('click',e=>{\n  const rect=C.getBoundingClientRect();\n  const scaleX=W/rect.width,scaleY=H/rect.height;\n  const mx=(e.clientX-rect.left)*scaleX;\n  const my=(e.clientY-rect.top)*scaleY;\n\n  // Check buttons\n  if(drawButton.btns){\n    for(const b of drawButton.btns){\n      if(mx>=b.x&&mx\u003c=b.x+b.w&&my>=b.y&&my\u003c=b.y+b.h){\n        drawButton.btns=[];\n        b.onclick();\n        render();\n        return;\n      }\n    }\n  }\n  drawButton.btns=[];\n\n  if(showDemo)return;\n  if(placedPoints.length>=6)return;\n\n  // Only allow clicks on right side of axis\n  const[col,row]=pixelToGrid(mx,my);\n  if(col>AXIS_COL&&col\u003c=COLS&&row>=0&&row\u003c=ROWS){\n    const q=SYM_SHAPE[placedPoints.length];if(col!==q[0]||row!==q[1]){feedback=\"再检查：对应点应在同一行，到对称轴的距离相等。\";render();return;}feedback=\"\";placedPoints.push([col,row]);\n    render();\n  }\n});\n\nrender();\n\u003c/script>\n\u003cdiv style=\"padding:10px;background:#fffaf0;color:#24483e;font:16px/1.6 sans-serif;text-align:center\">实验后，请在下方写下自己的发现。\u003cbutton onclick=\"parent.postMessage({type:'lab-focus',id:'lab-axis-symmetry'},'*')\" style=\"padding:8px 15px\">写下我的发现\u003c/button>\u003c/div>\u003c/body>\n\u003c/html>\n"}], "instruction": "完成实验后，在下方写下自己的发现；也可以先跳过。", "narration": "现在我们来挑战一个更有意思的任务。在方格纸上，对称轴的左边画了半个图形，请你画出另一半，使它成为轴对称图形。方法是：先从图形上找到几个关键的点，再根据每个点到对称轴的距离，在对称轴的另一侧找到对应的对称点，最后把这些对称点依次连起来，就完成了。"}, {"id": "S05", "title": "总结", "start": 98.201333, "end": 126.2, "fields": [{"id": "obs-summary", "type": "observe", "prompt": "回顾今天学到的内容：什么是轴对称图形？怎样画对称图形的另一半？"}], "narration": "今天我们一起认识了轴对称图形。轴对称图形对折后，折痕两边完全重合，折痕所在的直线就是对称轴。长方形有两条对称轴，正方形有四条，等腰三角形和等腰梯形各有一条。画对称图形的另一半时，关键是找到关键点的对称点，再连线。生活中轴对称图形无处不在，你还能找到哪些呢？"}], "captions": [{"start": 0, "end": 3.352333, "text": "同学们，我们来看四个银行的徽标。"}, {"start": 3.335, "end": 5.020333, "text": "分别是中国银行、"}, {"start": 5.003, "end": 6.479333, "text": "中国工商银行、"}, {"start": 6.462, "end": 10.022333, "text": "中国人民银行和中国农业银行的标志。"}, {"start": 10.005, "end": 12.106333, "text": "仔细观察这四个图形，"}, {"start": 12.089, "end": 15.233333, "text": "想一想，它们有什么共同特点呢？"}, {"start": 15.233333, "end": 19.267333, "text": "你会发现，这四个图形都是轴对称图形。"}, {"start": 19.267333, "end": 22.405333, "text": "有的上下对称，有的左右对称。"}, {"start": 22.405333, "end": 25.767333, "text": "我们拿中国银行的徽标来试一试。"}, {"start": 25.767333, "end": 27.785333, "text": "沿着竖直方向对折，"}, {"start": 27.785333, "end": 29.802333, "text": "左右两边完全重合。"}, {"start": 29.802333, "end": 33.164333, "text": "再换一种折法，沿水平方向对折，"}, {"start": 33.164333, "end": 35.405333, "text": "上下两边也完全重合。"}, {"start": 35.405333, "end": 38.767333, "text": "像这样对折后，折痕所在的直线，"}, {"start": 38.767333, "end": 41.681333, "text": "就叫作轴对称图形的对称轴。"}, {"start": 41.681333, "end": 44.565333, "text": "我们学过哪些轴对称图形呢？"}, {"start": 44.565333, "end": 46.784333, "text": "长方形是轴对称图形。"}, {"start": 46.784333, "end": 48.781333, "text": "通过对折可以发现，"}, {"start": 48.781333, "end": 51.000333, "text": "长方形有两条对称轴，"}, {"start": 51.000333, "end": 54.993333, "text": "分别是沿水平方向和竖直方向的对折线。"}, {"start": 54.993333, "end": 57.434333, "text": "正方形也是轴对称图形，"}, {"start": 57.434333, "end": 60.318333, "text": "它有四条对称轴：水平一条、"}, {"start": 60.318333, "end": 63.868333, "text": "竖直一条，还有两条沿对角线方向。"}, {"start": 63.868333, "end": 66.531333, "text": "等腰三角形有一条对称轴，"}, {"start": 66.531333, "end": 68.528333, "text": "从顶角到底边中点。"}, {"start": 68.528333, "end": 71.190333, "text": "等腰梯形也有一条对称轴，"}, {"start": 71.190333, "end": 73.409333, "text": "沿上下底中点的连线。"}, {"start": 73.409333, "end": 76.864333, "text": "现在我们来挑战一个更有意思的任务。"}, {"start": 76.864333, "end": 80.725333, "text": "在方格纸上，对称轴的左边画了半个图形，"}, {"start": 80.725333, "end": 82.350333, "text": "请你画出另一半，"}, {"start": 82.350333, "end": 84.383333, "text": "使它成为轴对称图形。"}, {"start": 84.383333, "end": 88.040333, "text": "方法是：先从图形上找到几个关键的点，"}, {"start": 88.040333, "end": 90.885333, "text": "再根据每个点到对称轴的距离，"}, {"start": 90.885333, "end": 94.340333, "text": "在对称轴的另一侧找到对应的对称点，"}, {"start": 94.340333, "end": 97.185333, "text": "最后把这些对称点依次连起来，"}, {"start": 97.185333, "end": 98.201333, "text": "就完成了。"}, {"start": 98.201333, "end": 101.480333, "text": "今天我们一起认识了轴对称图形。"}, {"start": 101.480333, "end": 103.448333, "text": "轴对称图形对折后，"}, {"start": 103.448333, "end": 105.416333, "text": "折痕两边完全重合，"}, {"start": 105.416333, "end": 108.258333, "text": "折痕所在的直线就是对称轴。"}, {"start": 108.258333, "end": 110.444333, "text": "长方形有两条对称轴，"}, {"start": 110.444333, "end": 111.974333, "text": "正方形有四条，"}, {"start": 111.974333, "end": 115.254333, "text": "等腰三角形和等腰梯形各有一条。"}, {"start": 115.254333, "end": 117.659333, "text": "画对称图形的另一半时，"}, {"start": 117.659333, "end": 120.501333, "text": "关键是找到关键点的对称点，"}, {"start": 120.501333, "end": 124.217333, "text": "再连线。生活中轴对称图形无处不在，"}, {"start": 124.217333, "end": 126.185333, "text": "你还能找到哪些呢？"}]}</script><script id="itv-runtime">(()=>{'use strict';
const film=document.getElementById('itv-film');if(!film)return;
const cfg=JSON.parse(document.getElementById('itv-data').textContent),scenes=cfg.scenes,all=scenes.flatMap(s=>s.fields),byid=new Map(all.map(f=>[f.id,f]));
const root=film.querySelector('.nv-player'),v=root.querySelector('video'),panel=root.querySelector('.nv-question'),form=panel.querySelector('form'),box=panel.querySelector('.nv-fields'),fb=panel.querySelector('.nv-feedback'),status=film.querySelector('.nv-status'),play=root.querySelector('.nv-play'),seekbar=root.querySelector('.nv-seek');
let state={answers:{},visited:{},position:0},storage=true,active=0,waiting=null,revisit=false,internal=false,lastSave=0,lab=null;
const key='itv:'+cfg.lesson_id,escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').normalize('NFKC').trim().replace(/\s+/g,' '),fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&typeof old.answers==='object'&&typeof old.visited==='object'){state.answers=Object.fromEntries(Object.entries(old.answers).filter(([id])=>byid.has(id)));state.visited=Object.fromEntries(Object.entries(old.visited).filter(([id])=>scenes.some(s=>s.id===id)));state.position=Number.isFinite(old.position)?old.position:0;}}catch(e){storage=false;}
function save(){if(v.readyState)state.position=v.currentTime;try{localStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;}}
function correct(f,value){return f.type==='observe'?null:f.type==='choice'?value===f.answer:f.answers.some(a=>norm(a)===norm(value));}
function update(){status.textContent=(storage?'':'本次作答暂时无法保存。')+'已回顾 '+Object.keys(state.visited).filter(k=>state.visited[k]).length+' / '+scenes.length+' 段，记录 '+all.filter(f=>state.answers[f.id]).length+' / '+all.length+' 项。';film.querySelectorAll('[data-scene]').forEach((b,i)=>{b.classList.toggle('nv-done',!!state.visited[scenes[i].id]);b.setAttribute('aria-current',String(active===i));});}
function sync(id,value){const f=byid.get(id);if(!f)return;value=String(value).slice(0,f.type==='observe'?1000:160);state.answers[id]=value;document.querySelectorAll('[data-itv-field]').forEach(el=>{if(el.dataset.itvField!==id)return;if(el.type==='radio')el.checked=el.value===value;else if(el!==document.activeElement)el.value=value;el.dataset.state=!value?'empty':correct(f,value)===false?'wrong':correct(f,value)===true?'correct':'recorded';});save();update();}
function control(f,value=''){const id=escape(f.id),label=escape(f.prompt);if(f.type==='choice')return '<fieldset class="nv-field"><legend>'+label+'</legend>'+f.options.map(o=>'<label><input type="radio" name="itv-'+id+'" data-itv-field="'+id+'" value="'+escape(o.id)+'" '+(value===o.id?'checked':'')+'>'+escape(o.label)+'</label>').join('')+'</fieldset>';return '<label class="nv-field">'+label+(f.type==='observe'?'<textarea rows="3" maxlength="1000"':'<input maxlength="160"')+' data-itv-field="'+id+'" '+(f.type==='observe'?'>'+escape(value)+'</textarea>':'value="'+escape(value)+'" placeholder="填写关键词">')+'</label>';}
function unmountLab(){if(lab){lab.remove();lab=null;}box.hidden=false;}
function mountLab(i){const f=scenes[i].fields.find(x=>typeof x.lab_srcdoc==='string'&&x.lab_srcdoc.trim());if(!f)return;const frame=document.createElement('iframe');frame.className='nv-lab';frame.title=f.prompt;frame.srcdoc=f.lab_srcdoc;frame.setAttribute('sandbox','allow-scripts');box.hidden=false;box.before(frame);lab=frame;}
function question(i){v.pause();active=i;waiting=i;revisit=false;panel.hidden=false;panel.querySelector('h3').textContent=scenes[i].activity_title||'知识整理';unmountLab();box.innerHTML=scenes[i].fields.map(f=>control(f,state.answers[f.id]||'')).join('');mountLab(i);requestAnimationFrame(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}));fb.textContent=scenes[i].instruction||'根据刚才的讲解，完成记录。';form.querySelector('[type=submit]').hidden=false;panel.querySelector('.nv-continue').hidden=true;panel.querySelector('.nv-skip').textContent='先跳过';update();box.querySelector('input,textarea')?.focus({preventScroll:true});}
function finish(){v.pause();waiting=null;unmountLab();panel.hidden=false;box.innerHTML='';panel.querySelector('h3').textContent='本节学习完成';fb.textContent='检查并完善知识清单。';form.querySelector('[type=submit]').hidden=true;panel.querySelector('.nv-continue').hidden=true;panel.querySelector('.nv-skip').textContent='收起';save();update();}
async function resume(){if(waiting!==null)return;unmountLab();panel.hidden=true;try{await v.play();}catch(e){status.textContent='请点击播放；若无法启动，可使用 Chrome 或 Edge 打开。';}}
function seek(t,guard=true){v.pause();t=Math.max(0,Math.min(t,v.duration||scenes.at(-1).end));if(guard&&t>v.currentTime){const i=scenes.findIndex(s=>!state.visited[s.id]&&s.end>=v.currentTime-.15&&s.end<=t);if(i>=0){internal=true;v.currentTime=Math.min(scenes[i].end,v.duration||scenes[i].end);setTimeout(()=>internal=false,150);question(i);return;}}internal=true;waiting=null;unmountLab();v.currentTime=t;active=scenes.findIndex(s=>t<s.end);if(active<0)active=scenes.length-1;panel.hidden=true;setTimeout(()=>internal=false,150);save();update();}
function next(){if(waiting===null){panel.hidden=true;return;}const i=waiting;state.visited[scenes[i].id]=true;waiting=null;if(i===scenes.length-1){save();update();finish();return;}active=i+1;revisit=false;save();update();resume();}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.itvField&&(el.type!=='radio'||el.checked))sync(el.dataset.itvField,el.value);});
window.addEventListener('message',e=>{const d=e.data;if(!lab||e.source!==lab.contentWindow||!d||!byid.has(d.id))return;if(d.type==='lab-focus'){box.querySelector('textarea')?.focus({preventScroll:false});return;}if(d.type==='lab-field')sync(d.id,d.value??'');});
form.onsubmit=e=>{e.preventDefault();if(waiting===null)return;fb.textContent=scenes[waiting].fields.map(f=>{const value=state.answers[f.id]||'';if(f.type==='observe')return f.prompt+'：'+(value?'已记录。':'尚未记录。');const answer=f.type==='choice'?f.options.find(o=>o.id===f.answer).label:f.answers[0];return f.prompt+'：'+(correct(f,value)?'正确。':'参考：'+answer+'。');}).join(' ');panel.querySelector('.nv-continue').hidden=false;};
panel.querySelector('.nv-continue').onclick=next;panel.querySelector('.nv-skip').onclick=next;panel.querySelector('.nv-replay').onclick=()=>{const i=waiting??active;seek(scenes[i].start,false);revisit=true;resume();};play.onclick=()=>{if(waiting===null)v.paused?resume():v.pause();};
v.addEventListener('play',()=>{if(waiting!==null)v.pause();else play.textContent='暂停';});v.addEventListener('pause',()=>{play.textContent='播放';save();});
v.addEventListener('timeupdate',()=>{root.querySelector('.nv-time').textContent=fmt(v.currentTime)+' / '+fmt(v.duration||0);seekbar.value=v.currentTime;if(!internal&&waiting===null&&!v.paused){const s=scenes[active];if(v.currentTime>=s.end-.1&&(!state.visited[s.id]||revisit))question(active);else{const a=scenes.findIndex(s=>v.currentTime<s.end);if(a>=0)active=a;}}if(Date.now()-lastSave>2500){lastSave=Date.now();save();}});
v.addEventListener('ended',()=>{if(waiting!==null)return;const i=scenes.findIndex(s=>!state.visited[s.id]);i>=0?question(i):finish();});function initMedia(){seekbar.max=v.duration;seek(Math.min(state.position,Math.max(0,v.duration-.2)),false);}v.addEventListener('loadedmetadata',initMedia);if(v.readyState>=1)initMedia();v.addEventListener('error',()=>status.textContent='视频未能加载，请重新打开或使用其他浏览器。');seekbar.onchange=()=>seek(Number(seekbar.value));
root.querySelector('.nv-mute').onclick=e=>{v.muted=!v.muted;e.target.textContent=v.muted?'开启声音':'静音';};root.querySelector('.nv-fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await root.requestFullscreen();}catch(e){status.textContent='当前浏览器无法进入全屏。';}};
let show=true;const captions=cfg.captions||[];function paint(){const cue=captions.find(c=>v.currentTime>=c.start&&v.currentTime<c.end),b=root.querySelector('.nv-caption');b.replaceChildren();if(show&&cue){const span=document.createElement('span');span.textContent=cue.text;b.append(span);}}v.addEventListener('timeupdate',paint);v.addEventListener('seeked',paint);root.querySelector('.nv-subtitles').onclick=e=>{show=!show;e.target.textContent=show?'隐藏字幕':'显示字幕';e.target.setAttribute('aria-pressed',String(show));paint();};
film.querySelector('.nv-chapters').innerHTML=scenes.map((s,i)=>'<button type="button" data-scene="'+i+'">'+escape(s.title)+'</button>').join('');film.querySelector('.nv-chapters').onclick=e=>{const b=e.target.closest('[data-scene]');if(b){seek(scenes[Number(b.dataset.scene)].start,false);revisit=true;resume();}};
film.querySelector('.nv-reset').onclick=()=>{v.pause();state={answers:{},visited:{},position:0};document.querySelectorAll('[data-itv-field]').forEach(el=>{if(el.type==='radio')el.checked=false;else el.value='';delete el.dataset.state;});revisit=false;seek(0,false);save();update();};film.querySelector('.nv-to-list').onclick=()=>{v.pause();film.querySelector('.itv-list').scrollIntoView({behavior:'smooth'});};film.querySelector('.nv-transcript').textContent=scenes.map(s=>s.title+'\n'+(s.narration||'')).join('\n\n');film.querySelector('.itv-list-fields').innerHTML=all.map(f=>control(f,state.answers[f.id]||'')).join('');
root.addEventListener('keydown',e=>{e.stopPropagation();if(e.target.matches('input,textarea,select'))return;if(e.key===' '&&e.target===v){e.preventDefault();play.click();}});v.addEventListener('click',()=>play.click());Object.entries(state.answers).forEach(([id,value])=>sync(id,value));update();
})();
</script></body></html>
