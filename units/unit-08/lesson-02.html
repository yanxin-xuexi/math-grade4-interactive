<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-translation-rotation-v1-storybook-v1", "title": "认识图形的平移和旋转", "scenes": [{"id": "S01", "title": "情境引入：美丽图案", "start": 0, "end": 20.766667, "fields": [{"id": "obs-patterns", "type": "observe", "prompt": "观察两幅图案：花边图案和风车图案，它们分别可能是用什么方法画出来的？"}], "narration": "同学们，来看这两幅美丽的图案。第一幅是由相同的菱形花纹连续排列组成的花边，第二幅是由四个相同的基本图形绕中心点排列组成的风车图案。这些漂亮的图案是怎么画出来的呢？今天我们就来研究图形的平移和旋转。"}, {"id": "S02", "title": "认识平移", "start": 20.766667, "end": 49.302667, "fields": [{"id": "fill-translate-direction", "type": "fill", "prompt": "花边图案中，基本图形向哪个方向平移？", "answers": ["右", "向右", "右边"]}, {"id": "fill-translate-distance", "type": "fill", "prompt": "每次平移了几格？", "answers": ["2", "两格", "2格", "两"]}], "narration": "先看第一幅花边图案。它可以用平移的方法来画。先画一个基本图形，也就是一个菱形。然后把它向右平移两格，得到第二个菱形。再把第二个菱形向右平移两格，得到第三个。依次这样平移下去，就得到了连续排列的花边图案。平移时，要先确定方向，再确定平移的距离。图形的形状和大小不会改变。"}, {"id": "S03", "title": "认识旋转", "start": 49.302667, "end": 73.278667, "fields": [{"id": "fill-rotation-angle", "type": "fill", "prompt": "分针从12走到3，旋转了多少度？", "answers": ["90", "90度", "90°"]}, {"id": "choice-rotation-direction", "type": "choice", "prompt": "与时针旋转方向相同的旋转叫什么？", "options": [{"id": "a", "label": "顺时针旋转"}, {"id": "b", "label": "逆时针旋转"}, {"id": "c", "label": "平移"}], "answer": "a"}], "narration": "再看风车图案。我们借助钟面来研究。钟面上的分针从12走到3，绕中心点按顺时针方向旋转了90度。与时针旋转方向相同的，叫顺时针旋转。方向相反的呢，就叫逆时针旋转。旋转有三个要素：旋转中心、旋转方向和旋转角度。"}, {"id": "S04", "title": "旋转作图", "start": 73.278667, "end": 97.902667, "fields": [{"id": "lab-translation-rotation", "type": "observe", "prompt": "在实验台中体验平移和旋转：拖动图形练习平移，点击按钮练习旋转。", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>平移与旋转实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#1a1a2e;font-family:'PingFang SC',sans-serif;overflow:auto;touch-action:none}\ncanvas{display:block;margin:0 auto;width:100%;height:auto}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cscript>\nconst C=document.getElementById('c');\nconst ctx=C.getContext('2d');\nconst W=1280,H=720;\nC.width=W;C.height=H;\n\nconst COL={bg:'#1a1a2e',grid:'#2a2a4e',axis:'#e94560',shape:'#0f969c',moved:'#6bcb77',\n  gold:'#f5a623',white:'#eee',purple:'#a855f7',card:'#16213e',teal:'#0f969c',accent:'#e94560'};\n\nconst GRID_X=160,GRID_Y=80,GRID_W=960,GRID_H=480;\nconst COLS=16,ROWS=8;\nconst CW=GRID_W/COLS,CH=GRID_H/ROWS;\n\nlet mode='translate';\nlet dragShape=null;\nlet dragStart=null;\nlet translateOffset=[0,0];\nlet rotateAngle=0;\nlet rotateStep=0;\nlet showTranslateDemo=false;\nlet showRotateDemo=false;\n\nconst ORIG_SHAPE=[[2,2],[4,1],[5,3],[4,5],[2,4]];\nconst CENTER=[10,4];\nconst BLADE=[[0,0],[-2,-3],[0,-3]];\n\nfunction gridToPixel(col,row){\n  return [GRID_X+col*CW+CW/2,GRID_Y+row*CH+CH/2];\n}\n\nfunction pixelToGrid(x,y){\n  return [(x-GRID_X)/CW,(y-GRID_Y)/CH];\n}\n\nfunction drawGrid(){\n  ctx.strokeStyle=COL.grid;ctx.lineWidth=1;\n  for(let i=0;i\u003c=COLS;i++){\n    const x=GRID_X+i*CW;\n    ctx.beginPath();ctx.moveTo(x,GRID_Y);ctx.lineTo(x,GRID_Y+GRID_H);ctx.stroke();\n  }\n  for(let j=0;j\u003c=ROWS;j++){\n    const y=GRID_Y+j*CH;\n    ctx.beginPath();ctx.moveTo(GRID_X,y);ctx.lineTo(GRID_X+GRID_W,y);ctx.stroke();\n  }\n}\n\nfunction drawShape(pts,fillC,strokeC,alpha,offset){\n  if(pts.length\u003c2)return;\n  ctx.globalAlpha=alpha||1;\n  ctx.beginPath();\n  const ox=offset?offset[0]*CW:0;\n  const oy=offset?offset[1]*CH:0;\n  const[x0,y0]=gridToPixel(pts[0][0],pts[0][1]);\n  ctx.moveTo(x0+ox,y0+oy);\n  for(let i=1;i\u003cpts.length;i++){\n    const[x,y]=gridToPixel(pts[i][0],pts[i][1]);\n    ctx.lineTo(x+ox,y+oy);\n  }\n  ctx.closePath();\n  ctx.fillStyle=fillC;ctx.fill();\n  ctx.strokeStyle=strokeC;ctx.lineWidth=3;ctx.stroke();\n  ctx.globalAlpha=1;\n}\n\nfunction drawRotatedBlade(blade,center,angle,color,alpha){\n  ctx.globalAlpha=alpha||1;\n  ctx.beginPath();\n  const cos=Math.cos(angle),sin=Math.sin(angle);\n  const[cx,cy]=gridToPixel(center[0],center[1]);\n  blade.forEach((p,i)=>{\n    const dx=p[0]*CW,dy=p[1]*CH;\n    const rx=dx*cos-dy*sin;\n    const ry=dx*sin+dy*cos;\n    if(i===0)ctx.moveTo(cx+rx,cy+ry);\n    else ctx.lineTo(cx+rx,cy+ry);\n  });\n  ctx.closePath();\n  ctx.fillStyle=color;ctx.fill();\n  ctx.strokeStyle=COL.white;ctx.lineWidth=2;ctx.stroke();\n  ctx.globalAlpha=1;\n}\n\nfunction drawArrow(from,to,color,label){\n  const[fx,fy]=gridToPixel(from[0],from[1]);\n  const[tx,ty]=gridToPixel(to[0],to[1]);\n  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([6,3]);\n  ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(tx,ty);ctx.stroke();\n  ctx.setLineDash([]);\n  const angle=Math.atan2(ty-fy,tx-fx);\n  ctx.beginPath();\n  ctx.moveTo(tx,ty);\n  ctx.lineTo(tx-12*Math.cos(angle-0.3),ty-12*Math.sin(angle-0.3));\n  ctx.lineTo(tx-12*Math.cos(angle+0.3),ty-12*Math.sin(angle+0.3));\n  ctx.closePath();\n  ctx.fillStyle=color;ctx.fill();\n  if(label){\n    const mx=(fx+tx)/2,my=(fy+ty)/2;\n    ctx.fillStyle=color;ctx.font='bold 14px PingFang SC';ctx.textAlign='center';\n    ctx.fillText(label,mx,my-10);\n  }\n}\n\nfunction drawCenter(){\n  const[cx,cy]=gridToPixel(CENTER[0],CENTER[1]);\n  ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);\n  ctx.fillStyle=COL.accent;ctx.fill();\n  ctx.strokeStyle=COL.white;ctx.lineWidth=2;ctx.stroke();\n  ctx.fillStyle=COL.accent;ctx.font='bold 16px PingFang SC';ctx.textAlign='center';\n  ctx.fillText('O',cx,cy-14);\n}\n\nfunction drawArcArrow(center,radius,startAngle,endAngle,color){\n  const[cx,cy]=gridToPixel(center[0],center[1]);\n  const r=radius*CW;\n  ctx.strokeStyle=color;ctx.lineWidth=2;\n  ctx.beginPath();ctx.arc(cx,cy,r,startAngle,endAngle);ctx.stroke();\n  const ax=cx+r*Math.cos(endAngle);\n  const ay=cy+r*Math.sin(endAngle);\n  const tang=endAngle+Math.PI/2;\n  ctx.beginPath();\n  ctx.moveTo(ax,ay);\n  ctx.lineTo(ax-10*Math.cos(tang-0.4),ay-10*Math.sin(tang-0.4));\n  ctx.lineTo(ax-10*Math.cos(tang+0.4),ay-10*Math.sin(tang+0.4));\n  ctx.closePath();\n  ctx.fillStyle=color;ctx.fill();\n}\n\nfunction render(){\n  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);\n  drawButton.btns=[];\n\n  ctx.fillStyle=COL.white;ctx.font='bold 24px PingFang SC';ctx.textAlign='center';\n  ctx.fillText('平移与旋转实验台',W/2,35);\n\n  drawButton(20,50,120,36,'平移',mode==='translate'?COL.teal:'#444',()=>{mode='translate';render()});\n  drawButton(150,50,120,36,'旋转',mode==='rotate'?COL.purple:'#444',()=>{mode='rotate';render()});\n\n  drawGrid();\n\n  if(mode==='translate'){\n    ctx.fillStyle=COL.teal;ctx.font='bold 18px PingFang SC';ctx.textAlign='left';\n    ctx.fillText('平移：拖动图形向右移动2格',GRID_X,GRID_Y-10);\n\n    drawShape(ORIG_SHAPE,'rgba(15,150,156,0.25)',COL.shape,1);\n\n    if(showTranslateDemo){\n      drawArrow([3,3],[5,3],COL.gold,'向右2格');\n      drawShape(ORIG_SHAPE,'rgba(107,203,119,0.3)',COL.moved,0.8,[2,0]);\n    }else if(translateOffset[0]!==0||translateOffset[1]!==0){\n      drawShape(ORIG_SHAPE,'rgba(107,203,119,0.3)',COL.moved,0.8,translateOffset);\n    }\n\n    ctx.fillStyle=COL.card;ctx.fillRect(0,H-100,W,100);\n    ctx.strokeStyle=COL.gold;ctx.lineWidth=2;ctx.strokeRect(0,H-100,W,100);\n    ctx.fillStyle=COL.gold;ctx.font='bold 18px PingFang SC';ctx.textAlign='center';\n    if(!showTranslateDemo&&translateOffset[0]===0){\n      ctx.fillText('拖动左侧图形，向右平移2格',W/2,H-70);\n      ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n      ctx.fillText('平移时图形的形状和大小不变，只改变位置  |  点击\"演示\"查看',W/2,H-40);\n    }else if(!showTranslateDemo){\n      ctx.fillText('平移了 '+Math.round(translateOffset[0])+' 格',W/2,H-70);\n      ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n      ctx.fillText('点击\"演示\"查看标准平移  |  点击\"重置\"重新开始',W/2,H-40);\n    }\n    drawButton(1050,H-85,100,36,'演示',COL.teal,()=>{showTranslateDemo=true;translateOffset=[0,0]});\n    drawButton(1160,H-85,100,36,'重置',COL.accent,()=>{showTranslateDemo=false;translateOffset=[0,0]});\n  }else{\n    ctx.fillStyle=COL.purple;ctx.font='bold 18px PingFang SC';ctx.textAlign='left';\n    ctx.fillText('旋转：绕O点顺时针旋转90°',GRID_X,GRID_Y-10);\n\n    drawCenter();\n\n    if(showRotateDemo){\n      for(let i=0;i\u003c4;i++){\n        const a=i*Math.PI/2;\n        drawRotatedBlade(BLADE,CENTER,a,i===0?'rgba(15,150,156,0.4)':'rgba(168,85,247,0.3)',1);\n      }\n      drawArcArrow(CENTER,1.5,0,Math.PI/2,COL.gold);\n      ctx.fillStyle=COL.gold;ctx.font='bold 14px PingFang SC';ctx.textAlign='center';\n      const[lx,ly]=gridToPixel(CENTER[0]+1.8,CENTER[1]-1.2);\n      ctx.fillText('90°',lx,ly);\n    }else{\n      drawRotatedBlade(BLADE,CENTER,0,'rgba(15,150,156,0.4)',1);\n      for(let i=1;i\u003c=rotateStep;i++){\n        drawRotatedBlade(BLADE,CENTER,i*Math.PI/2,'rgba(168,85,247,0.3)',0.8);\n      }\n      if(rotateStep>0){\n        drawArcArrow(CENTER,1.5,0,rotateStep*Math.PI/2,COL.gold);\n        ctx.fillStyle=COL.gold;ctx.font='bold 14px PingFang SC';ctx.textAlign='center';\n        const[lx,ly]=gridToPixel(CENTER[0]+1.8,CENTER[1]-1.2);\n        ctx.fillText(rotateStep*90+'°',lx,ly);\n      }\n    }\n\n    ctx.fillStyle=COL.card;ctx.fillRect(0,H-100,W,100);\n    ctx.strokeStyle=COL.gold;ctx.lineWidth=2;ctx.strokeRect(0,H-100,W,100);\n    ctx.fillStyle=COL.gold;ctx.font='bold 18px PingFang SC';ctx.textAlign='center';\n    if(!showRotateDemo&&rotateStep===0){\n      ctx.fillText('点击\"旋转一次\"，每次顺时针旋转90°',W/2,H-70);\n      ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n      ctx.fillText('旋转三要素：中心、方向、角度  |  点击\"演示\"查看完整风车',W/2,H-40);\n    }else if(!showRotateDemo){\n      ctx.fillText('已旋转 '+rotateStep+' 次，共 '+rotateStep*90+'°',W/2,H-70);\n      ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n      ctx.fillText('点击\"演示\"查看完整风车  |  点击\"重置\"重新开始',W/2,H-40);\n    }\n    drawButton(920,H-85,120,36,'旋转一次',COL.purple,()=>{if(rotateStep\u003c3)rotateStep++;render()});\n    drawButton(1050,H-85,100,36,'演示',COL.teal,()=>{showRotateDemo=true;rotateStep=0});\n    drawButton(1160,H-85,100,36,'重置',COL.accent,()=>{showRotateDemo=false;rotateStep=0});\n  }\n}\n\nfunction drawButton(x,y,w,h,text,color,onclick){\n  ctx.fillStyle=color;\n  ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.fill();\n  ctx.fillStyle=COL.white;ctx.font='bold 16px PingFang SC';ctx.textAlign='center';\n  ctx.fillText(text,x+w/2,y+h/2+6);\n  drawButton.btns.push({x,y,w,h,onclick});\n}\ndrawButton.btns=[];\n\nlet isDragging=false,dragBaseOffset=[0,0];\nC.addEventListener('mousedown',e=>{\n  const rect=C.getBoundingClientRect();\n  const scaleX=W/rect.width,scaleY=H/rect.height;\n  const mx=(e.clientX-rect.left)*scaleX;\n  const my=(e.clientY-rect.top)*scaleY;\n\n  if(drawButton.btns){\n    for(const b of drawButton.btns){\n      if(mx>=b.x&&mx\u003c=b.x+b.w&&my>=b.y&&my\u003c=b.y+b.h){\n        b.onclick();render();return;\n      }\n    }\n  }\n\n  if(mode==='translate'&&!showTranslateDemo){\n    const[gx,gy]=pixelToGrid(mx,my);\n    const cx=3+translateOffset[0],cy=3+translateOffset[1];\n    if(Math.abs(gx-cx)\u003c2&&Math.abs(gy-cy)\u003c2){\n      isDragging=true;\n      dragStart=[gx,gy];dragBaseOffset=[...translateOffset];\n    }\n  }\n});\n\nC.addEventListener('mousemove',e=>{\n  if(!isDragging)return;\n  const rect=C.getBoundingClientRect();\n  const scaleX=W/rect.width,scaleY=H/rect.height;\n  const mx=(e.clientX-rect.left)*scaleX;\n  const my=(e.clientY-rect.top)*scaleY;\n  const[gx,gy]=pixelToGrid(mx,my);\n  translateOffset=[dragBaseOffset[0]+Math.round(gx-dragStart[0]),Math.round(gy-dragStart[1])];\n  if(translateOffset[0]\u003c0)translateOffset[0]=0;\n  if(translateOffset[0]>4)translateOffset[0]=4;\n  translateOffset[1]=0;\n  render();\n});\n\nC.addEventListener('mouseup',()=>{isDragging=false});\nC.addEventListener('mouseleave',()=>{isDragging=false});\n\nC.addEventListener('touchstart',e=>{\n  e.preventDefault();\n  const t=e.touches[0];\n  C.dispatchEvent(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY}));\n});\nC.addEventListener('touchmove',e=>{\n  e.preventDefault();\n  const t=e.touches[0];\n  C.di 534667, "text": "再确定平移的距离。"}, {"start": 46.534667, "end": 49.302667, "text": "图形的形状和大小不会改变。"}, {"start": 49.302667, "end": 53.259667, "text": "再看风车图案。我们借助钟面来研究。"}, {"start": 53.259667, "end": 56.285667, "text": "钟面上的分针从12走到3，"}, {"start": 56.285667, "end": 60.243667, "text": "绕中心点按顺时针方向旋转了90度。"}, {"start": 60.243667, "end": 62.803667, "text": "与时针旋转方向相同的，"}, {"start": 62.803667, "end": 66.062667, "text": "叫顺时针旋转。方向相反的呢，"}, {"start": 66.062667, "end": 67.924667, "text": "就叫逆时针旋转。"}, {"start": 67.924667, "end": 70.950667, "text": "旋转有三个要素：旋转中心、"}, {"start": 70.950667, "end": 73.278667, "text": "旋转方向和旋转角度。"}, {"start": 73.278667, "end": 75.188667, "text": "现在来画风车图案。"}, {"start": 75.188667, "end": 77.099667, "text": "先画一个基本图形，"}, {"start": 77.099667, "end": 80.920667, "text": "再将这个图形绕O点顺时针旋转90度，"}, {"start": 80.920667, "end": 83.043667, "text": "就能得到第二个图形。"}, {"start": 83.043667, "end": 86.015667, "text": "然后再旋转90度得到第三个，"}, {"start": 86.015667, "end": 88.562667, "text": "再旋转90度得到第四个。"}, {"start": 88.562667, "end": 92.595667, "text": "这样旋转三次，就得到了完整的风车图案。"}, {"start": 92.595667, "end": 94.930667, "text": "当然，也可以先画一个，"}, {"start": 94.930667, "end": 97.902667, "text": "再逆时针旋转来得到其他部分。"}, {"start": 97.902667, "end": 101.330667, "text": "今天我们学习了图形的平移和旋转。"}, {"start": 101.330667, "end": 103.687667, "text": "平移要注意方向和距离，"}, {"start": 103.687667, "end": 106.687667, "text": "平移后图形的形状和大小不变。"}, {"start": 106.687667, "end": 109.901667, "text": "旋转要注意三个要素：旋转中心、"}, {"start": 109.901667, "end": 112.044667, "text": "旋转方向和旋转角度。"}, {"start": 112.044667, "end": 113.758667, "text": "利用平移和旋转，"}, {"start": 113.758667, "end": 116.972667, "text": "我们可以设计出许多美丽的图案。"}, {"start": 116.972667, "end": 118.686667, "text": "你也能试一试吗？"}]}</script><script id="itv-runtime">(()=>{'use strict';

v.addEventListener('ended',()=>{if(waiting!==null)return;const i=scenes.findIndex(s=>!state.visited[s.id]);i>=0?question(i):finish();});function initMedia(){seekbar.max=v.duration;seek(Math.min(state.position,Math.max(0,v.duration-.2)),false);}v.addEventListener('loadedmetadata',initMedia);if(v.readyState>=1)initMedia();v.addEventListener('error',()=>status.textContent='视频未能加载，请重新打开或使用其他浏览器。');seekbar.onchange=()=>seek(Number(seekbar.value));
root.querySelector('.nv-mute').onclick=e=>{v.muted=!v.muted;e.target.textContent=v.muted?'开启声音':'静音';};root.querySelector('.nv-fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await root.requestFullscreen();}catch(e){status.textContent='当前浏览器无法进入全屏。';}};
let show=true;const captions=cfg.captions||[];function paint(){const cue=captions.find(c=>v.currentTime>=c.start&&v.currentTime<c.end),b=root.querySelector('.nv-caption');b.replaceChildren();if(show&&cue){const span=document.createElement('span');span.textContent=cue.text;b.append(span);}}v.addEventListener('timeupdate',paint);v.addEventListener('seeked',paint);root.querySelector('.nv-subtitles').onclick=e=>{show=!show;e.target.textContent=show?'隐藏字幕':'显示字幕';e.target.setAttribute('aria-pressed',String(show));paint();};
film.querySelector('.nv-chapters').innerHTML=scenes.map((s,i)=>'<button type="button" data-scene="'+i+'">'+escape(s.title)+'</button>').join('');film.querySelector('.nv-chapters').onclick=e=>{const b=e.target.closest('[data-scene]');if(b){seek(scenes[Number(b.dataset.scene)].start,false);revisit=true;resume();}};
film.querySelector('.nv-reset').onclick=()=>{v.pause();state={answers:{},visited:{},position:0};document.querySelectorAll('[data-itv-field]').forEach(el=>{if(el.type==='radio')el.checked=false;else el.value='';delete el.dataset.state;});revisit=false;seek(0,false);save();update();};film.querySelector('.nv-to-list').onclick=()=>{v.pause();film.querySelector('.itv-list').scrollIntoView({behavior:'smooth'});};film.querySelector('.nv-transcript').textContent=scenes.map(s=>s.title+'\n'+(s.narration||'')).join('\n\n');film.querySelector('.itv-list-fields').innerHTML=all.map(f=>control(f,state.answers[f.id]||'')).join('');
root.addEventListener('keydown',e=>{e.stopPropagation();if(e.target.matches('input,textarea,select'))return;if(e.key===' '&&e.target===v){e.preventDefault();play.click();}});v.addEventListener('click',()=>play.click());Object.entries(state.answers).forEach(([id,value])=>sync(id,value));update();
})();
</script></body></html>
