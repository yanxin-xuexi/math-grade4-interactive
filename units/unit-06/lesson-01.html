<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-decimal-meaning-v1-storybook-v3", "title": "小数的意义、组成与读写", "scenes": [{"id": "S01", "title": "情境：校园小农场的菜地", "start": 0, "end": 23.184, "narration": "小林和小禾准备给小农场的菜地围上边框。他们量得菜地长2米，宽84厘米。记录表却要求用米来填写。把测量结果记到观察板上。84厘米是多少米呢？要回答这个问题，我们需要认识一种新的数——小数。", "fields": [{"id": "s01-observe", "type": "observe", "prompt": "观察菜地的尺寸，想一想84厘米用米怎么表示。"}]}, {"id": "S02", "title": "十分之一与一位小数", "start": 23.184, "end": 40.8, "narration": "把1米平均分成10份，每份是1分米。1分米就是十分之一米，写成小数是0.1米。3分米是十分之三米，也就是0.3米；8分米就是0.8米。这些小数表示的就是十分之几。", "fields": [{"id": "lab-decimal-build", "type": "observe", "prompt": "实验台：用十分之一、百分之一的小方块构建小数，看看小数是怎么组成的。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>小数构建实验台 · 看看小数是怎么组成的\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft Yahei\",sans-serif}\n  .container{max-width:1280px;margin:0 auto;padding:20px}\n  canvas{display:block;margin:0 auto;border-radius:16px;background:#FFF;touch-action:none;cursor:pointer}\n  .title-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}\n  .badge{background:#1A3A3A;color:#FFF;padding:6px 16px;border-radius:15px;font-size:14px;letter-spacing:2px}\n  h1{font-size:28px;color:#22333C;margin:0}\n  .subtitle{font-size:16px;color:#53675E;margin:4px 0 16px}\n  .underline{height:5px;background:#E8B94A;border-radius:3px;margin-top:4px}\n  .controls{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;align-items:center}\n  .btn{padding:10px 24px;border-radius:20px;border:none;font-size:15px;font-weight:bold;cursor:pointer;user-select:none}\n  .btn-tenth{background:#A4D4C5;color:#1A3A3A}\n  .btn-hundredth{background:#E8B94A;color:#FFF}\n  .btn-thousandth{background:#B8A4ED;color:#FFF}\n  .btn-reset{background:#FF6B5A;color:#FFF}\n  .btn-record{background:#1A3A3A;color:#FFF}\n  .btn:active{transform:scale(0.95)}\n  .display{margin-top:16px;padding:20px;background:#FFF;border-radius:16px;border:2px solid #E3D5C0;text-align:center}\n  .display .number{font-size:48px;font-weight:bold;color:#22333C}\n  .display .breakdown{font-size:18px;color:#53675E;margin-top:8px}\n  .status{padding:10px 20px;border-radius:20px;font-size:16px;font-weight:bold;display:inline-block}\n  .status.pending{background:#F3EBDD;color:#53675E}\n  .status.success{background:#A4D4C5;color:#1A3A3A}\n  .log-box{margin-top:16px;padding:14px;background:#FFF;border-radius:12px;border:1.5px solid #E3D5C0;font-size:14px;color:#22333C;min-height:60px}\n  .target{margin-top:12px;padding:12px 20px;background:#B8A4ED;border-radius:12px;color:#FFF;font-size:16px;font-weight:bold;text-align:center}\n\u003c/style>\n\u003cstyle>canvas,svg{max-width:100%;height:auto}.status-bar{flex-wrap:wrap}button:disabled{opacity:.45;cursor:default}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"container\">\n  \u003cdiv class=\"title-bar\">\n    \u003cspan class=\"badge\">实验台 · 小数的组成\u003c/span>\n  \u003c/div>\n  \u003ch1>构建小数：看看小数是怎么组成的\u003c/h1>\n  \u003cdiv class=\"underline\" style=\"width:340px\">\u003c/div>\n  \u003cp class=\"subtitle\">点击按钮添加十分之一、百分之一、千分之一的方块，看看它们怎么组成一个小数。\u003c/p>\n\n  \u003cdiv class=\"target\" id=\"targetBar\">目标：构建 0.84（8个十分之一 + 4个百分之一）\u003c/div>\n\n  \u003ccanvas id=\"drawCanvas\" width=\"800\" height=\"360\">\u003c/canvas>\n\n  \u003cdiv class=\"controls\">\n    \u003cbutton class=\"btn btn-tenth\" onclick=\"addTenth()\">+ 0.1（十分之一）\u003c/button>\n    \u003cbutton class=\"btn btn-hundredth\" onclick=\"addHundredth()\">+ 0.01（百分之一）\u003c/button>\n    \u003cbutton class=\"btn btn-thousandth\" onclick=\"addThousandth()\">+ 0.001（千分之一）\u003c/button>\n    \u003cbutton class=\"btn btn-reset\" onclick=\"resetAll()\">清零\u003c/button>\n    \u003cbutton class=\"btn btn-record\" onclick=\"recordFinding()\">写下我的发现\u003c/button>\n  \u003c/div>\n\n  \u003cdiv class=\"display\">\n    \u003cdiv class=\"number\" id=\"numDisplay\">0\u003c/div>\n    \u003cdiv class=\"breakdown\" id=\"breakdown\">还没有添加任何方块\u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"margin-top:12px\">\n    \u003cspan id=\"statusBadge\" class=\"status pending\">开始构建吧\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"log-box\" id=\"logBox\">实验记录：等待你的操作……\u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\nconst canvas = document.getElementById('drawCanvas');\nconst ctx = canvas.getContext('2d');\n\nlet tenths = 0;\nlet hundredths = 0;\nlet thousandths = 0;\n\nconst COLORS = {\n  tenth: '#A4D4C5',\n  hundredth: '#E8B94A',\n  thousandth: '#B8A4ED'\n};\n\nfunction getTotal() {\n  return tenths * 0.1 + hundredths * 0.01 + thousandths * 0.001;\n}\n\nfunction formatNum(n) {\n  const s = n.toFixed(3);\n  return s.replace(/0+$/, '').replace(/\\.$/, '');\n}\n\nfunction draw() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n  const barW = 60, barH = 280, gap = 12;\n  const startX = 40, startY = 40;\n\n  ctx.font = 'bold 14px sans-serif';\n  ctx.textAlign = 'center';\n  ctx.fillStyle = '#53675E';\n  ctx.fillText('十分之一', startX + barW/2, startY - 20);\n  ctx.fillText('百分之一', startX + barW + gap + barW/2, startY - 20);\n  ctx.fillText('千分之一', startX + 2*(barW + gap) + barW/2, startY - 20);\n\n  for(let i=0;i\u003c3;i++)ctx.fillText('个数',startX+i*(barW+gap)+barW/2,startY-3);\n  for (let col = 0; col \u003c 3; col++) {\n    const x = startX + col * (barW + gap);\n    const color = [COLORS.tenth, COLORS.hundredth, COLORS.thousandth][col];\n    const count = [tenths, hundredths, thousandths][col];\n    const maxSlots = 10;\n\n    ctx.strokeStyle = '#E3D5C0';\n    ctx.lineWidth = 1;\n    for (let i = 0; i \u003c maxSlots; i++) {\n      const y = startY + i * (barH / maxSlots);\n      ctx.strokeRect(x, y, barW, barH / maxSlots);\n    }\n\n    for (let i = 0; i \u003c Math.min(count, maxSlots); i++) {\n      const y = startY + (maxSlots - 1 - i) * (barH / maxSlots);\n      ctx.fillStyle = color;\n      ctx.globalAlpha = 0.7;\n      ctx.fillRect(x + 2, y + 2, barW - 4, barH / maxSlots - 4);\n      ctx.globalAlpha = 1;\n    }\n\n    ctx.fillStyle = '#22333C';\n    ctx.font = 'bold 18px sans-serif';\n    ctx.fillText(String(count), x + barW/2, startY + barH + 24);\n  }\n\n  const totalX = 350, totalY = 80;\n  ctx.fillStyle = '#22333C';\n  ctx.font = 'bold 16px sans-serif';\n  ctx.textAlign = 'left';\n  ctx.fillText('当前数值', totalX, totalY);\n\n  ctx.font = 'bold 48px sans-serif';\n  ctx.fillStyle = '#FF6B5A';\n  ctx.fillText(formatNum(getTotal()), totalX, totalY + 60);\n\n  ctx.font = '16px sans-serif';\n  ctx.fillStyle = '#53675E';\n  const parts = [];\n  if (tenths > 0) parts.push(tenths + ' × 0.1 = ' + (tenths * 0.1).toFixed(1));\n  if (hundredths > 0) parts.push(hundredths + ' × 0.01 = ' + (hundredths * 0.01).toFixed(2));\n  if (thousandths > 0) parts.push(thousandths + ' × 0.001 = ' + (thousandths * 0.001).toFixed(3));\n  if (parts.length === 0) {\n    ctx.fillText('还没有添加方块', totalX, totalY + 100);\n  } else {\n    parts.forEach((p, i) => {\n      ctx.fillText(p, totalX, totalY + 100 + i * 28);\n    });\n  }\n\n  if (Math.abs(getTotal() - 0.84) \u003c 0.0001) {\n    ctx.fillStyle = '#A4D4C5';\n    ctx.font = 'bold 20px sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText('✓ 成功构建 0.84！', 550, 320);\n  }\n}\n\nfunction updateDisplay() {\n  const total = getTotal();\n  document.getElementById('numDisplay').textContent = formatNum(total);\n  const parts = [];\n  if (tenths > 0) parts.push(tenths + '个十分之一(0.1)');\n  if (hundredths > 0) parts.push(hundredths + '个百分之一(0.01)');\n  if (thousandths > 0) parts.push(thousandths + '个千分之一(0.001)');\n  document.getElementById('breakdown').textContent = parts.length ? parts.join(' + ') : '还没有添加任何方块';\n\n  const badge = document.getElementById('statusBadge');\n  if (Math.abs(total - 0.84) \u003c 0.0001) {\n    badge.className = 'status success';\n    badge.textContent = '成功构建 0.84！';\n  } else if (total > 0) {\n    badge.className = 'status pending';\n    badge.textContent = '继续构建……目标是 0.84';\n  } else {\n    badge.className = 'status pending';\n    badge.textContent = '开始构建吧';\n  }\n}\n\nfunction addTenth() {\n  if (tenths \u003c 10) { tenths++; log('添加了1个十分之一(0.1)，当前有' + tenths + '个'); update(); }\n}\nfunction addHundredth() {\n  if (hundredths \u003c 10) { hundredths++; log('添加了1个百分之一(0.01)，当前有' + hundredths + '个'); update(); }\n}\nfunction addThousandth() {\n  if (thousandths \u003c 10) { thousandths++; log('添加了1个千分之一(0.001)，当前有' + thousandths + '个'); update(); }\n}\n\nfunction update() {\n  updateDisplay();\n  draw();\n}\n\nfunction resetAll() {\n  tenths = 0; hundredths = 0; thousandths = 0;\n  log('已清零，重新开始');\n  update();\n}\n\nfunction log(msg) {\n  document.getElementById('logBox').textContent = '实验记录：' + msg;\n}\n\nfunction recordFinding(){window.parent.postMessage({type:\"lab-focus\",id:\"lab-decimal-build\"},\"*\");}\n\ndraw();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "instruction": "动手实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S03", "title": "百分之一、千分之一与小数定义", "start": 40.8, "end": 67.992, "narration": "把1米平均分成100份，每份是1厘米，也就是百分之一米，写成小数是0.01米。84厘米就是百分之八十四米，写成小数是0.84米。如果分成1000份，每份是1毫米，也就是0.001米。像0.3、0.84、0.001这样表示十分之几、百分之几、千分之几的数，就是小数。", "fields": [{"id": "s03-observe", "type": "observe", "prompt": "观察：1厘米=0.01米，84厘米=0.84米。小数的计数单位是什么？"}]}, {"id": "S04", "title": "小数的组成与数位顺序", "start": 67.992, "end": 92.352, "narration": "小数由整数部分、小数点和小数部分组成。看数位顺序表，个位左边是十位、百位，右边是十分位、百分位、千分位。相邻两个计数单位之间的进率是10。比如3.245，3表示3个一，2表示2个十分之一，4表示4个百分之一，5表示5个千分之一。", "fields": [{"id": "s04-observe", "type": "observe", "prompt": "看数位顺序表，说说3.245中每个数字分别表示什么。"}]}, {"id": "S05", "title": "小数的读法", "start": 92.352, "end": 110.56666666666666, "narration": "最后来学小数的读法。整数部分按原来的方法读，小数点读作'点'，小数部分依次读出每个数字。0.3读作零点三，0.84读作零点八四，0.012读作零点零一二。你学会了吗？", "fields": [{"id": "s05-observe", "type": "observe", "prompt": "练习读小数：0.3、0.84、0.012，注意小数部分要依次读出每个数字。"}]}
