<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-decimal-approx-rewrite-v1-storybook-v3", "title": "小数的近似数与改写", "scenes": [{"id": "S01", "title": "情境：白菜的重量", "start": 0, "end": 25.524, "narration": "小林和小禾给小农场的白菜称重，电子秤上显示1.93千克。准备给同学介绍收获时，这个重量还能怎样说？在某些情况下，我们不需要知道精确的值，可以用近似数来表示。1.9千克和2千克都可以看作1.93千克的近似数，但二者表示的精确程度不同。", "fields": [{"id": "s01-observe", "type": "observe", "prompt": "观察：1.93千克可以用1.9千克或2千克来近似，它们的精确程度有什么不同？"}]}, {"id": "S02", "title": "四舍五入法求近似数", "start": 25.524, "end": 50.46, "narration": "求小数的近似数和求整数的近似数一样，可以用四舍五入法。保留一位小数，要看百分位。1.93的百分位是3，小于5，舍去，所以1.93约等于1.9。保留整数，要看十分位。1.93的十分位是9，大于5，向前一位进1，所以1.93约等于2。", "fields": [{"id": "lab-decimal-approx", "type": "observe", "prompt": "实验台：输入一个小数，选择保留几位，看四舍五入的过程。", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>小数近似数实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#0f0f23;color:#eee;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif;overflow:auto}\n#wrap{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}\nh2{font-size:22px;color:#f5a623;margin-bottom:10px}\n.row{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap;justify-content:center}\nlabel{font-size:16px;color:#aaa}\ninput[type=number]{width:120px;padding:6px 10px;font-size:18px;border:2px solid #0f969c;border-radius:8px;background:#16213e;color:#eee;text-align:center}\ninput[type=number]:focus{outline:none;border-color:#f5a623}\n.btn{padding:8px 18px;font-size:16px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}\n.btn-teal{background:#0f969c;color:#fff}\n.btn-gold{background:#f5a623;color:#1a1a2e}\n.btn-accent{background:#e94560;color:#fff}\n.btn:hover{opacity:.85}\nselect{padding:6px 12px;font-size:16px;border:2px solid #0f969c;border-radius:8px;background:#16213e;color:#eee}\n#canvas{border:2px solid #333;border-radius:12px;margin-top:10px;background:#16213e}\n#result{margin-top:8px;font-size:20px;min-height:30px;text-align:center}\n#hint{font-size:14px;color:#888;margin-top:4px}\n\u003c/style>\n\u003cstyle>canvas,svg{max-width:100%;height:auto}.status-bar{flex-wrap:wrap}button:disabled{opacity:.45;cursor:default}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv id=\"wrap\">\n\u003ch2>小数近似数实验台\u003c/h2>\n\u003cdiv class=\"row\">\n  \u003clabel>输入小数：\u003c/label>\n  \u003cinput type=\"number\" id=\"numInput\" value=\"1.93\" step=\"any\" min=\"0\" max=\"999.99\">\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003clabel>保留：\u003c/label>\n  \u003cselect id=\"precision\">\n    \u003coption value=\"0\">整数\u003c/option>\n    \u003coption value=\"1\" selected>一位小数\u003c/option>\n    \u003coption value=\"2\">两位小数\u003c/option>\n  \u003c/select>\n  \u003cbutton class=\"btn btn-teal\" id=\"goBtn\">四舍五入\u003c/button>\n  \u003cbutton class=\"btn btn-gold\" id=\"resetBtn\">重置\u003c/button>\n\u003c/div>\n\u003ccanvas id=\"canvas\" width=\"800\" height=\"300\">\u003c/canvas>\n\u003cdiv id=\"result\">\u003c/div>\n\u003cdiv id=\"hint\">提示：输入一个小数，选择保留位数，点击\"四舍五入\"看过程。\u003c/div>\n\u003c/div>\n\u003cscript>\nconst canvas=document.getElementById('canvas');\nconst ctx=canvas.getContext('2d');\nconst numInput=document.getElementById('numInput');\nconst precisionSel=document.getElementById('precision');\nconst resultDiv=document.getElementById('result');\nconst goBtn=document.getElementById('goBtn');\nconst resetBtn=document.getElementById('resetBtn');\n\nconst C={bg:'#16213e',card:'#1a1a2e',accent:'#e94560',gold:'#f5a623',teal:'#0f969c',green:'#6bcb77',white:'#eee',purple:'#a855f7'};\n\nlet anim={phase:0,t:0,num:1.93,prec:1,digits:[],lookDigit:0,roundDigit:0,approxVal:0,show:false};\n\nfunction decimalRound(raw,p){const [a,b='']=raw.split('.');const padded=b.padEnd(p+1,'0');let n=BigInt(a+(p?padded.slice(0,p):''));if(padded[p]>='5')n++;let r=n.toString().padStart(p+1,'0');return p?r.slice(0,-p)+'.'+r.slice(-p):r;}\nfunction getDigits(num,prec){\n  const s=anim.raw||String(num);\n  const parts=s.split('.');\n  const intParts=parts[0].split('');\n  const decParts=parts[1]?parts[1].split(''):[];\n  while(decParts.length\u003c4)decParts.push('0');\n  return{intParts,decParts};\n}\n\nfunction drawNumberLine(){\n  const w=canvas.width,h=canvas.height;\n  ctx.clearRect(0,0,w,h);\n  ctx.fillStyle=C.bg;\n  ctx.fillRect(0,0,w,h);\n\n  const num=anim.num;\n  const prec=anim.prec;\n\n  // Calculate bounds\n  let lower,upper,step;\n  if(prec===0){\n    lower=Math.floor(num);upper=Math.ceil(num);\n    if(lower===upper){lower=lower-1;upper=upper+1;}\n    step=(upper-lower)/10;\n  }else if(prec===1){\n    lower=Math.floor(num*10)/10;upper=Math.ceil(num*10)/10;\n    if(lower===upper){lower=lower-0.1;upper=upper+0.1;}\n    step=(upper-lower)/10;\n  }else{\n    lower=Math.floor(num*100)/100;upper=Math.ceil(num*100)/100;\n    if(lower===upper){lower=lower-0.01;upper=upper+0.01;}\n    step=(upper-lower)/10;\n  }\n\n  const margin=80;\n  const lineY=120;\n  const lineW=w-2*margin;\n\n  // Draw number line\n  ctx.strokeStyle='#444';\n  ctx.lineWidth=2;\n  ctx.beginPath();\n  ctx.moveTo(margin,lineY);\n  ctx.lineTo(w-margin,lineY);\n  ctx.stroke();\n\n  // Tick marks\n  const ticks=11;\n  for(let i=0;i\u003cticks;i++){\n    const x=margin+i*(lineW/(ticks-1));\n    const val=lower+i*step;\n    ctx.beginPath();\n    ctx.moveTo(x,lineY-8);\n    ctx.lineTo(x,lineY+8);\n    ctx.stroke();\n\n    ctx.fillStyle='#aaa';\n    ctx.font='14px PingFang SC';\n    ctx.textAlign='center';\n    let label;\n    if(prec===0)label=val.toFixed(prec+1);\n    else if(prec===1)label=val.toFixed(prec+1);\n    else label=val.toFixed(prec+1);\n    ctx.fillText(label,x,lineY+28);\n  }\n\n  // Mark the original number\n  const numX=margin+((num-lower)/(upper-lower))*lineW;\n  ctx.fillStyle=C.accent;\n  ctx.beginPath();\n  ctx.arc(numX,lineY,8,0,Math.PI*2);\n  ctx.fill();\n  ctx.fillStyle=C.accent;\n  ctx.font='bold 18px PingFang SC';\n  ctx.textAlign='center';\n  ctx.fillText(anim.raw||String(num),numX,lineY-20);\n\n  // Mark the approximate value if shown\n  if(anim.show){\n    let approxVal;\n    approxVal=Number(decimalRound(anim.raw||String(num),prec));\n\n    const approxX=margin+((approxVal-lower)/(upper-lower))*lineW;\n    ctx.fillStyle=C.green;\n    ctx.beginPath();\n    ctx.arc(approxX,lineY+50,10,0,Math.PI*2);\n    ctx.fill();\n\n    ctx.strokeStyle=C.green;\n    ctx.lineWidth=2;\n    ctx.setLineDash([4,4]);\n    ctx.beginPath();\n    ctx.moveTo(numX,lineY+8);\n    ctx.lineTo(approxX,lineY+42);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    let approxLabel;\n    if(prec===0)approxLabel=approxVal.toFixed(0);\n    else if(prec===1)approxLabel=approxVal.toFixed(1);\n    else approxLabel=approxVal.toFixed(2);\n\n    ctx.fillStyle=C.green;\n    ctx.font='bold 20px PingFang SC';\n    ctx.textAlign='center';\n    ctx.fillText('≈ '+approxLabel,approxX,lineY+80);\n  }\n\n  // Show the digit being examined\n  if(anim.show){\n    const{intParts,decParts}=getDigits(num,prec);\n    const allDigits=[...intParts,'.',...decParts];\n\n    ctx.font='bold 32px PingFang SC';\n    ctx.textAlign='center';\n    const startX=w/2-(allDigits.length*40)/2;\n    const digitY=230;\n\n    for(let i=0;i\u003callDigits.length;i++){\n      const dx=startX+i*40+20;\n      const ch=allDigits[i];\n\n      // Determine which digit position this is\n      let posIdx=-1;\n      if(ch!=='.'){\n        const dotIdx=allDigits.indexOf('.');\n        if(i>dotIdx)posIdx=i-dotIdx-1;\n      }\n\n      // The digit to look at depends on precision\n      let lookPos;\n      if(prec===0)lookPos=0; // look at first decimal (十分位)\n      else if(prec===1)lookPos=1; // look at second decimal (百分位)\n      else lookPos=2; // look at third decimal (千分位)\n\n      if(ch!=='.'&&posIdx===lookPos){\n        // Highlight this digit\n        ctx.fillStyle=C.gold;\n        ctx.fillRect(dx-18,digitY-28,36,40);\n        ctx.fillStyle='#1a1a2e';\n        ctx.fillText(ch,dx,digitY);\n\n        // Label below\n        ctx.font='14px PingFang SC';\n        ctx.fillStyle=C.gold;\n        let posName=['十分位','百分位','千分位'][lookPos];\n        ctx.fillText('看'+posName,dx,digitY+30);\n        ctx.font='bold 32px PingFang SC';\n      }else if(ch==='.'){\n        ctx.fillStyle='#888';\n        ctx.fillText(ch,dx,digitY);\n      }else{\n        ctx.fillStyle=C.white;\n        ctx.fillText(ch,dx,digitY);\n      }\n    }\n\n    // Show the decision\n    const{decParts:dps}=getDigits(num,prec);\n    let lookIdx;\n    if(prec===0)lookIdx=0;\n    else if(prec===1)lookIdx=1;\n    else lookIdx=2;\n    const lookVal=parseInt(dps[lookIdx]);\n    const decision=lookVal\u003c5?'舍去':'进1';\n    const symbol=lookVal\u003c5?'＜ 5':'≥ 5';\n\n    ctx.font='bold 20px PingFang SC';\n    ctx.fillStyle=lookVal\u003c5?C.teal:C.accent;\n    ctx.textAlign='center';\n    ctx.fillText(lookVal+' '+symbol+' → '+decision,w/2,digitY+60);\n  }\n}\n\nfunction run(){\n  const raw=numInput.value.trim();if(!/^\\d{1,6}(?:\\.\\d{0,8})?$/.test(raw)){resultDiv.textContent='请输入非负小数（最多6位整数、8位小数）。';return;}anim.raw=raw;anim.num=Number(raw);\n  anim.prec=parseInt(precisionSel.value);\n  anim.show=true;\n\n  let approxVal;\n  approxVal=Number(decimalRound(anim.raw,anim.prec));\n\n  let approxLabel;\n  if(anim.prec===0)approxLabel=approxVal.toFixed(0);\n  else if(anim.prec===1)approxLabel=approxVal.toFixed(1);\n  else approxLabel=approxVal.toFixed(2);\n\n  let precName=['整数','一位小数','两位小数'][anim.prec];\n  resultDiv.innerHTML='\u003cspan style=\"color:'+C.green+'\">'+anim.num+' ≈ '+approxLabel+'\u003c/span> \u003cspan style=\"color:#aaa\">（保留'+precName+'）\u003c/span>';\n\n  drawNumberLine();\n\n\n}\n\nfunction reset(){\n  anim.show=false;\n  numInput.value='1.93';anim.num=1.93;anim.raw='1.93';anim.prec=1;\n  precisionSel.value='1';\n  resultDiv.innerHTML='';\n  drawNumberLine();\n}\n\ngoBtn.addEventListener('click',run);\nresetBtn.addEventListener('click',reset);\nn
