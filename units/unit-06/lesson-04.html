<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-decimal-unit-convert-v1-storybook-v3", "title": "小数与单位换算", "scenes": [{"id": "S01", "title": "情境：南瓜称重问题", "start": 0, "end": 19.432, "narration": "小林和小禾在小农场收获了两种南瓜。绿南瓜300克，黄南瓜3.5千克。把称重记录放到观察板上。黄南瓜比绿南瓜重多少？单位不同，应该先改写成相同的单位再计算。", "fields": [{"id": "s01-observe", "type": "observe", "prompt": "观察：300克和3.5千克，单位不同，怎样统一单位？"}]}, {"id": "S02", "title": "方法一：千克改写成克", "start": 19.432, "end": 36.736, "narration": "方法一：把千克改写成克。3.5乘以1000等于3500，所以3.5千克等于3500克。3500减300等于3200克。把千克改写成克，相当于把小数点向右移动三位。", "fields": [{"id": "s02-observe", "type": "observe", "prompt": "3.5千克→克：小数点向右移动三位，3.5→3500。"}]}, {"id": "S03", "title": "方法二：克改写成千克", "start": 36.736, "end": 58.888, "narration": "方法二：把克改写成千克。300除以1000等于0.3，所以300克等于0.3千克。3.5减0.3等于3.2千克。把克改写成千克，相当于把小数点向左移动三位。所以黄南瓜比绿南瓜重3200克，也就是3.2千克。", "fields": [{"id": "s03-observe", "type": "observe", "prompt": "300克→千克：小数点向左移动三位，300→0.3。"}]}, {"id": "S04", "title": "继续应用：单位换算练习", "start": 58.888, "end": 92.416, "narration": "继续应用。1.36平方米等于多少平方分米？平方米和平方分米之间的进率是100，小数点右移两位，等于136平方分米。1米26厘米等于多少米？26厘米除以100等于0.26米，所以等于1.26米。2.39千克等于多少千克多少克？整数部分2就是2千克，0.39千克乘以1000等于390克，所以等于2千克390克。", "fields": [{"id": "lab-unit-convert", "type": "observe", "prompt": "实验台：选择单位换算题目，观察小数点怎样移动。", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>单位换算实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#1a1a2e;font-family:system-ui;color:#eee;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}\nh2{font-size:20px;margin-bottom:10px;color:#f5a623}\n.problems{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}\n.prob-btn{padding:8px 16px;border:2px solid #0f969c;border-radius:8px;background:#16213e;color:#eee;font-size:14px;cursor:pointer;touch-action:manipulation}\n.prob-btn.active{background:#0f969c;color:#fff}\n.canvas-wrap{margin-bottom:14px}\ncanvas{border-radius:12px;background:#16213e;display:block}\n.result{background:#16213e;border-radius:10px;padding:14px 20px;text-align:center;max-width:520px;width:100%}\n.result .question{font-size:18px;color:#ccc;margin-bottom:8px}\n.result .answer{font-size:28px;font-weight:bold;color:#6bcb77;margin:8px 0}\n.result .explain{font-size:15px;color:#f5a623;line-height:1.5}\n\u003c/style>\n\u003cstyle>canvas,svg{max-width:100%;height:auto}.status-bar{flex-wrap:wrap}button:disabled{opacity:.45;cursor:default}\u003c/style>\u003c/head>\n\u003cbody>\n\u003ch2>单位换算实验台\u003c/h2>\n\u003cdiv class=\"problems\">\n  \u003cbutton class=\"prob-btn active\" data-idx=\"0\">3.5千克→克\u003c/button>\n  \u003cbutton class=\"prob-btn\" data-idx=\"1\">300克→千克\u003c/button>\n  \u003cbutton class=\"prob-btn\" data-idx=\"2\">1.36m²→dm²\u003c/button>\n  \u003cbutton class=\"prob-btn\" data-idx=\"3\">2.39千克→千克+克\u003c/button>\n\u003c/div>\n\u003cdiv class=\"canvas-wrap\">\n  \u003ccanvas id=\"cv\" width=\"560\" height=\"180\">\u003c/canvas>\n\u003c/div>\n\u003cdiv class=\"result\">\n  \u003cdiv class=\"question\" id=\"question\">3.5 千克 = （  ）克\u003c/div>\n  \u003cdiv class=\"answer\" id=\"answer\">3500 克\u003c/div>\n  \u003cdiv class=\"explain\" id=\"explain\">高级→低级：× 1000，小数点右移三位\u003cbr>3.5 → 3500.\u003c/div>\n\u003c/div>\n\u003cinput type=\"hidden\" id=\"itv-field-lab-unit-convert\" data-itv-field=\"lab-unit-convert\" value=\"\">\n\u003cscript>\nconst cv=document.getElementById('cv');\nconst ctx=cv.getContext('2d');\nconst W=cv.width,H=cv.height;\n\nconst problems=[\n  {q:'3.5 千克 = （  ）克',from:'3.5',unit1:'千克',unit2:'克',to:'3500',rate:1000,dir:'right',digits:3,\n   explain:'高级→低级：× 1000，小数点右移三位\\n3.5 → 3500.'},\n  {q:'300 克 = （  ）千克',from:'300',unit1:'克',unit2:'千克',to:'0.3',rate:1000,dir:'left',digits:3,\n   explain:'低级→高级：÷ 1000，小数点左移三位\\n300. → .300 = 0.3'},\n  {q:'1.36 平方米 = （  ）平方分米',from:'1.36',unit1:'m²',unit2:'dm²',to:'136',rate:100,dir:'right',digits:2,\n   explain:'高级→低级：× 100，小数点右移两位\\n1.36 → 136.'},\n  {q:'2.39 千克 = （  ）千克（  ）克',from:'2.39',unit1:'千克',unit2:'千克+克',to:'2千克390克',rate:1000,dir:'split',digits:3,\n   explain:'整数部分=2千克，0.39×1000=390克\\n小数部分右移三位'}\n];\n\nlet curIdx=0;\nlet animProgress=0;\nlet animDir='right';\nlet animDigits=3;\n\nfunction draw(){\n  ctx.clearRect(0,0,W,H);\n  const p=problems[curIdx];\n\n  // From number\n  ctx.font='bold 40px system-ui';\n  ctx.fillStyle='#e94560';\n  ctx.textBaseline='middle';\n  ctx.textAlign='center';\n  ctx.fillText(p.from,120,H/2-10);\n\n  // Unit label\n  ctx.font='18px system-ui';\n  ctx.fillStyle='#888';\n  ctx.fillText(p.unit1,120,H/2+30);\n\n  // Arrow with animation\n  const arrowY=H/2-10;\n  const arrowStart=200,arrowEnd=p.dir==='split'?335:380;\n  ctx.strokeStyle=p.dir==='right'?'#f5a623':'#a855f7';\n  ctx.lineWidth=3;\n  ctx.beginPath();\n  ctx.moveTo(arrowStart,arrowY);\n  ctx.lineTo(arrowEnd,arrowY);\n  ctx.stroke();\n\n  // Arrow head\n  if(p.dir==='right'||p.dir==='split'){\n    ctx.fillStyle='#f5a623';\n    ctx.beginPath();\n    ctx.moveTo(arrowEnd,arrowY-8);\n    ctx.lineTo(arrowEnd+12,arrowY);\n    ctx.lineTo(arrowEnd,arrowY+8);\n    ctx.fill();\n  } else {\n    ctx.fillStyle='#a855f7';\n    ctx.beginPath();\n    ctx.moveTo(arrowStart,arrowY-8);\n    ctx.lineTo(arrowStart-12,arrowY);\n    ctx.lineTo(arrowStart,arrowY+8);\n    ctx.fill();\n  }\n\n  // Rate label\n  ctx.font='16px system-ui';\n  ctx.fillStyle=p.dir==='right'?'#f5a623':'#a855f7';\n  const rateLabel=p.dir==='right'?`×${p.rate}`:p.dir==='left'?`÷${p.rate}`:'拆分';\n  ctx.fillText(rateLabel,(arrowStart+arrowEnd)/2,arrowY-20);\n\n  // Decimal point movement indicator\n  ctx.font='14px system-ui';\n  ctx.fillStyle='#e94560';\n  const dotLabel=p.dir==='split'?'小数部分×1000，右移三位':`小数点${p.dir==='right'?'右':'左'}移${p.digits}位`;\n  ctx.fillText(dotLabel,(arrowStart+arrowEnd)/2,arrowY+25);\n\n  // Animated decimal point\n  const dotProgress=Math.min(1,animProgress);\n  if(p.dir==='right'){\n    const dotX=arrowStart+dotProgress*(arrowEnd-arrowStart);\n    ctx.beginPath();\n    ctx.arc(dotX,arrowY+50,6,0,Math.PI*2);\n    ctx.fillStyle='#e94560';\n    ctx.fill();\n    ctx.shadowColor='#e94560';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;\n  } else if(p.dir==='left'){\n    const dotX=arrowEnd-dotProgress*(arrowEnd-arrowStart);\n    ctx.beginPath();\n    ctx.arc(dotX,arrowY+50,6,0,Math.PI*2);\n    ctx.fillStyle='#e94560';\n    ctx.fill();\n    ctx.shadowColor='#e94560';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;\n  }\n\n  // To number\n  ctx.font='bold 40px system-ui';\n  ctx.fillStyle='#6bcb77';\n  ctx.textAlign='center';\n  const toText=p.dir==='split'?'2 千克 390 克':p.to;\n  if(p.dir==='split')ctx.font='bold 28px sans-serif';ctx.fillText(toText,450,H/2-10);\n\n  ctx.font='18px system-ui';\n  ctx.fillStyle='#888';\n  ctx.fillText(p.unit2,460,H/2+30);\n}\n\nfunction animate(){\n  animProgress+=0.03;\n  if(animProgress>1.3)animProgress=0;\n  draw();\n  requestAnimationFrame(animate);\n}\n\nfunction selectProblem(idx){\n  curIdx=idx;\n  animProgress=0;\n  const p=problems[idx];\n  document.getElementById('question').textContent=p.q;\n  document.getElementById('answer').textContent=p.to+(p.dir==='split'?'':' '+(p.unit2));\n  document.getElementById('explain').innerHTML=p.explain.replace('\\n','\u003cbr>');\n  document.querySelectorAll('.prob-btn').forEach((b,i)=>{\n    b.classList.toggle('active',i===idx);\n  });\n\n\n}\n\ndocument.querySelectorAll('.prob-btn').forEach(btn=>{\n  btn.addEventListener('click',()=>selectProblem(parseInt(btn.dataset.idx)));\n});\n\nconst rec=document.createElement('button');rec.textContent='写下我的发现';rec.className='btn-reset';rec.onclick=()=>window.parent.postMessage({type:'lab-focus',id:'lab-unit-convert'},'*');document.querySelector('.result').append(rec);\nselectProblem(0);\nanimate();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "instruction": "动手实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S05", "title": "小结：单位换算的方法", "start": 92.416, "end
