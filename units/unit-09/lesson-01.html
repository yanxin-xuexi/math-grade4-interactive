<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-average-v2-storybook-v1", "title": "平均数的意义和计算", "scenes": [{"id": "S01", "title": "情境引入：投篮比赛", "start": 0, "end": 19.333333, "fields": [{"id": "F00", "type": "choice", "prompt": "一队5人共投进60个，二队4人共投进52个。直接比较总进球数公平吗？", "options": [{"id": "a", "label": "公平，总进球数多的队水平更高"}, {"id": "b", "label": "不公平，两队人数不同"}], "answer": "b"}, {"id": "F01", "type": "observe", "prompt": "一队5人进球：13、11、12、14、10；二队4人进球：11、15、14、12。哪个队投篮水平更高？", "answer": "需要比较两队的平均进球数"}], "narration": "两队进行原地投篮比赛，每人投20个。一队有5名队员，分别投进了13个、11个、12个、14个和10个。二队有4名队员，分别投进了11个、15个、14个和12个。哪个队的投篮水平更高呢？"}, {"id": "S02", "title": "怎样比较才公平", "start": 19.333333, "end": 44.917333, "fields": [{"id": "F02", "type": "choice", "prompt": "两队人数不同，哪种比较方法最公平？", "options": [{"id": "a", "label": "比较总进球数"}, {"id": "b", "label": "比较进球最多的球员"}, {"id": "c", "label": "比较每队平均进球数"}], "answer": "c"}], "narration": "直接比较两队的总进球数公平吗？一队5人共投进60个，二队4人共投进52个。一队总数多，但人数也多。只看进球最多的球员呢？一队最多14个，二队最多15个。但这样也不能反映整体水平。因为两队人数不同，用每队平均进球的个数来比较才合理。"}, {"id": "S03", "title": "计算平均数", "start": 44.917333, "end": 67.957333, "fields": [{"id": "F03", "type": "fill", "prompt": "一队总进球数是多少个？", "answers": ["60"]}, {"id": "F03-average", "type": "fill", "prompt": "一队平均每人进球多少个？", "answers": ["12"]}, {"id": "F04", "type": "fill", "prompt": "二队总进球数是多少个？", "answers": ["52"]}, {"id": "F04-average", "type": "fill", "prompt": "二队平均每人进球多少个？", "answers": ["13"]}], "narration": "一队平均进球个数：13加11加12加14加10等于60，60除以5等于12个。二队平均进球个数：11加15加14加12等于52，52除以4等于13个。二队平均每人投进13个，高于一队的12个，所以二队投篮水平更高。"}, {"id": "S04", "title": "移多补少理解平均数", "start": 67.957333, "end": 96.037333, "fields": [{"id": "F05", "type": "observe", "prompt": "点击较高和较低的直条，每次移1个。移多补少时，什么变了，什么没有变？", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>移多补少实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#1a1a2e;font-family:'PingFang SC',sans-serif;overflow:auto;touch-action:none}\ncanvas{display:block;width:100%;height:auto;aspect-ratio:16/9}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cscript>\nconst C=document.getElementById('c');\nconst ctx=C.getContext('2d');\nconst W=1280,H=720;\nC.width=W;C.height=H;\n\nconst COL={bg:'#1a1a2e',grid:'#2a2a4e',bar:'#0f969c',move:'#f5a623',\n  avg:'#e94560',gold:'#f5a623',white:'#eee',green:'#6bcb77',card:'#16213e',\n  purple:'#a855f7',teal:'#0f969c'};\n\nconst TEAM1=[13,11,12,14,10];\nconst TEAM2=[11,15,14,12];\nconst NAMES1=['1号','2号','3号','4号','5号'];\nconst NAMES2=['1号','2号','3号','4号'];\n\nlet currentTeam=1;\nlet bars=[];\nlet avgLine=0;\nlet dragging=null;\nlet dragFrom=-1;\nlet dragTo=-1;\nlet dragVal=0;\nlet completed=[false,false];\nlet showResult=false;\n\nfunction initBars(team){\n  const data=team===1?TEAM1:TEAM2;\n  bars=data.map((v,i)=>({val:v,orig:v}));\n  avgLine=data.reduce((a,b)=>a+b,0)/data.length;\n  dragging=null;dragFrom=-1;dragTo=-1;dragVal=0;\n  showResult=false;completed[team-1]=false;\n}\n\ninitBars(1);\n\nfunction getBarLayout(){\n  const n=bars.length;\n  const areaW=700,areaH=400;\n  const startX=(W-areaW)/2,startY=100;\n  const gap=areaW/(n+1);\n  const barW=gap*0.6;\n  const maxVal=20;\n  const scale=areaH/maxVal;\n  return bars.map((b,i)=>{\n    const cx=startX+gap*(i+1);\n    const bh=b.val*scale;\n    return {x:cx-barW/2,y:startY+areaH-bh,w:barW,h:bh,cx,fullY:startY+areaH-bh,maxH:areaH,scale};\n  });\n}\n\nfunction drawTitle(){\n  ctx.fillStyle=COL.white;ctx.font='bold 24px PingFang SC';ctx.textAlign='center';\n  ctx.fillText('移多补少实验台：理解平均数',W/2,40);\n}\n\nfunction drawTeamSwitch(){\n  const y=65;\n  [1,2].forEach(t=>{\n    const x=t===1?W/2-80:W/2+80;\n    const active=currentTeam===t;\n    ctx.fillStyle=active?COL.teal:COL.card;\n    ctx.beginPath();ctx.roundRect(x-50,y-15,100,30,8);ctx.fill();\n    ctx.strokeStyle=COL.teal;ctx.lineWidth=1;ctx.stroke();\n    ctx.fillStyle=active?COL.whit root.addEventListener('keydown',e=>{e.stopPropagation();if(e.target.matches('input,textarea,select'))return;if(e.key===' '&&e.target===v){e.preventDefault();play.click();}});v.addEventListener('click',()=>play.click());Object.entries(state.answers).forEach(([id,value])=>sync(id,value));update();
})();
</script></body></html>
