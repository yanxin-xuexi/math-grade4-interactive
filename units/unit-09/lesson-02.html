<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-segment-stats-v1-storybook-v1", "title": "分段整理与比较两组数据", "scenes": [{"id": "S01", "title": "情境引入：仰卧起坐成绩", "start": 0, "end": 49.325, "fields": [{"id": "F01", "type": "observe", "prompt": "第1小队和第2小队各20人仰卧起坐成绩已列出，怎样比较哪个小队成绩更好？", "answer": "按体质检测标准分段整理数据"}], "narration": "第1小队和第2小队分别进行了1分钟仰卧起坐测试，每个小队各有20名同学。第1小队的成绩如下：44、20、37、45、38、21、43、39、32、46、38、35、45、37、43、45、39、36、43、12。第2小队的成绩如下：49、37、42、36、35、15、48、35、41、34、47、34、40、14、43、35、15、45、15、36。哪个小队的成绩更好呢？"}, {"id": "S02", "title": "分段整理数据", "start": 49.325, "end": 71.069, "fields": [{"id": "F02", "type": "choice", "prompt": "分段整理数据时要注意什么？", "options": [{"id": "a", "label": "可以重复计数"}, {"id": "b", "label": "不重复、不遗漏"}, {"id": "c", "label": "只分两段就行"}], "answer": "b"}], "narration": "数据比较多，直接看很难比较。我们可以根据体质检测标准，把成绩分段整理。分段标准是：优秀，43个及以上；良好，37到42个；及格，17到36个；不及格，16个及以下。分段时要注意不重复、不遗漏。"}, {"id": "S03", "title": "第1小队统计表", "start": 71.069, "end": 91.157, "fields": [{"id": "F03", "type": "fill", "prompt": "第1小队：优秀有多少人？", "answers": ["8"]}, {"id": "F03-1", "type": "fill", "prompt": "第1小队：良好有多少人？", "answers": ["6"]}, {"id": "F03-2", "type": "fill", "prompt": "第1小队：及格有多少人？", "answers": ["5"]}, {"id": "F03-3", "type": "fill", "prompt": "第1小队：不及格有多少人？", "answers": ["1"]}], "narration": "先整理第1小队的成绩。优秀的有8人，良好的有6人，及格的有5人，不及格的有1人，合计20人。第1小队成绩在优秀的人数最多，在不及格的人数最少。将数据分段整理后，能更清楚地看出成绩的大体情况。"}, {"id": "S04", "title": "合并统计表比较", "start": 91.157, "end": 114.197, "fields": [{"id": "F04", "type": "observe", "prompt": "动手操作：将20个数据按优秀、良好、及格、不及格分类，完成统计表", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>分段统计实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#1a1a2e;font-family:'PingFang SC',sans-serif;overflow:auto;touch-action:none}\ncanvas{display:block;margin:0 auto;width:100%;height:auto}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003ccanvas id=\"c\">\u003c/canvas>\n\u003cscript>\nconst C=document.getElementById('c');\nconst ctx=C.getContext('2d');\nconst W=1280,H=720;\nC.width=W;C.height=H;\n\nconst COL={bg:'#1a1a2e',card:'#16213e',white:'#eee',gold:'#f5a623',\n  teal:'#0f969c',red:'#e94560',green:'#6bcb77',purple:'#a855f7',\n  excellent:'#e94560',good:'#0f969c',pass:'#6bcb77',fail:'#f5a623'};\n\nconst TEAM1=[44,20,37,45,38,21,43,39,32,46,38,35,45,37,43,45,39,36,43,12];\nconst TEAM2=[49,37,42,36,35,15,48,35,41,34,47,34,40,14,43,35,15,45,15,36];\n\nconst SEGMENTS=[\n  {name:'优秀',min:43,max:999,color:COL.excellent},\n  {name:'良好',min:37,max:42,color:COL.teal},\n  {name:'及格',min:17,max:36,color:COL.green},\n  {name:'不及格',min:0,max:16,color:COL.gold},\n];\n\nlet currentTeam=1;\nlet data=[];\nlet counts=[0,0,0,0];\nlet sorted=[[],[],[],[]];\nlet selectedData=-1;\nlet completed=false;\nlet showAnswer=false;let mistake=\"\";\n\nfunction initData(){\n  data=currentTeam===1?[...TEAM1]:[...TEAM2];\n  counts=[0,0,0,0];\n  sorted=[[],[],[],[]];\n  selectedData=-1;\n  completed=false;\n  showAnswer=false;mistake=\"\";\n}\ninitData();\n\nfunction getSegment(val){\n  for(let i=0;i\u003cSEGMENTS.length;i++){\n    if(val>=SEGMENTS[i].min&&val\u003c=SEGMENTS[i].max)return i;\n  }\n  return -1;\n}\n\nfunction drawTitle(){\n  ctx.fillStyle=COL.white;ctx.font='bold 24px PingFang SC';ctx.textAlign='center';\n  ctx.fillText('分段统计实验台：整理仰卧起坐成绩',W/2,35);\n}\n\nfunction drawTeamSwitch(){\n  [1,2].forEach(t=>{\n    const x=t===1?W/2-80:W/2+80;\n    const active=currentTeam===t;\n    ctx.fillStyle=active?COL.teal:COL.card;\n    ctx.beginPath();ctx.roundRect(x-50,50,100,30,8);ctx.fill();\n    ctx.strokeStyle=COL.teal;ctx.lineWidth=1;ctx.stroke();\n    ctx.fillStyle=active?COL.white:'#888';ctx.font=(active?'bold ':'')+' 15px PingFang SC';\n    ctx.textAlign='center';\n    ctx.fillText('第'+t+'小队',x,70);\n  });\n}\n\nfunction drawDataGrid(){\n  const startX=40,startY=100;\n  const cellW=60,cellH=40;\n  const cols=10;\n\n  ctx.fillStyle='#aaa';ctx.font='13px PingFang SC';ctx.textAlign='left';\n  ctx.fillText('点击数据，再点击对应等级分类：',startX,startY-8);\n\n  data.forEach((v,i)=>{\n    const col=i%cols,row=Math.floor(i/cols);\n    const x=startX+col*cellW,y=startY+row*cellH;\n    const seg=getSegment(v);\n    const isSelected=selectedData===i;\n    const isSorted=sorted.some(s=>s.includes(i));\n\n    if(isSorted){\n      ctx.fillStyle=SEGMENTS[seg].color+'33';\n    }else if(isSelected){\n      ctx.fillStyle=COL.gold+'44';\n    }else{\n      ctx.fillStyle=COL.card;\n    }\n    ctx.fillRect(x+2,y+2,cellW-4,cellH-4);\n    ctx.strokeStyle=isSelected?COL.gold:isSorted?SEGMENTS[getSegment(v)].color:'#444';\n    ctx.lineWidth=isSelected?2:1;\n    ctx.strokeRect(x+2,y+2,cellW-4,cellH-4);\n\n    ctx.fillStyle=isSorted?SEGMENTS[getSegment(v)].color:COL.white;\n    ctx.font='bold 15px PingFang SC';ctx.textAlign='center';\n    ctx.fillText(v,x+cellW/2,y+cellH/2+5);\n  });\n}\n\nfunction drawSegmentBins(){\n  const binX=665,binY=100,binW=130,binH=200,gap=15;\n\n  SEGMENTS.forEach((seg,i)=>{\n    const x=binX+i*(binW+gap);\n    const y=binY;\n\n    ctx.fillStyle=seg.color+'22';\n    ctx.fillRect(x,y,binW,binH);\n    ctx.strokeStyle=seg.color;ctx.lineWidth=2;\n    ctx.strokeRect(x,y,binW,binH);\n\n    ctx.fillStyle=seg.color;ctx.font='bold 14px PingFang SC';ctx.textAlign='center';\n    ctx.fillText(seg.name,x+binW/2,y-8);\n    ctx.font='12px PingFang SC';ctx.fillStyle='#aaa';\n    const rangeText=seg.max===999?seg.min+'及以上':seg.max===0?seg.min+'及以下':seg.min+'～'+seg.max;\n    ctx.fillText(rangeText,x+binW/2,y+binH+18);\n\n    ctx.fillStyle=seg.color;ctx.font='bold 28px PingFang SC';\n    ctx.fillText(counts[i],x+binW/2,y+binH/2+10);\n    ctx.font='13px PingFang SC';ctx.fillStyle='#888';\n    ctx.fillText('人',x+binW/2,y+binH/2+32);\n  });\n}\n\nfunction drawTable(){\n  const tx=650,ty=340;\n  const colW=116,rowH=35;\n\n  ctx.fillStyle=COL.card;ctx.fillRect(tx,ty,colW*5,rowH*3);\n  ctx.strokeStyle='#555';ctx.lineWidth=1;\n\n  for(let r=0;r\u003c3;r++){\n    ctx.beginPath();ctx.moveTo(tx,ty+r*rowH);ctx.lineTo(tx+colW*5,ty+r*rowH);ctx.stroke();\n  }\n  for(let c=0;c\u003c=5;c++){\n    ctx.beginPath();ctx.moveTo(tx+c*colW,ty);ctx.lineTo(tx+c*colW,ty+rowH*3);ctx.stroke();\n  }\n\n  ctx.fillStyle=COL.white;ctx.font='bold 13px PingFang SC';ctx.textAlign='center';\n  const headers=['成绩/个','优秀','良好','及格','不及格'];\n  headers.forEach((h,i)=>ctx.fillText(h,tx+i*colW+colW/2,ty+22));\n\n  ctx.fillText('第'+currentTeam+'小队',tx+colW/2,ty+rowH+22);\n\n  if(showAnswer||completed){\n    const ans=currentTeam===1?[8,6,5,1]:[5,4,7,4];\n    ans.forEach((v,i)=>{\n      ctx.fillStyle=COL.gold;ctx.font='bold 15px PingFang SC';\n      ctx.fillText(v,tx+(i+1)*colW+colW/2,ty+rowH+22);\n    });\n    ctx.fillStyle='#aaa';ctx.font='13px PingFang SC';\n    ctx.fillText('合计: 20',tx+colW*4.5,ty+rowH*2+22);\n  }else{\n    counts.forEach((v,i)=>{\n      ctx.fillStyle=SEGMENTS[i].color;ctx.font='bold 15px PingFang SC';\n      ctx.fillText(v,tx+(i+1)*colW+colW/2,ty+rowH+22);\n    });\n    const total=counts.reduce((a,b)=>a+b,0);\n    ctx.fillStyle='#aaa';ctx.font='13px PingFang SC';\n    ctx.fillText('合计: '+total+'/20',tx+colW*4.5,ty+rowH*2+22);\n  }\n}\n\nfunction drawInfo(){\n  ctx.fillStyle=COL.card;ctx.fillRect(0,H-100,W,100);\n  ctx.strokeStyle=COL.gold;ctx.lineWidth=2;ctx.strokeRect(0,H-100,W,100);\n\n  ctx.fillStyle=COL.gold;ctx.font='bold 18px PingFang SC';ctx.textAlign='center';\n\n  if(completed||showAnswer){\n    ctx.fillText((showAnswer?'参考答案 · ':'自己分类完成 · ')+'第'+currentTeam+'小队',W/2,H-70);\n    ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n    const ans=currentTeam===1?[8,6,5,1]:[5,4,7,4];\n    ctx.fillText('优秀'+ans[0]+'人  良好'+ans[1]+'人  及格'+ans[2]+'人  不及格'+ans[3]+'人  合计20人',W/2,H-42);\n    ctx.fillStyle=COL.green;ctx.font='14px PingFang SC';\n    ctx.fillText(currentTeam===1?'第1小队成绩在优秀的人数最多，不及格的人数最少':'第2小队成绩分布较均匀，及格和不及格人数较多',W/2,H-18);\n  }else{\n    ctx.fillText(mistake||'点击一个数据，再点击对应的等级分类框',W/2,H-70);\n    ctx.fillStyle=COL.white;ctx.font='16px PingFang SC';\n    const done=counts.reduce((a,b)=>a+b,0);\n    ctx.fillText('已分类：'+done+'/20  |  优秀≥43  良好37~42  及格17~36  不及格≤16',W/2,H-42);\n    ctx.fillStyle='#aaa';ctx.font='14px PingFang SC';\n    ctx.fillText('分段时注意不重复、不遗漏',W/2,H-18);\n  }\n}\n\nlet btnList=[];\n\nfunction drawButtons(){\n  btnList=[];\n  const btns=[\n    {x:20,y:H-90,w:80,h:32,text:'第1队',action:()=>{currentTeam=1;initData()}},\n    {x:20,y:H-50,w:80,h:32,text:'第2队',action:()=>{currentTeam=2;initData()}},\n    {x:110,y:H-90,w:80,h:32,text:'答案',action:()=>{showAnswer=true}},\n    {x:110,y:H-50,w:80,h:32,text:'重置',action:()=>initData()},\n  ];\n  btns.forEach(b=>{\n    ctx.fillStyle=COL.teal;\n    ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,8);ctx.fill();\n    ctx.fillStyle=COL.white;ctx.font='bold 14px PingFang SC';ctx.textAlign='center';\n    ctx.fillText(b.text,b.x+b.w/2,b.y+b.h/2+5);\n    b._action=b.action;\n    btnList.push(b);\n  });\n}\n\nfunction render(){\n  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);\n  drawTitle();\n  drawTeamSwitch();\n  drawDataGrid();\n  drawSegmentBins();\n  drawTable();\n  drawInfo();\n  drawButtons();\n}\n\nC.addEventListener('pointerdown',e=>{\n  const rect=C.getBoundingClientRect();\n  const scaleX=W/rect.width,scaleY=H/rect.height;\n  const mx=(e.clientX-rect.left)*scaleX;\n  const my=(e.clientY-rect.top)*scaleY;\n\n  for(const b of btnList){\n    if(mx>=b.x&&mx\u003c=b.x+b.w&&my>=b.y&&my\u003c=b.y+b.h){\n      b._action();render();return;\n    }\n  }\n\n  if(completed)return;\n\n  const startX=40,startY=100,cellW=60,cellH=40,cols=10;\n  for(let i=0;i\u003cdata.length;i++){\n    const col=i%cols,row=Math.floor(i/cols);\n    const x=startX+col*cellW+2,y=startY+row*cellH+2;\n    if(mx>=x&&mx\u003c=x+cellW-4&&my>=y&&my\u003c=y+cellH-4){\n      if(sorted.some(s=>s.includes(i)))return;\n      selectedData=i;\n      render();\n      return;\n    }\n  }\n\n  if(selectedData>=0){\n    const binX=665,binY=100,binW=130,binH=200 root.addEventListener('keydown',e=>{e.stopPropagation();if(e.target.matches('input,textarea,select'))return;if(e.key===' '&&e.target===v){e.preventDefault();play.click();}});v.addEventListener('click',()=>play.click());Object.entries(state.answers).forEach(([id,value])=>sync(id,value));update();
})();
</script></body></html>
