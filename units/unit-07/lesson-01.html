<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-decimal-add-sub-v1-storybook-v3", "title": "小数加减法的算理与笔算", "scenes": [{"id": "S01", "title": "情境：跳远成绩", "start": 0, "end": 20.744, "narration": "体育节上，小林和小禾帮忙记录跳远成绩。赵军1.72米，王超1.73米，张华1.8米。把成绩表放到观察板上。已知李强比赵军多跳了0.3米。根据这些信息，你能提出什么数学问题？", "fields": [{"id": "s01-observe", "type": "observe", "prompt": "观察：从跳远成绩表中，你能提出哪些数学问题？"}]}, {"id": "S02", "title": "小数加法：1.72+0.3", "start": 20.744, "end": 50.936, "narration": "先来看第一个问题：李强跳了多少米？列式：1.72加0.3。小数加法与整数加法一样，计数单位相同才能相加。把小数点对齐，也就是把相同数位对齐。0.3的十分位是3，写在1.72的十分位下面，百分位补0。7个0.1加3个0.1是10个0.1，向个位进1。所以1.72加0.3等于2.02米。", "fields": [{"id": "lab-decimal-add-sub", "type": "observe", "prompt": "实验台：输入两个小数，选择加法或减法，看竖式计算过程。", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>小数加减法实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#0f0f23;color:#eee;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif;overflow:auto}\n#wrap{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}\nh2{font-size:22px;color:#f5a623;margin-bottom:8px}\n.row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap;justify-content:center}\nlabel{font-size:16px;color:#aaa}\ninput[type=number]{width:100px;padding:6px 8px;font-size:18px;border:2px solid #0f969c;border-radius:8px;background:#16213e;color:#eee;text-align:center}\ninput[type=number]:focus{outline:none;border-color:#f5a623}\n.btn{padding:8px 16px;font-size:16px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}\n.btn-teal{background:#0f969c;color:#fff}\n.btn-gold{background:#f5a623;color:#1a1a2e}\n.btn-accent{background:#e94560;color:#fff}\n.btn:hover{opacity:.85}\nselect{padding:6px 10px;font-size:16px;border:2px solid #0f969c;border-radius:8px;background:#16213e;color:#eee}\n#canvas{border:2px solid #333;border-radius:12px;margin-top:8px;background:#16213e}\n#result{margin-top:6px;font-size:20px;min-height:28px;text-align:center}\n#hint{font-size:14px;color:#888;margin-top:4px}\n\u003c/style>\n\u003cstyle>canvas{max-width:100%;height:auto}#result,#hint{max-width:800px;line-height:1.6}button:disabled{opacity:.5}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv id=\"wrap\">\n\u003ch2>小数加减法实验台\u003c/h2>\n\u003cdiv class=\"row\">\n  \u003clabel>被加/减数：\u003c/label>\n  \u003cinput type=\"number\" id=\"num1\" value=\"1.72\" step=\"any\" min=\"0\" max=\"9999.999\">\n  \u003cselect id=\"op\">\n    \u003coption value=\"+\" selected>+\u003c/option>\n    \u003coption value=\"-\">−\u003c/option>\n  \u003c/select>\n  \u003clabel>加/减数：\u003c/label>\n  \u003cinput type=\"number\" id=\"num2\" value=\"0.30\" step=\"any\" min=\"0\" max=\"9999.999\">\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003cbutton class=\"btn btn-teal\" id=\"goBtn\">计算\u003c/button>\n  \u003cbutton class=\"btn btn-gold\" id=\"stepBtn\">逐步演示\u003c/button>\n  \u003cbutton class=\"btn btn-accent\" id=\"resetBtn\">重置\u003c/button>\n\u003c/div>\n\u003ccanvas id=\"canvas\" width=\"800\" height=\"380\">\u003c/canvas>\n\u003cdiv id=\"result\">\u003c/div>\n\u003cbutton class=\"btn btn-gold\" id=\"recordBtn\">写下我的发现\u003c/button>\u003cdiv id=\"hint\" role=\"status\">输入两个小数，选择加法或减法，点击\"计算\"看竖式。\u003c/div>\n\u003c/div>\n\u003cscript>\nconst canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),aI=document.getElementById('num1'),bI=document.getElementById('num2'),opI=document.getElementById('op'),result=document.getElementById('result'),hint=document.getElementById('hint');\nlet state=null;const DOT=400,CELL=48;\nfunction fixed(v,p){let s=v.toString().padStart(p+1,'0');return p?s.slice(0,-p)+'.'+s.slice(-p):s;}\nfunction read(){const a=aI.value.trim(),b=bI.value.trim();if(!/^\\d{1,4}(?:\\.\\d{1,3})?$/.test(a)||!/^\\d{1,4}(?:\\.\\d{1,3})?$/.test(b)){state=null;result.textContent='';ctx.clearRect(0,0,canvas.width,canvas.height);hint.textContent='请输入0至9999.999
