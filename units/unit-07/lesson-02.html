<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-decimal-mixed-calc-v1-storybook-v3", "title": "小数加减混合运算与简便计算", "scenes": [{"id": "S01", "title": "情境：女子100米比赛", "start": 0, "end": 33.412, "narration": "小林和小禾来到百米跑终点，整理比赛用时。小晨15.43秒，小阳比小晨少0.34秒，小玉比小阳少0.07秒。把这些记录放到观察板上。另外，在女子4乘100米接力赛中，四（1）班用时59.56秒，四（2）班用时比四（1）班多1.05秒，四（3）班用时65.44秒。根据这些信息，你能提出什么问题？", "fields": [{"id": "s01-observe", "type": "observe", "prompt": "观察：从比赛成绩中，你能提出哪些数学问题？"}]}, {"id": "S02", "title": "混合运算：小玉用时多少秒", "start": 33.412, "end": 70.132, "narration": "先来看第一个问题：小玉用时多少秒？要求小玉的用时，需要先求出小阳的用时。小阳比小晨少0.34秒，所以小阳用时：15.43减0.34等于15.09秒。小玉比小阳少0.07秒，所以小玉用时：15.09减0.07等于15.02秒。也可以列连减算式：15.43减0.34减0.07等于15.02秒。小数加减混合运算，没有括号时从左往右算，有括号时先算括号里。", "fields": [{"id": "s02-observe", "type": "observe", "prompt": "思考：求小玉的用时，为什么要分两步？每步求的是什么？"}]}, {"id": "S03", "title": "简便算法：连续减去两个数", "start": 70.132, "end": 101.884, "narration": "这道题还有更简便的算法吗？小玉比小晨少的总时间是0.34加0.07的和，也就是0.41秒。所以可以直接用15.43减去0.34与0.07的和：15.43减括号0.34加0.07，等于15.43减0.41，等于15.02秒。一个数连续减去两个数，等于减去这两个数的和。这和整数减法的性质完全一样。", "fields": [{"id": "s03-observe", "type": "observe", "prompt": "两种算法结果一样，哪种更简便？为什么？"}]}, {"id": "S04", "title": "简便计算：凑整巧算", "start": 101.884, "end": 135.964, "narration": "再来看这道题：7.65加3.72加6.35加6.28。如果从左往右依次算，比较麻烦。观察这四个数，7.65和6.35加起来正好等于14，3.72和6.28加起来正好等于10。所以利用加法交换律和结合律，把能凑整的数先结合：括号7.65加6.35，加上括号3.72加6.28，等于14加10，等于24。这样计算又快又准。", "fields": [{"id": "lab-easy-calc", "type": "observe", "prompt": "实验台：输入四个小数，试试能不能凑整巧算。", "lab_srcdoc": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>简便计算实验台\u003c/title>\n\u003cstyle>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#0f0f23;color:#eee;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif;overflow:auto}\n#wrap{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}\nh2{font-size:22px;color:#f5a623;margin-bottom:6px}\n.row{display:flex;gap:8px;align-items:center;margin:5px 0;flex-wrap:wrap;justify-content:center}\nlabel{font-size:15px;color:#aaa}\ninput[type=number]{width:90px;padding:5px 6px;font-size:17px;border:2px solid #0f969c;border-radius:8px;background:#16213e;color:#eee;text-align:center}\ninput[type=number]:focus{outline:none;border-color:#f5a623}\n.btn{padding:7px 14px;font-size:15px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}\n.btn-teal{background:#0f969c;color:#fff}\n.btn-gold{background:#f5a623;color:#1a1a2e}\n.btn-accent{background:#e94560;color:#fff}\n.btn:hover{opacity:.85}\nselect{padding:5px 8px;font-size:15px;border:2px solid #0f969c;border-radius:8px;background:#16213e;color:#eee}\n#canvas{border:2px solid #333;border-radius:12px;margin-top:6px;background:#16213e}\n#result{margin-top:5px;font-size:18px;min-height:26px;text-align:center}\n#hint{font-size:13px;color:#888;margin-top:3px}\n\u003c/style>\n\u003cstyle>canvas{max-width:100%;height:auto}#result,#hint{max-width:800px;line-height:1.6}button:disabled{opacity:.5}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv id=\"wrap\">\n\u003ch2>简便计算实验台\u003c/h2>\n\u003cdiv class=\"row\">\n  \u003cinput type=\"number\" id=\"n1\" value=\"7.65\" step=\"any\" min=\"0\" max=\"9999.999\">\n  \u003cspan style=\"color:#aaa;font-size:18px\">+\u003c/span>\n  \u003cinput type=\"number\" id=\"n2\" value=\"3.72\" step=\"any\" min=\"0\" max=\"9999.999\">\n  \u003cspan style=\"color:#aaa;font-size:18px\">+\u003c/span>\n  \u003cinput type=\"number\" id=\"n3\" value=\"6.35\" step=\"any\" min=\"0\" max=\"9999.999\">\n  \u003cspan style=\"color:#aaa;font-size:18px\">+\u003c/span>\n  \u003cinput type=\"number\" id=\"n4\" value=\"6.28\" step=\"any\" min=\"0\" max=\"9999.999\">\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003cbutton class=\"btn btn-teal\" id=\"calcBtn\">直接算\u003c/button>\n  \u003cbutton class=\"btn btn-gold\" id=\"easyBtn\">凑整巧算\u003c/button>\n  \u003cbutton class=\"btn btn-accent\" id=\"resetBtn\">重置\u003c/button>\n\u003c/div>\n\u003ccanvas id=\"canvas\" width=\"800\" height=\"320\">\u003c/canvas>\n\u003cdiv id=\"result\">\u003c/div>\n\u003cbutton class=\"btn btn-gold\" id=\"recordBtn\">写下我的发现\u003c/button>\u003cdiv id=\"hint\" role=\"status\">输入四个小数，点击\"凑整巧算\"看怎样配对凑整。\u003c/div>\n\u003c/div>\n\u003cscript>\nconst canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),inputs=[1,2,3,4].map(i=>document.getElementById('n'+i)),result=document.getElementById('result'),hint=document.getElementById('hint');let nums=[765n,372n,635n,628n],mode='none',pairs=[];\nfunction fmt(n){let s=n.toString().padStart(3,'0');return s.slice(0,-2)+'.'+s.slice(-2);}\nfunction read(){const raws=inputs.map(x=>x.value.trim());if(raws.some(s=>!/^\\d{1,4}(?:\\.\\d{1,2})?$/.test(s))){result.textContent='';ctx.clearRect(0,0,canvas.width,canvas.height);hint.textContent='请输入0至9999.99之间、最多两位小数的非负数；空白不能计算。';return false;}nums=raws.map(s=>{const[a,b='']=s.split('.');return BigInt(a+b.padEnd(2,'0'));});return true;}\nfunction findPairs(){const edges=[];for(let i=0;i\u003c4;i++)for(let j=i+1;j\u003c4;j++)if((nums[i]+nums[j])%100n===0n)edges.push([i,j]);let best=[];for(let mask=0;mask\u003c(1\u003c\u003cedges.length);mask++){const used=new Set(),set=[];let valid=true;edges.forEach((e,k)=>{if(mask&(1\u003c\u003ck)){if(e.some(i=>used.has(i)))valid=false;else{e.forEach(i=>used.add(i));set.push(e);}}});if(valid&&set.length>best.length)best=set;}return best;}\nfunction put(t,y,col='#eee',size=23){ctx.fillStyle=col;ctx.font=`bold ${size}px monospace`;ctx.textAlign='center';ctx.fillText(t,400,y,755);}\nfunction draw(){ctx.fillStyle='#16213e';ctx.fillRect(0,0,800,320);if(mode==='none'){put(nums.map(fmt).join(' + '),100);put('观察：哪些数可以先结合？',190,'#b6c4d2',18);return;}const total=nums.reduce((a,b)=>a+b,0n);if(mode==='direct'){put('没有括号，按从左往右的顺序计算',38,'#0f969c',20);let acc=nums[0];put(fmt(acc),85);for(let i=1;i\u003c4;i++){const before=acc;acc+=nums[i];put(fmt(before)+' + '+fmt(nums[i])+' = '+fmt(acc),85+i*49,i===3?'#6bcb77':'#f5a623');}return;}put(pairs.length?'每个数只用一次，先把能凑整的数结合':'这组数没有两两凑整的配对',35,'#f5a623',20);const used=new Set(),parts=[];pairs.forEach(([i,j],k)=>{used.add(i);used.add(j);parts.push((nums[i]+nums[j])/100n+'');put(fmt(nums[i])+' + '+fmt(nums[j])+' = '+(nums[i]+nums[j])/100n,90+k*55);});nums.forEach((n,i)=>{if(!used.has(i))parts.push(fmt(n));});if(pairs.length){put('重新组合：'+parts.join(' + '),230,'#b8a4ed',22);}else put('可按从左往右计算，也可继续观察其他组合',150,'#b6c4d2',18);put('= '+fmt(total),285,'#6bcb77',28);}\nfunction act(easy){if(!read())return;mode=easy?'easy':'direct';pairs=easy?findPairs():[];draw();result.textContent=(easy?'找到 '+pairs.length+' 组互不重复的凑整配对；':'直接计算；')+'结果 = '+fmt(nums.reduce((a,b)=>a+b,0n));hint.textContent='观察方法，再用自己的话写下发现。';}\ndocument.getElementById('calcBtn').onclick=()=>act(false);document.getElementById('easyBtn').onclick=()=>act(true);document.getElementById('resetBtn').onclick=()=>{['7.65','3.72','6.35','6.28'].forEach((v,i)=>inputs[i].value=v);read();mode='none';pairs=[];result.textContent='';hint.textContent='输入四个小数，看看能否两两配对凑整。';draw();};document.getElementById('recordBtn').onclick=()=>parent.postMessage({type:'lab-focus',id:'lab-easy-calc'},'*');draw();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "instruction": "动手实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S05", "title": "总结：运算律适用于小数", "start": 135.964, "end": 158.5, "narration": "总结一下：整数加法的交换律和结合律，对小数加法同样适用。小数加减混合运算，没有括号时从左往右算，有括号时先算括号里。如果发现能凑成整数的小数，就可以灵活运用运算律进行简便计算。你学会了吗？", "fields": [{"id": "s05-observe", "type": "observe", "prompt": "总结：整数的运算律对小数适用吗？什么时候可以简便计算？"}]}], "captions": [{"start": 0.44999999999999996, "end": 4.9421053, "text": "小林和小禾来到百米跑终点，整理比赛用时。"}, {"start": 4.9421053, "end": 12.4421053, "text": "小晨15.43秒，小阳比小晨少0.34秒，小玉比小阳少0.07秒。"}, {"start": 12.442105399999999, "end": 15.1263159, "text": "把这些记录放到观察板上。"}, {"start": 16.555, "end": 20.093, "text": "另外，在女子4乘100米接力赛中，"}, {"start": 20.093, "end": 23.006, "text": "四（1）班用时59.56秒，"}, {"start": 23.006, "end": 27.168, "text": "四（2）班用时比四（1）班多1.05秒，"}, {"start": 27.16
