<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-chengfa-jiaohuan-jiehe-v1-storybook-v2", "title": "乘法交换律和结合律", "scenes": [{"id": "S01", "title": "温室里的树苗", "start": 0, "end": 36.766667, "narration": "小林和小禾来到苗木基地，帮忙整理树苗记录。基地有十五个温室，每个温室有八棵树苗。把这些信息记在观察板上。一共育有多少棵树苗？横着看，15 个 8，15 乘 8 等于 120 棵；竖着看，8 个 15，8 乘 15，还是 120 棵。交换因数的位置，积不变！不信吗？一会儿到阵列实验台，亲手转一转。", "fields": [{"id": "lab-array-finding", "type": "observe", "prompt": "阵列实验台：转动阵列，记录你的发现。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>阵列实验台 · 乘法交换律\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n  svg{display:block;width:100%;max-width:1280px;margin:0 auto;user-select:none;touch-action:none}\n  .btn{cursor:pointer}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg id=\"lab\" viewBox=\"0 0 1280 720\" xmlns=\"http://www.w3.org/2000/svg\">\u003c/svg>\n\u003cscript>\n'use strict';\nconst C = { canvas:'#FFFAF0', ink:'#22333C', inkSoft:'#53675E', coral:'#FF6B5A',\n            ochre:'#E8B94A', mint:'#A4D4C5', teal:'#1A3A3A', peach:'#FFC9A3' };\nconst NS = 'http://www.w3.org/2000/svg';\nconst svg = document.getElementById('lab');\nfunction el(name, attrs, parent) {\n  const e = document.createElementNS(NS, name);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  (parent || svg).appendChild(e);\n  return e;\n}\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\nconst defs = el('defs', {});\nconst soft = el('filter', { id:'soft', x:'-30%', y:'-30%', width:'160%', height:'160%' }, defs);\nel('feDropShadow', { dx:0, dy:5, stdDeviation:6, 'flood-color':'#1A3A3A', 'flood-opacity':0.18 }, soft);\nconst radial = el('radialGradient', { id:'glowbg', cx:'50%', cy:'40%', r:'78%' }, defs);\nel('stop', { offset:'0%', 'stop-color':'#FFFDF6' }, radial);\nel('stop', { offset:'100%', 'stop-color':'#FDF3DF' }, radial);\n\nel('rect', { x:0, y:0, width:1280, height:720, fill:'url(#glowbg)' });\nel('rect', { x:60, y:28, width:236, height:30, rx:15, fill:C.teal });\nel('text', { x:178, y:49, 'font-size':16, 'text-anchor':'middle', fill:'#FFF', 'letter-spacing':2 })\n  .textContent = '实验台 · 乘法交换律';\nel('text', { x:60, y:98, 'font-size':32, 'font-weight':'bold', fill:C.ink })\n  .textContent = '阵列实验台：转一转，总数会变吗';\nel('path', { d:'M 62 114 q 42 7 84 0 t 84 0 t 84 0 t 60 0', fill:'none', stroke:C.ochre, 'stroke-width':5, 'stroke-linecap':'round' });\nel('text', { x:60, y:146, 'font-size':17, fill:C.inkSoft })\n  .textContent = '点\"转动 90°\"把阵列转过来，或者换行列数再试。数一数，总数变了吗？';\n\n/* ============ 阵列状态 ============ */\nlet cols = 15, rows = 8, rotCount = 0, animating = false;\nconst AREA = { x:150, y:190, w:760, h:400 };   // 阵列区域\nconst gridG = el('g', {});\nconst dotsLayer = el('g', {}, gridG);\n\nconst eqBig = el('text', { x:1000, y:300, 'font-size':40, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal });\nconst eqAlt = el('text', { x:1000, y:352, 'font-size':30, 'font-weight':'bold', 'text-anchor':'middle', fill:C.inkSoft });\nconst totalBadge = el('g', {});\nel('rect', { x:915, y:390, width:170, height:48, rx:24, fill:C.mint, filter:'url(#soft)' }, totalBadge);\nconst totalText = el('text', { x:1000, y:421, 'font-size':22, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal }, totalBadge);\n\nfunction cell() { return Math.min(AREA.w / cols, AREA.h / rows); }\nfunction gridOrigin() {\n  const cs = cell();\n  return { cs, x0: AREA.x + (AREA.w - cs * cols) / 2, y0: AREA.y + (AREA.h - cs * rows) / 2 };\n}\nfunction drawGrid() {\n  dotsLayer.innerHTML = '';\n  const { cs, x0, y0 } = gridOrigin();\n  const r = Math.min(cs * 0.32, 14);\n  for (let i = 0; i \u003c cols; i++)\n    for (let j = 0; j \u003c rows; j++) {\n      const cx = x0 + (i + 0.5) * cs, cy = y0 + (j + 0.5) * cs;\n      // 小树苗：树冠圆 + 短树干\n      el('line', { x1:cx, y1:cy + r * 0.4, x2:cx, y2:cy + r * 1.15, stroke:'#8A7B63', 'stroke-width':Math.max(2, r*0.18) }, dotsLayer);\n      el('circle', { cx, cy:cy - r * 0.25, r, fill:C.mint, stroke:C.teal, 'stroke-width':1.2 }, dotsLayer);\n    }\n}\nfunction updateEq() {\n  eqBig.textContent = `${cols} × ${rows} = ${cols * rows}`;\n  eqAlt.textContent = `${rows} × ${cols} = ${rows * cols}`;\n  totalText.textContent = `总数 ${cols * rows} 棵`;\n}\ndrawGrid(); updateEq();\n\n/* 旋转：先动画旋转 90°，落地后重建为转置阵列 */\nfunction rotate() {\n  if (animating) return;\n  animating = true;\n  const { cs, x0, y0 } = gridOrigin();\n  const cx = x0 + cs * cols / 2, cy = y0 + cs * rows / 2;\n  gridG.style.transition = 'transform .7s cubic-bezier(.34,1.4,.5,1), opacity .7s';\n  gridG.style.transformOrigin = `${cx}px ${cy}px`;\n  gridG.style.transform = 'rotate(90deg)';\n  gridG.style.opacity = '0.25';\n  setTimeout(() => {\n    [cols, rows] = [rows, cols];\n    gridG.style.transition = 'none';\n    gridG.style.transform = 'rotate(0deg)';\n    drawGrid(); updateEq();\n    gridG.style.opacity = '1';\n    rotCount++;\n    log(`第 ${rotCount} 次转动：${rows} × ${cols} = ${rows * cols}，总数没变`);\n    setTimeout(() => { animating = false; }, 80);\n  }, 720);\n}\nconst rotBtn = el('g', { class:'btn', filter:'url(#soft)' });\nel('rect', { x:915, y:460, width:170, height:52, rx:26, fill:C.coral }, rotBtn);\nel('text', { x:1000, y:493, 'font-size':21, 'font-weight':'bold', 'text-anchor':'middle', fill:'#FFF' }, rotBtn).textContent = '⟳ 转动 90°';\nrotBtn.addEventListener('click', rotate);\n\n/* 行列微调 */\nfunction stepper(label, x, get, set, min, max) {\n  const g = el('g', {});\n  el('text', { x, y:600, 'font-size':17, fill:C.inkSoft, 'text-anchor':'middle' }, g).textContent = label;\n  const val = el('text', { x:x+62, y:644, 'font-size':24, 'font-weight':'bold', fill:C.ink, 'text-anchor':'middle' }, g);\n  const mk = (dx, sym, d) => {\n    const b = el('g', { class:'btn' }, g);\n    el('circle', { cx:x+62+dx, cy:636, r:17, fill:'#FFF', stroke:C.teal, 'stroke-width':2 }, b);\n    el('text', { x:x+62+dx, y:644, 'font-size':20, 'text-anchor':'middle', fill:C.teal }, b).textContent = sym;\n    b.addEventListener('click', () => {\n      const nv = clamp(get() + d, min, max);\n      if (nv !== get() && !animating) { set(nv); drawGrid(); updateEq(); log(`${label}改成 ${nv}：${cols} × ${rows} = ${cols*rows}`); }\n      val.textContent = get();\n    });\n  };\n  mk(-34, '−', -1); mk(34, '＋', 1);\n  val.textContent = get();\n}\nstepper('列数', 350, () => cols, v => cols = v, 2, 20);\nstepper('行数', 530, () => rows, v => rows = v, 2, 15);\n\n/* 记录 */\nconst logG = el('g', {});\nel('rect', { x:60, y:560, width:210, height:140, rx:14, fill:'#FFF', stroke:'#E3D5C0', 'stroke-width':1.5, filter:'url(#soft)' }, logG);\nel('text', { x:76, y:584, 'font-size':15, 'font-weight':'bold', fill:C.inkSoft }, logG).textContent = '实验记录';\nconst logText = el('text', { x:76, y:606, 'font-size':13, fill:C.ink }, logG);\nconst logLines = [];\nfunction log(s) {\n  logLines.push(s); if (logLines.length > 4) logLines.shift();\n  logText.innerHTML = '';\n  logLines.forEach((l, i) => {\n    const parts = l.length > 15 ? [l.slice(0, 15), l.slice(15, 30)] : [l];\n    parts.forEach((p2, j) => { const t = el('tspan', { x:76, dy:(i || j) ? 17 : 0 }, logText); t.textContent = p2; });\n  });\n}\nconst recG = el('g', { class:'btn' });\nel('rect', { x:915, y:530, width:170, height:44, rx:22, fill:C.teal, filter:'url(#soft)' }, recG);\nel('text', { x:1000, y:559, 'font-size':17, 'text-anchor':'middle', fill:'#FFF', 'font-weight':'bold' }, recG).textContent = '写下我的发现';\nrecG.addEventListener('click', () => {if(window.parent !== window)window.parent.postMessage({type:'lab-focus',id:'lab-array-finding'},'*');});\nconst echo = document.createElement('div');\necho.style.cssText = 'max-width:1180px;margin:8px auto;padding:10px 14px;background:#F3EBDD;border-radius:10px;font-size:14px;color:#53675E';\necho.textContent = '字段 lab-array-finding（待记录）';\nif (window.parent === window) document.body.appendChild(echo);\ndocument.addEventListener('lab-field', e => { echo.textContent = e.detail.id + '：' + e.detail.value; });\n\nwindow.check = function () {\n  return { pass: cols * rows === 120 && rows * cols === 120, count: cols * rows, cols, rows };\n};\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "activity_title": "阵列实验台", "instruction": "实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S02", "title": "乘法交换律", "start": 36.766667, "end": 53.166667, "narration": "这就是乘法交换律，用字母表示：a 乘 b 等于 b 乘 a。交换因数再乘一遍，可以帮助检查。如果两次结果不同，就要检查计算过程。", "fields": [{"id": "s02-letter", "type": "fill", "prompt": "乘法交换律用字母表示：a × b = ____", "answers": ["b×a", "b × a", "b*a", "b * a"]}]}, {"id": "S03", "title": "花土与花肥", "start": 53.166667, "end": 95.566667, "narration": "基地还购进花土 20 袋，每袋 25 包，每包 4 千克。总质量怎么算？可以先算每袋多少千克：4 乘 25 等于 100，再乘 20，是 2000 千克；也可以先算一共多少包：25 乘 20 等于 500，再乘 4，还是 2000 千克。花肥也一样：10 袋，每袋 8 包，每包 5 千克，先算 5 乘 8 得 40，再乘 10，是 400 千克；先算 8 乘 10 得 80，再乘 5，也是 400 千克。先乘哪两个数，总数都不变。", "fields": [{"id": "lab-pack-finding", "type": "observe", "prompt": "装箱实验台：拖动改变先算的组合，记录你的发现。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>装箱实验台 · 乘法结合律\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n  svg{display:block;width:100%;max-width:1280px;margin:0 auto;user-select:none;touch-action:none}\n  .card{cursor:grab}.card:active{cursor:grabbing}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg id=\"lab\" viewBox=\"0 0 1280 720\" xmlns=\"http://www.w3.org/2000/svg\">\u003c/svg>\n\u003cscript>\n'use strict';\nconst C = { canvas:'#FFFAF0', ink:'#22333C', inkSoft:'#53675E', coral:'#FF6B5A',\n            ochre:'#E8B94A', mint:'#A4D4C5', teal:'#1A3A3A', peach:'#FFC9A3', lav:'#B8A4ED' };\nconst NS = 'http://www.w3.org/2000/svg';\nconst svg = document.getElementById('lab');\nfunction el(name, attrs, parent) {\n  const e = document.createElementNS(NS, name);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  (parent || svg).appendChild(e);\n  return e;\n}\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\nconst defs = el('defs', {});\nconst soft = el('filter', { id:'soft', x:'-30%', y:'-30%', width:'160%', height:'160%' }, defs);\nel('feDropShadow', { dx:0, dy:5, stdDeviation:6, 'flood-color':'#1A3A3A', 'flood-opacity':0.18 }, soft);\nconst glowF = el('filter', { id:'glow', x:'-60%', y:'-60%', width:'220%', height:'220%' }, defs);\nel('feDropShadow', { dx:0, dy:0, stdDeviation:8, 'flood-color':C.ochre, 'flood-opacity':0.95 }, glowF);\nconst radial = el('radialGradient', { id:'glowbg', cx:'50%', cy:'40%', r:'78%' }, defs);\nel('stop', { offset:'0%', 'stop-color':'#FFFDF6' }, radial);\nel('stop', { offset:'100%', 'stop-color':'#FDF3DF' }, radial);\n\nel('rect', { x:0, y:0, width:1280, height:720, fill:'url(#glowbg)' });\nel('rect', { x:60, y:28, width:236, height:30, rx:15, fill:C.teal });\nel('text', { x:178, y:49, 'font-size':16, 'text-anchor':'middle', fill:'#FFF', 'letter-spacing':2 })\n  .textContent = '实验台 · 乘法结合律';\nel('text', { x:60, y:98, 'font-size':32, 'font-weight':'bold', fill:C.ink })\n  .textContent = '装箱实验台：先装哪一步，总数会变吗';\nel('path', { d:'M 62 114 q 42 7 84 0 t 84 0 t 84 0 t 60 0', fill:'none', stroke:C.ochre, 'stroke-width':5, 'stroke-linecap':'round' });\nel('text', { x:60, y:146, 'font-size':17, fill:C.inkSoft })\n  .textContent = '把数字卡拖进算式，再左右拖动括号框换一个\"先乘\"的组合。凑成整十整百的一对会发光吸住！';\n\n/* ============ 算式区 ============ */\nconst SLOT_Y = 280, SLOT_XS = [430, 640, 850], CARD_W = 104, CARD_H = 60;\nel('text', { x:SLOT_XS[0]+62, y:SLOT_Y+12, 'font-size':40, 'font-weight':'bold', fill:C.inkSoft }).textContent = '×';\nel('text', { x:SLOT_XS[1]+62, y:SLOT_Y+12, 'font-size':40, 'font-weight':'bold', fill:C.inkSoft }).textContent = '×';\nSLOT_XS.forEach(x =>\n  el('rect', { x:x-CARD_W/2, y:SLOT_Y-CARD_H/2, width:CARD_W, height:CARD_H, rx:14,\n    fill:'#FFF', stroke:'#D8CCBA', 'stroke-width':2, 'stroke-dasharray':'7 5' }));\n\n/* 括号框（可左右拖） */\nconst BR = { leftX: SLOT_XS[0]-CARD_W/2-18, rightX: SLOT_XS[1]-CARD_W/2-18,\n             w: CARD_W*2+88, y: SLOT_Y-CARD_H/2-16, h: CARD_H+32 };\nconst bracket = el('g', { class:'card' });\nel('rect', { x:0, y:0, width:BR.w, height:BR.h, rx:20, fill:'#FFFFFF', 'fill-opacity':0.01,\n  stroke:C.ochre, 'stroke-width':4.5 }, bracket);\nel('path', { d:`M ${BR.w/2-16} -2 l 16 -14 l 16 14`, fill:'none', stroke:C.ochre, 'stroke-width':4, 'stroke-linecap':'round','stroke-linejoin':'round' }, bracket);\nconst brLabel = el('text', { x:BR.w/2, y:BR.h+26, 'font-size':17, 'font-weight':'bold', 'text-anchor':'middle', fill:C.ochre }, bracket);\nbrLabel.textContent = '先乘括号里';\nlet bracketPos = 'L';\nfunction bracketTarget() { return bracketPos === 'L' ? BR.leftX : BR.rightX; }\nfunction placeBracket(instant) {\n  bracket.setAttribute('transform', `translate(${bracketTarget()} ${BR.y})`);\n  bracket.style.transition = instant ? 'none' : 'transform .4s cubic-bezier(.34,1.56,.64,1)';\n}\n\n/* 卡片 */\nconst PRESETS = [\n  { nums:[4, 25, 20], names:['每包 4 千克','每袋 25 包','20 袋'] },\n  { nums:[5, 8, 10],  names:['每包 5 千克','每袋 8 包','10 袋'] },\n  { nums:[125, 7, 8], names:['简算挑战','',''] },\n];\nlet presetIdx = 0, regroupCount = 0, magnetSeen = 0;\nconst cards = [];\nconst CARD_COLORS = [C.mint, C.peach, C.lav];\nfunction makeCards(preset) {\n  cards.forEach(c => c.g.remove()); cards.length = 0;\n  preset.nums.forEach((n, i) => {\n    const g = el('g', { class:'card', filter:'url(#soft)' });\n    const r = el('rect', { x:-CARD_W/2, y:-CARD_H/2-(preset.names[i]?10:0), width:CARD_W,\n      height:CARD_H+(preset.names[i]?10:0), rx:14, fill:CARD_COLORS[i], stroke:'#FFF', 'stroke-width':2 }, g);\n    el('text', { y:preset.names[i]?-2:10, 'font-size':28, 'font-weight':'bold', 'text-anchor':'middle', fill:C.ink }, g).textContent = n;\n    if (preset.names[i]) el('text', { y:20, 'font-size':12.5, 'text-anchor':'middle', fill:C.inkSoft }, g).textContent = preset.names[i];\n    const c = { n, i, g, r, slot:'pool'+i, drag:null };\n    cards.push(c); bindDrag(c);\n  });\n  layout(true);\n}\nfunction poolPos(i) { return { x: 400 + i*240, y: 560 }; }\nel('rect', { x:300, y:520, width:680, height:86, rx:16, fill:'#F5EBD7', stroke:'#E3D5C0', 'stroke-width':1.5 });\nel('text', { x:324, y:550, 'font-size':15, fill:C.inkSoft }).textContent = '数字卡（拖进上面算式）';\nfunction slotCenter(slot) {\n  if (slot.startsWith('pool')) return poolPos(Number(slot.slice(4)));\n  return { x: SLOT_XS[Number(slot.slice(1))], y: SLOT_Y };\n}\nfunction exprCards() { return [0,1,2].map(i => cards.find(c => c.slot === 'e'+i) || null); }\n\n/* 计算显示 */\nconst step1 = el('text', { x:640, y:420, 'font-size':26, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal });\nconst step2 = el('text', { x:640, y:462, 'font-size':30, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal });\nconst badge = el('g', {});\nel('rect', { x:530, y:488, width:220, height:40, rx:20, fill:C.mint, filter:'url(#soft)' }, badge);\nconst bText = el('text', { x:640, y:515, 'font-size':19, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal }, badge);\nbadge.setAttribute('opacity', '0');\n\nfunction updateCalc() {\n  const [c0, c1, c2] = exprCards();\n  cards.forEach(c => c.r.setAttribute('filter', 'url(#soft)'));\n  badge.setAttribute('opacity', '0');\n  if (!c0 || !c1 || !c2) { step1.textContent = '把三张数字卡都拖进算式'; step2.textContent = ''; return; }\n  const nums = [c0.n, c1.n, c2.n];\n  const [i, j] = bracketPos === 'L' ? [0, 1] : [1, 2];\n  const pairProd = nums[i] * nums[j];\n  const other = nums[bracketPos === 'L' ? 2 : 0];\n  const total = pairProd * other;\n  const exprTxt = bracketPos === 'L'\n    ? `（${nums[0]} × ${nums[1]}）× ${nums[2]}` : `${nums[0]} ×（${nums[1]} × ${nums[2]}）`;\n  step1.textContent = `${exprTxt}：先算 ${nums[i]} × ${nums[j]} = ${pairProd}`;\n  step2.textContent = `再算 ${bracketPos==='L' ? pairProd + ' × ' + other : other + ' × ' + pairProd} = ${total}`;\n  if (pairProd % 10 === 0) {\n    [c0,c1,c2][i].r.setAttribute('filter', 'url(#glow)');\n    [c0,c1,c2][j].r.setAttribute('filter', 'url(#glow)');\n    badge.setAttribute('opacity', '1');\n    bText.textContent = `凑整啦！${nums[i]} × ${nums[j]} = ${pairProd}`;\n    magnetSeen++;\n  }\n}\n\nfunction layout(instant) {\n  placeBracket(instant);\n  cards.forEach(c => {\n    if (c.drag) return;\n    const p = slotCenter(c.slot);\n    c.g.setAttribute('transform', `translate(${p.x} ${p.y})`);\n    c.g.style.transition = instant ? 'none' : 'transform .4s cubic-bezier(.34,1.56,.64,1)';\n  });\n  updateCalc();\n}\n\nfunction svgPoint(evt) {\n  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction bindDrag(c) {\n  c.g.addEventListener('pointerdown', e => {\n    e.preventDefault();\n    const p = svgPoint(e);\n    const m = /translate\\(([-\\d.]+) ([-\\d.]+)\\)/.exec(c.g.getAttribute('transform') || 'translate(0 0)');\n    c.g.__x = m ? +m[1] : 0; c.g.__y = m ? +m[2] : 0;\n    c.drag = { dx: p.x - c.g.__x, dy: p.y - c.g.__y };\n    c.g.style.transition = 'none';\n    svg.appendChild(c.g);\n    c.g.setPointerCapture(e.pointerId);\n  });\n  c.g.addEventListener('pointermove', e => {\n    if (!c.drag) return;\n    const p = svgPoint(e);\n    c.g.__x = p.x - c.drag.dx; c.g.__y = p.y - c.drag.dy;\n    c.g.setAttribute('transform', `translate(${c.g.__x} ${c.g.__y})`);\n  });\n  c.g.addEventListener('pointerup', () => {\n    if (!c.drag) return;\n    c.drag = null;\n    const cands = [0,1,2].map(i => ({ id:'e'+i, ...slotCenter('e'+i) }))\n      .concat([0,1,2].map(i => ({ id:'pool'+i, ...poolPos(i) })))\n      .filter(s => !cards.some(o => o !== c && o.slot === s.id));\n    let best = null, bd = 1e9;\n    for (const s of cands) {\n      const d = Math.hypot(s.x
