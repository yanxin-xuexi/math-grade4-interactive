const root=film.querySelector('.nv-player'),v=root.querySelector('video'),panel=root.querySelector('.nv-question'),form=panel.querySelector('form'),box=panel.querySelector('.nv-fields'),fb=panel.querySelector('.nv-feedback'),status=film.querySelector('.nv-status'),play=root.querySelector('.nv-play'),seekbar=root.querySelector('.nv-seek');
let state={answers:{},visited:{},position:0},storage=true,active=0,waiting=null,revisit=false,internal=false,lastSave=0,lab=null;
const key='itv:'+cfg.lesson_id,escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').normalize('NFKC').trim().replace(/\s+/g,' '),fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&typeof old.answers==='object'&&typeof old.visited==='object'){state.answers=Object.fromEntries(Object.entries(old.answers).filter(([id])=>byid.has(id)));state.visited=Object.fromEntries(Object.entries(old.visited).filter(([id])=>scenes.some(s=>s.id===id)));state.position=Number.isFinite(old.position)?old.position:0;}}catch(e){storage=false;}
function save(){if(v.readyState)state.position=v.currentTime;try{localStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;}}
function correct(f,value){return f.type==='observe'?null:f.type==='choice'?value===f.answer:f.answers.some(a=>norm(a)===norm(value));}
function update(){status.textContent=(storage?'':'本次作答暂时无法保存。')+'已回顾 '+Object.keys(state.visited).filter(k=>state.visited[k]).length+' / '+scenes.length+' 段，记录 '+all.filter(f=>state.answers[f.id]).length+' / '+all.length+' 项。';film.querySelectorAll('[data-scene]').forEach((b,i)=>{b.classList.toggle('nv-done',!!state.visited[scenes[i].id]);b.setAttribute('aria-current',String(active===i));});}
function sync(id,value){const f=byid.get(id);if(!f)return;value=String(value).slice(0,f.type==='observe'?1000:160);state.answers[id]=value;document.querySelectorAll('[data-itv-field]').forEach(el=>{if(el.dataset.itvField!==id)return;if(el.type==='radio')el.checked=el.value===value;else if(el!==document.activeElement)el.value=value;el.dataset.state=!value?'empty':correct(f,value)===false?'wrong':correct(f,value)===true?'correct':'recorded';});save();update();}
function control(f,value=''){const id=escape(f.id),label=escape(f.prompt);if(f.type==='choice')return '<fieldset class="nv-field"><legend>'+label+'</legend>'+f.options.map(o=>'<label><input type="radio" name="itv-'+id+'" data-itv-field="'+id+'" value="'+escape(o.id)+'" '+(value===o.id?'checked':'')+'>'+escape(o.label)+'</label>').join('')+'</fieldset>';return '<label class="nv-field">'+label+(f.type==='observe'?'<textarea rows="3" maxlength="1000"':'<input maxlength="160"')+' data-itv-field="'+id+'" '+(f.type==='observe'?'>'+escape(value)+'</textarea>':'value="'+escape(value)+'" placeholder="填写关键词">')+'</label>';}
function unmountLab(){if(lab){lab.remove();lab=null;}box.hidden=false;}
function mountLab(i){const f=scenes[i].fields.find(x=>typeof x.lab_srcdoc==='string'&&x.lab_srcdoc.trim());if(!f)return;const frame=document.createElement('iframe');frame.className='nv-lab';frame.title=f.prompt;frame.srcdoc=f.lab_srcdoc;frame.setAttribute('sandbox','allow-scripts');box.hidden=false;box.before(frame);lab=frame;}
function question(i){v.pause();active=i;waiting=i;revisit=false;panel.hidden=false;panel.querySelector('h3').textContent=scenes[i].activity_title||'知识整理';unmountLab();box.innerHTML=scenes[i].fields.map(f=>control(f,state.answers[f.id]||'')).join('');mountLab(i);requestAnimationFrame(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}));fb.textContent=scenes[i].instruction||'根据刚才的讲解，完成记录。';form.querySelector('[type=submit]').hidden=false;panel.querySelector('.nv-continue').hidden=true;panel.querySelector('.nv-skip').textContent='先跳过';update();box.querySelector('input,textarea')?.focus({preventScroll:true});}
function finish(){v.pause();waiting=null;unmountLab();panel.hidden=false;box.innerHTML='';panel.querySelector('h3').textContent='本节学习完成';fb.textContent='检查并完善知识清单。';form.querySelector('[type=submit]').hidden=true;panel.querySelector('.nv-continue').hidden=true;panel.querySelector('.nv-skip').textContent='收起';save();update();}
async function resume(){if(waiting!==null)return;unmountLab();panel.hidden=true;try{await v.play();}catch(e){status.textContent='请点击播放；若无法启动，可使用 Chrome 或 Edge 打开。';}}
function seek(t,guard=true){v.pause();t=Math.max(0,Math.min(t,v.duration||scenes.at(-1).end));if(guard&&t>v.currentTime){const i=scenes.findIndex(s=>!state.visited[s.id]&&s.end>=v.currentTime-.15&&s.end<=t);if(i>=0){internal=true;v.currentTime=Math.min(scenes[i].end,v.duration||scenes[i].end);setTimeout(()=>internal=false,150);question(i);return;}}internal=true;waiting=null;unmountLab();v.currentTime=t;active=scenes.findIndex(s=>t<s.end);if(active<0)active=scenes.length-1;panel.hidden=true;setTimeout(()=>internal=false,150);save();update();}
function next(){if(waiting===null){panel.hidden=true;return;}const i=waiting;state.visited[scenes[i].id]=true;waiting=null;if(i===scenes.length-1){save();update();finish();return;}active=i+1;revisit=false;save();update();resume();}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.itvField&&(el.type!=='radio'||el.checked))sync(el.dataset.itvField,el.value);});
window.addEventListener('message',e=>{const d=e.data;if(!lab||e.source!==lab.contentWindow||!d||!byid.has(d.id))return;if(d.type==='lab-focus'){box.querySelector('textarea')?.focus({preventScroll:false});return;}if(d.type==='lab-field')sync(d.id,d.value??'');});
form.onsubmit=e=>{e.preventDefault();if(waiting===null)return;fb.textContent=scenes[waiting].fields.map(f=>{const value=state.answers[f.id]||'';if(f.type==='observe')return f.prompt+'：'+(value?'已记录。':'尚未记录。');const answer=f.type==='choice'?f.options.find(o=>o.id===f.answer).label:f.answers[0];return f.prompt+'：'+(correct(f,value)?'正确。':'参考：'+answer+'。');}).join(' ');panel.querySelector('.nv-continue').hidden=false;};
panel.querySelector('.nv-continue').onclick=next;panel.querySelector('.nv-skip').onclick=next;panel.querySelector('.nv-replay').onclick=()=>{const i=waiting??active;seek(scenes[i].start,false);revisit=true;resume();};play.onclick=()=>{if(waiting===null)v.paused?resume():v.pause();};
v.addEventListener('play',()=>{if(waiting!==null)v.pause();else play.textContent='暂停';});v.addEventListener('pause',()=>{play.textContent='播放';save();});
v.addEventListener('timeupdate',()=>{root.querySelector('.nv-time').textContent=fmt(v.currentTime)+' / '+fmt(v.duration||0);seekbar.value=v.currentTime;if(!internal&&waiting===null&&!v.paused){const s=scenes[active];if(v.currentTime>=s.end-.1&&(!state.visited[s.id]||revisit))question(active);else{const a=scenes.findIndex(s=>v.currentTime<s.end);if(a>=0)active=a;}}if(Date.now()-lastSave>2500){lastSave=Date.now();save();}});
v.addEventListener('ended',()=>{if(waiting!==null)return;const i=scenes.findIndex(s=>!state.visited[s.id]);i>=0?question(i):finish();});function initMedia(){seekbar.max=v.duration;seek(Math.min(state.position,Math.max(0,v.duration-.2)),false);}v.addEventListener('loadedmetadata',initMedia);if(v.readyState>=1)initMedia();v.addEventListener('error',()=>status.textContent='视频未能加载，请重新打开或使用其他浏览器。');seekbar.onchange=()=>seek(Number(seekbar.value));
root.querySelector('.nv-mute').onclick=e=>{v.muted=!v.muted;e.target.textContent=v.muted?'开启声音':'静音';};root.querySelector('.nv-fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await root.requestFullscreen();}catch(e){status.textContent='当前浏览器无法进入全屏。';}};
let show=true;const captions=cfg.captions||[];function paint(){const cue=captions.find(c=>v.currentTime>=c.start&&v.currentTime<c.end),b=root.querySelector('.nv-caption');b.replaceChildren();if(show&&cue){const span=document.createElement('span');span.textContent=cue.text;b.append(span);}}v.addEventListener('timeupdate',paint);v.addEventListener('seeked',paint);root.querySelector('.nv-subtitles').onclick=e=>{show=!show;e.target.textContent=show?'隐藏字幕':'显示字幕';e.target.setAttribute('aria-pressed',String(show));paint();};
film.querySelector('.nv-chapters').innerHTML=scenes.map((s,i)=>'<button type="button" data-scene="'+i+'">'+escape(s.title)+'</button>').join('');film.querySelector('.nv-chapters').onclick=e=>{const b=e.target.closest('[data-scene]');if(b){seek(scenes[Number(b.dataset.scene)].start,false);revisit=true;resume();}};
film.querySelector('.nv-reset').onclick=()=>{v.pause();state={answers:{},visited:{},position:0};document.querySelectorAll('[data-itv-field]').forEach(el=>{if(el.type==='radio')el.checked=false;else el.value='';delete el.dataset.state;});revisit=false;seek(0,false);save();update();};film.querySelector('.nv-to-list').onclick=()=>{v.pause();film.querySelector('.itv-list').scrollIntoView({behavior:'smooth'});};film.querySelector('.nv-transcript').textContent=scenes.map(s=>s.title+'\n'+(s.narration||'')).join('\n\n');film.querySelector('.itv-list-fields').innerHTML=all.map(f=>control(f,state.answers[f.id]||'')).join('');
root.addEventListener('keydown',e=>{e.stopPropagation();if(e.target.matches('input,textarea,select'))return;if(e.key===' '&&e.target===v){e.preventDefault();play.click();}});v.addEventListener('click',()=>play.click());Object.entries(state.answers).forEach(([id,value])=>sync(id,value));update();
})();
</script></body></html>
