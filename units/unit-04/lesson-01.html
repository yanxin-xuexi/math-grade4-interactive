<!--ITV_MODULE_END--><script id="itv-data" type="application/json">{"lesson_id": "lesson-jiafa-yunsuanlv-intro-v2", "title": "加法交换律和结合律", "scenes": [{"id": "S01", "title": "情境：草坪和花圃", "start": 0, "end": 47.733333, "narration": "光明小学要绿化校园。小林和小禾接到一项任务，帮学校整理绿化信息。先来看看草坪和花圃。草坪总面积八百八十平方米，花圃总面积三百二十平方米。把这两项面积记在统计板上。草坪和花圃的面积，一共有多少平方米？可以算 880 加 320，等于 1200 平方米；也可以算 320 加 880，还是 1200 平方米。咦，交换了位置，结果一样！这里面是不是藏着什么规律？一会儿，到天平实验台亲手试一试。", "fields": [{"id": "lab-swap-finding", "type": "observe", "prompt": "天平实验台：拖动数字卡片做实验，然后记录你的发现。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>天平实验台 · 加法交换律\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n  svg{display:block;width:100%;max-width:1280px;margin:0 auto;user-select:none;touch-action:none}\n  .card{cursor:grab}\n  .card:active{cursor:grabbing}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg id=\"lab\" viewBox=\"0 0 1280 720\" xmlns=\"http://www.w3.org/2000/svg\">\u003c/svg>\n\u003cscript>\n'use strict';\n/* ============ 设计令牌（沿用视频 v2） ============ */\nconst C = { canvas:'#FFFAF0', ink:'#22333C', inkSoft:'#53675E', coral:'#FF6B5A',\n            ochre:'#E8B94A', mint:'#A4D4C5', teal:'#1A3A3A', peach:'#FFC9A3' };\n\nconst NS = 'http://www.w3.org/2000/svg';\nconst svg = document.getElementById('lab');\nfunction el(name, attrs, parent) {\n  const e = document.createElementNS(NS, name);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  (parent || svg).appendChild(e);\n  return e;\n}\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\n/* defs：投影滤镜、底色 */\nconst defs = el('defs', {});\nconst soft = el('filter', { id:'soft', x:'-30%', y:'-30%', width:'160%', height:'160%' }, defs);\nel('feDropShadow', { dx:0, dy:5, stdDeviation:6, 'flood-color':'#1A3A3A', 'flood-opacity':0.18 }, soft);\nco   layout(true);\n}\n\nfunction slotPos(s) {\n  if (s.shelf !== undefined) {\n    return { x: SHELF.x + 90 + s.shelf * 140, y: SHELF.y + SHELF.h / 2, free: true };\n  }\n  const side = s.pan === 'L' ? -1 : 1;\n  const th = currentTheta();\n  const ax = FUL.x + side * ARM * Math.cos(th);\n  const ay = FUL.y + side * ARM * Math.sin(th) * 1;   // 左重左沉：θ>0 左下\n  return { x: ax + s.dx, y: ay + PAN_DROP - 34, free: false };   // 卡片坐在盘面上\n}\nfunction panAnchor(side) {\n  const th = currentTheta();\n  return { x: FUL.x + side * ARM * Math.cos(th), y: FUL.y + side * ARM * Math.sin(th) };\n}\nfunction panSum(side) {\n  return cards.filter(c => { const s = slots.find(x => x.id === c.slot); return s && s.pan === (side \u003c 0 ? 'L' : 'R'); })\n    .reduce((a, c) => a + c.n, 0);\n}\nfunction currentTheta() {\n  const diff = panSum(-1) - panSum(1);\n  return clamp(diff / 600, -1, 1) * 0.16;   // 弧度，约 ±9°\n}\n\n/* ============ 布局与判定 ============ */\nconst eqL = el('text', { x:270, y:170, 'font-size':26, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal });\nconst eqR = el('text', { x:1010, y:170, 'font-size':26, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal });\nconst verdict = el('g', {});\nconst vRect = el('rect', { x:480, y:200, width:320, height:44, rx:22, fill:C.mint, filter:'url(#soft)' }, verdict);\nconst vText = el('text', { x:640, y:229, 'font-size':21, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal }, verdict);\n\nfunction panExpr(side) {\n  const list = cards.filter(c => { const s = slots.find(x => x.id === c.slot); return s && s.pan === (side \u003c 0 ? 'L' : 'R'); })\n    .sort((a, b) => a.slot \u003c b.slot ? -1 : 1);\n  if (!list.length) return '空';\n  return list.map(c => c.n).join(' + ') + ' = ' + list.reduce((a, c) => a + c.n, 0);\n}\n\nfunction layout(instant) {\n  const th = currentTheta();\n  beamG.setAttribute('transform', `rotate(${th * 180 / Math.PI} ${FUL.x} ${FUL.y})`);\n  beamG.style.transition = instant ? 'none' : 'transform .45s cubic-bezier(.34,1.56,.64,1)';\n  [panL, panR].forEach((g, i) => {\n    const side = i === 0 ? -1 : 1;\n    const a = panAnchor(side);\n    g.setAttribute('transform', `translate(${a.x} ${a.y})`);\n    g.style.transition = instant ? 'none' : 'transform .45s cubic-bezier(.34,1.56,.64,1)';\n  });\n  cards.forEach(c => { if (!c.drag) { const s = slots.find(x => x.id === c.slot); const p = slotPos(s);\n    c.g.setAttribute('transform', `translate(${p.x} ${p.y})`);\n    c.g.style.transition = instant ? 'none' : 'transform .45s cubic-bezier(.34,1.56,.64,1)'; } });\n  eqL.textContent = panExpr(-1);\n  eqR.textContent = panExpr(1);\n  const l = panSum(-1), r = panSum(1);\n  if (l === 0 && r === 0) { vis2(verdict, 0); return; }\n  vis2(verdict, 1);\n  if (l === r) { vRect.setAttribute('fill', C.mint); vText.setAttribute('fill', C.teal);\n    vText.textContent = '平衡！两边一样多'; }\n  else { vRect.setAttribute('fill', C.coral); vText.setAttribute('fill', '#FFF');\n    vText.textContent = l > r ? '左边沉下去了' : '右边沉下去了';\n    if (!tiltSeen) { tiltSeen = true; log('把卡片拿走后，天平倾斜了——两边不一样多就不平衡。'); } }\n}\nfunction vis2(e, p) { e.setAttribute('opacity', String(clamp(p, 0, 1))); }\n\n/* ============ 拖拽 ============ */\nfunction svgPoint(evt) {\n  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction bindDrag(c) {\n  c.g.addEventListener('pointerdown', e => {\n    e.preventDefault();\n    const p = svgPoint(e);\n    c.drag = { dx: p.x - Number(c.g.__x || 0), dy: p.y - Number(c.g.__y || 0) };\n    const m = /translate\\(([-\\d.]+) ([-\\d.]+)\\)/.exec(c.g.getAttribute('transform') || 'translate(0 0)');\n    c.g.__x = m ? +m[1] : 0; c.g.__y = m ? +m[2] : 0;\n    c.drag.dx = p.x - c.g.__x; c.drag.dy = p.y - c.g.__y;\n    c.g.style.transition = 'none';\n    svg.appendChild(c.g);   // 置顶\n    c.g.setPointerCapture(e.pointerId);\n  });\n  c.g.addEventListener('pointermove', e => {\n    if (!c.drag) return;\n    const p = svgPoint(e);\n    c.g.__x = p.x - c.drag.dx; c.g.__y = p.y - c.drag.dy;\n    c.g.setAttribute('transform', `translate(${c.g.__x} ${c.g.__y})`);\n  });\n  c.g.addEventListener('pointerup', e => {\n    if (!c.drag) return;\n    c.drag = null;\n    // 找最近空槽\n    let best = null, bd = 1e9;\n    for (const s of slots) {\n      if (cards.some(o => o !== c && o.slot === s.id)) continue;\n      const p = slotPos(s);\n      const d = Math.hypot(p.x - c.g.__x, p.y - c.g.__y);\n      if (d \u003c bd) { bd = d; best = s; }\n    }\n    const oldSlot = c.slot;\n    if (best && bd \u003c 130) c.slot = best.id;\n    const os = slots.find(x => x.id === oldSlot), ns = slots.find(x => x.id === c.slot);\n    if (os && ns && os.pan && ns.pan && os.pan !== ns.pan) {\n      // 换盘了：若两盘数相同集，仍平衡\n      swapCount++;\n      log(`第 ${swapCount} 次换位置：左盘 ${panExpr(-1)}，右盘 ${panExpr(1)}`);\n    } else if (os && ns && (os.shelf !== undefined) !== (ns.shelf !== undefined)) {\n      log(ns.shelf !== undefined ? '把一张卡片放回架子，天平变了。' : '把卡片拿回托盘。');\n    }\n    layout(false);\n  });\n}\n\n/* ============ 换数 / 记录 ============ */\nconst btnG = el('g', { class:'card' });\nel('rect', { x:1120, y:28, width:118, height:36, rx:18, fill:'#FFF', stroke:C.teal, 'stroke-width':2 }, btnG);\nel('text', { x:1179, y:52, 'font-size':16, 'text-anchor':'middle', fill:C.teal, 'font-weight':'bold' }, btnG).textContent = '换一组数';\nbtnG.style.cursor = 'pointer';\nbtnG.addEventListener('click', () => {\n  presetIdx = (presetIdx + 1) % PRESETS.length;\n  makeCards(PRESETS[presetIdx]);\n  log(`换成 ${PRESETS[presetIdx].join(' 和 ')} 再试。`);\n});\n\n/* 发现记录（回填契约：与播放器同一字段机制） */\nconst logG = el('g', {});\nel('rect', { x:60, y:560, width:400, height:140, rx:14, fill:'#FFF', stroke:'#E3D5C0', 'stroke-width':1.5, filter:'url(#soft)' }, logG);\nel('text', { x:78, y:586, 'font-size':15, 'font-weight':'bold', fill:C.inkSoft }, logG).textContent = '实验记录';\nconst logText = el('text', { x:78, y:610, 'font-size':14, fill:C.ink }, logG);\nconst logLines = [];\nfunction log(s) {\n  logLines.push(s); if (logLines.length > 4) logLines.shift();\n  logText.innerHTML = '';\n  logLines.forEach((l, i) => {\n    const t = el('tspan', { x:78, dy:i ? 20 : 0 }, logText); t.textContent = l;\n  });\n}\nconst recG = el('g', {});\nel('rect', { x:78, y:660, width:160, height:32, rx:16, fill:C.coral }, recG);\nel('text', { x:158, y:682, 'font-size':15, 'text-anchor':'middle', fill:'#FFF', 'font-weight':'bold' }, recG).textContent = '写下我的发现';\nrecG.style.cursor = 'pointer';\nrecG.addEventListener('click', () => {\n  if(window.parent !== window)window.parent.postMessage({type:'lab-focus',id:'lab-swap-finding'},'*');\n});\n/* 原型页自演示：页面底部回显字段写入结果（嵌入课件时不显示） */\nconst echo = document.createElement('div');\necho.style.cssText = 'max-width:1180px;margin:8px auto;padding:10px 14px;background:#F3EBDD;border-radius:10px;font-size:14px;color:#53675E';\necho.textContent = '字段 lab-swap-finding（待记录）';\nif (window.parent === window) document.body.appendChild(echo);\ndocument.addEventListener('lab-field', e => { echo.textContent = e.detail.id + '：' + e.detail.value; });\n\nmakeCards(PRESETS[0]);\nlayout(true);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}], "activity_title": "天平实验台", "instruction": "实验后，在下面用自己的话写下发现；也可以先跳过。"}, {"id": "S02", "title": "加法交换律", "start": 47.733333, "end": 68.333333, "narration": "两个数相加，交换加数的位置，和不变。这就是加法交换律，用字母表示：a 加 b 等于 b 加 a。它还能帮我们验算：交换加数再算一遍。如果两次结果不同，就要检查计算过程。", "fields": [{"id": "s02-letter", "type": "fill", "prompt": "加法交换律用字母表示：a + b = ____", "answers": ["b+a", "b + a"]}]}, {"id": "S03", "title": "树苗与花苗", "start": 68.333333, "end": 110.233333, "narration": "学校还要购进冬青 56 棵、柳树 72 棵、杨树 28 棵。总数怎么算？可以先算 56 加 72 得 128，再加 28，是 156 棵；也可以先算 72 加 28，正好凑成 100，再加 56，也是 156 棵。花苗也一样：月季 80 棵、牡丹 88 棵、茶花 112 棵，先算 88 加 112 凑成 200，总数 280 棵。你发现了吗？先把哪两个数相加，总数都不变。", "fields": [{"id": "lab-magnet-finding", "type": "observe", "prompt": "凑整磁铁：拖动数字卡片分组做实验，然后记录你的发现。", "lab_srcdoc": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>凑整磁铁 · 加法结合律\u003c/title>\n\u003cstyle>\n  html,body{margin:0;padding:0;background:#FFFAF0;font-family:\"PingFang SC\",\"Microsoft YaHei\",sans-serif}\n  svg{display:block;width:100%;max-width:1280px;margin:0 auto;user-select:none;touch-action:none}\n  .card{cursor:grab}.card:active{cursor:grabbing}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg id=\"lab\" viewBox=\"0 0 1280 720\" xmlns=\"http://www.w3.org/2000/svg\">\u003c/svg>\n\u003cscript>\n'use strict';\nconst C = { canvas:'#FFFAF0', ink:'#22333C', inkSoft:'#53675E', coral:'#FF6B5A',\n            ochre:'#E8B94A', mint:'#A4D4C5', teal:'#1A3A3A', peach:'#FFC9A3', lav:'#B8A4ED' };\nconst NS = 'http://www.w3.org/2000/svg';\nconst svg = document.getElementById('lab');\nfunction el(name, attrs, parent) {\n  const e = document.createElementNS(NS, name);\n  for (const k in attrs) e.setAttribute(k, attrs[k]);\n  (parent || svg).appendChild(e);\n  return e;\n}\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n\nconst defs = el('defs', {});\nconst soft = el('filter', { id:'soft', x:'-30%', y:'-30%', width:'160%', height:'160%' }, defs);\nel('feDropShadow', { dx:0, dy:5, stdDeviation:6, 'flood-color':'#1A3A3A', 'flood-opacity':0.18 }, soft);\nconst glowF = el('filter', { id:'glow', x:'-60%', y:'-60%', width:'220%', height:'220%' }, defs);\nel('feDropShadow', { dx:0, dy:0, stdDeviation:8, 'flood-color':C.ochre, 'flood-opacity':0.95 }, glowF);\nconst radial = el('radialGradient', { id:'glowbg', cx:'50%', cy:'40%', r:'78%' }, defs);\nel('stop', { offset:'0%', 'stop-color':'#FFFDF6' }, radial);\nel('stop', { offset:'100%', 'stop-color':'#FDF3DF' }, radial);\n\n/* 背景与标题 */\nel('rect', { x:0, y:0, width:1280, height:720, fill:'url(#glowbg)' });\nel('rect', { x:60, y:28, width:236, height:30, rx:15, fill:C.teal });\nel('text', { x:178, y:49, 'font-size':16, 'text-anchor':'middle', fill:'#FFF', 'letter-spacing':2 })\n  .textContent = '实验台 · 加法结合律';\nel('text', { x:60, y:98, 'font-size':32, 'font-weight':'bold', fill:C.ink })\n  .textContent = '凑整磁铁：括号先抱住谁，总数会变吗';\nel('path', { d:'M 62 114 q 42 7 84 0 t 84 0 t 84 0 t 60 0', fill:'none', stroke:C.ochre, 'stroke-width':5, 'stroke-linecap':'round' });\nel('text', { x:60, y:146, 'font-size':17, fill:C.inkSoft })\n  .textContent = '把数字卡拖进算式，再左右拖动括号框，换一个\"先算\"的组合。凑成整十整百的一对会发光吸住！';\n\n/* 算式区 */\nconst SLOT_Y = 280, SLOT_XS = [430, 640, 850], CARD_W = 104, CARD_H = 60;\nel('text', { x:SLOT_XS[0]+62, y:SLOT_Y+12, 'font-size':40, 'font-weight':'bold', fill:C.inkSoft }).textContent = '+';\nel('text', { x:SLOT_XS[1]+62, y:SLOT_Y+12, 'font-size':40, 'font-weight':'bold', fill:C.inkSoft }).textContent = '+';\n// 槽位底框\nconst slotFrames = SLOT_XS.map(x =>\n  el('rect', { x:x-CARD_W/2, y:SLOT_Y-CARD_H/2, width:CARD_W, height:CARD_H, rx:14,\n    fill:'#FFF', stroke:'#D8CCBA', 'stroke-width':2, 'stroke-dasharray':'7 5' }));\n\n/* 括号框（可左右拖，两个卡位） */\nconst BR = { leftX: SLOT_XS[0]-CARD_W/2-18, rightX: SLOT_XS[1]-CARD_W/2-18,\n             w: CARD_W*2+88, y: SLOT_Y-CARD_H/2-16, h: CARD_H+32 };\nconst bracket = el('g', { class:'card' });\nel('rect', { x:0, y:0, width:BR.w, height:BR.h, rx:20, fill:'#FFFFFF', 'fill-opacity':0.01, stroke:C.ochre, 'stroke-width':4.5 }, bracket);\nel('path', { d:`M ${BR.w/2-16} -2 l 16 -14 l 16 14`, fill:'none', stroke:C.ochre, 'stroke-width':4, 'stroke-linecap':'round','stroke-linejoin':'round' }, bracket);\nconst brLabel = el('text', { x:BR.w/2, y:BR.h+26, 'font-size':17, 'font-weight':'bold', 'text-anchor':'middle', fill:C.ochre }, bracket);\nbrLabel.textContent = '先算括号里';\nlet bracketPos = 'L';   // 'L' 抱左两张，'R' 抱右两张\nfunction bracketTarget() { return bracketPos === 'L' ? BR.leftX : BR.rightX; }\nfunction placeBracket(instant) {\n  bracket.setAttribute('transform', `translate(${bracketTarget()} ${BR.y})`);\n  bracket.style.transition = instant ? 'none' : 'transform .4s cubic-bezier(.34,1.56,.64,1)';\n}\n\n/* 卡片 */\nconst PRESETS = [[56,72,28],[80,88,112],[63,282,37]];\nconst CARD_COLORS = [C.mint, C.peach, C.lav];\nlet presetIdx = 0, regroupCount = 0, magnetSeen = 0;\nconst cards = [];\nfunction makeCards(nums) {\n  cards.forEach(c => c.g.remove()); cards.length = 0;\n  nums.forEach((n, i) => {\n    const g = el('g', { class:'card', filter:'url(#soft)' });\n    const r = el('rect', { x:-CARD_W/2, y:-CARD_H/2, width:CARD_W, height:CARD_H, rx:14,\n      fill:CARD_COLORS[i], stroke:'#FFF', 'stroke-width':2 }, g);\n    const t = el('text', { y:10, 'font-size':28, 'font-weight':'bold', 'text-anchor':'middle', fill:C.ink }, g);\n    t.textContent = n;\n    const c = { n, i, g, r, slot:'pool'+i, drag:null };\n    cards.push(c); bindDrag(c);\n  });\n  layout(true);\n}\nfunction poolPos(i) { return { x: 400 + i*240, y: 560 }; }\n// 卡片架\nel('rect', { x:300, y:520, width:680, height:86, rx:16, fill:'#F5EBD7', stroke:'#E3D5C0', 'stroke-width':1.5 });\nel('text', { x:324, y:550, 'font-size':15, fill:C.inkSoft }).textContent = '数字卡（拖进上面算式）';\nfunction slotCenter(slot) {\n  if (slot.startsWith('pool')) return poolPos(Number(slot.slice(4)));\n  return { x: SLOT_XS[Number(slot.slice(1))], y: SLOT_Y };\n}\nfunction exprCards() {   // 按槽位顺序返回 [c0,c1,c2]，可能为 null\n  return [0,1,2].map(i => cards.find(c => c.slot === 'e'+i) || null);\n}\n\n/* 计算显示 */\nconst step1 = el('text', { x:640, y:420, 'font-size':26, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal });\nconst step2 = el('text', { x:640, y:462, 'font-size':30, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal });\nconst badge = el('g', {});\nconst bRect = el('rect', { x:540, y:488, width:200, height:40, rx:20, fill:C.mint, filter:'url(#soft)' }, badge);\nconst bText = el('text', { x:640, y:515, 'font-size':19, 'font-weight':'bold', 'text-anchor':'middle', fill:C.teal }, badge);\nbadge.setAttribute('opacity', '0');\n\nfunction updateCalc() {\n  const [c0, c1, c2] = exprCards();\n  cards.forEach(c => { c.r.setAttribute('filter', 'url(#soft)'); c.g.style.filter=''; });\n  badge.setAttribute('opacity', '0');\n  if (!c0 || !c1 || !c2) {\n    step1.textContent = '把三张数字卡都拖进算式';\n    step2.textContent = '';\n    return;\n  }\n  const nums = [c0.n, c1.n, c2.n];\n  const pairIdx = bracketPos === 'L' ? [0,1] : [1,2];\n  const pairSum = nums[pairIdx[0]] + nums[pairIdx[1]];\n  const other = nums[bracketPos === 'L' ? 2 : 0];\n  const total = pairSum + other;\n  const exprTxt = bracketPos === 'L'\n    ? `（${nums[0]} + ${nums[1]}）+ ${nums[2]}` : `${nums[0]} +（${nums[1]} + ${nums[2]}）`;\n  step1.textContent = `${exprTxt}：先算 ${nums[pairIdx[0]]} + ${nums[pairIdx[1]]} = ${pairSum}`;\n  step2.textContent = `再算 ${bracketPos==='L' ? pairSum + ' + ' + other : other + ' + ' + pairSum} = ${total}`;\n  const round = pairSum % 100 === 0 || pairSum % 10 === 0;\n  if (round) {\n    [c0,c1,c2][pairIdx[0]].r.setAttribute('filter', 'url(#glow)');\n    [c0,c1,c2][pairIdx[1]].r.setAttribute('filter', 'url(#glow)');\n    badge.setAttribute('opacity', '1');\n    bText.textContent = `凑整啦！${nums[pairIdx[0]]} + ${nums[pairIdx[1]]} = ${pairSum}`;\n    magnetSeen++;\n  }\n}\n\n/* 布局 */\nfunction layout(instant) {\n  placeBracket(instant);\n  cards.forEach(c => {\n    if (c.drag) return;\n    const p = slotCenter(c.slot);\n    c.g.setAttribute('transform', `translate(${p.x} ${p.y})`);\n    c.g.style.transition = instant ? 'none' : 'transform .4s cubic-bezier(.34,1.56,.64,1)';\n  });\n  updateCalc();\n}\n\n/* 拖拽 */\nfunction svgPoint(evt) {\n  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;\n  return pt.matrixTransform(svg.getScreenCTM().inverse());\n}\nfunction bindDrag(c) {\n  c.g.addEventListener('pointerdown', e => {\n    e.preventDefault();\n    const p = svgPoint(e);\n    const m = /translate\\(([-\\d.]+) ([-\\d.]+)\\)/.exec(c.g.getAttribute('transform') || 'translate(0 0)');\n    c.g.__x = m ? +m[1] : 0; c.g.__y = m ? +m[2] : 0;\n    c.drag = { dx: p.x - c.g.__x, dy: p.y - c.g.__y };\n    c.g.style.transition = 'none';\n    svg.appendChild(c.g);\n    c.g.setPointerCapture(e.pointerId);\n  });\n  c.g.addEventListener('pointermove', e => {\n    if (!c.drag) return;\n    const p = svgPoint(e);\n    c.g.__x = p.x - c.drag.dx; c.g.__y = p.y - c.drag.dy;\n    c.g.setAttribute('transform', `translate(${c.g.__x} ${c.g.__y})`);\n  });\n  c.g.addEventListener('pointerup', () => {\n    if (!c.drag) return;\n    c.drag = null;\n    // 候选槽：三个算式槽 + 三个池槽\n    const cands = [0,1,2].map(i => ({ id:'e'+i, ...slotCenter('e'+i) }))\n      .concat([0,1,2].map(i => ({ id:'pool'+i, ...poolPos(i) })))\n      .filter(s => !cards.some(o => o !== c && o.slot === s.id));\n    let best = null, bd = 1e9;\n    for (const s of cands) {\n      const d = Math.hypot(s.x - c.g.__x, s.y - c.g.__y);\n      if (d \u003c bd) { bd = d; best = s; }\n    }\n    if (best && bd \u003c 120) c.slot = best.id;\n    layout(false);\n  });\n}\n/* 括号拖动（水平） */\n(function bindBracket() {\n  let drag = null;\n  bracket.addEventListener('pointerdown', e => {\n    e.preventDefault();\n    const p = svgPoint(e);\n    const m = /translate\\(([-\\d.]+)/.exec(bracket.getAttribute('transform') || 'translate(0');\n    drag = { dx: p.x - (m ? +m[1] : bracketTarget()) };\n    bracket.style.transition = 'none';\n    bracket.setPointerCapture(e.pointerId);\n  });\n  bracket.addEventListener('pointermove', e => {\n    if (!drag) return;\n    const p = svgPoint(e);\n    bracket.setAttribute('transform', `translate(${clamp(p.x - drag.dx, BR.leftX, BR.rightX)} ${BR.y})`);\n  });\n  bracket.addEventListener('pointerup', e => {\n    if (!drag) return;\n    drag = null;\n    const p = svgPoint(e);\n    const mid = (BR.leftX + BR.rightX) / 2;\n    const finalPos = p.x > mid ? 'R' : 'L';\n    if (finalPos !== bracketPos) {\n      bracketPos = finalPos;\n      regroupCount++;\n      log(`第 ${regroupCount} 次换括号：${bracketPos === 'L' ? '先算前两个数' : '先算后两个数'}`);\n    }\n    layout(false);\n
